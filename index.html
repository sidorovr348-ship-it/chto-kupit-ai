<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>My AI Unified</title><style>body{margin:0;background:#0b0b0d;color:#f5f5f7;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 30px}h1{margin:4px 0}.sub{color:#999;margin-bottom:10px}.status{font-size:13px;color:#aaa}.chat{min-height:62vh;background:#151518;border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto}.m{padding:12px 14px;border-radius:20px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-width:94%}.ai{background:#222226;align-self:flex-start}.me{background:#fff;color:#111;align-self:flex-end}.bar{display:flex;gap:8px;margin-top:10px}.bar textarea{flex:1;min-height:52px;border:0;border-radius:28px;padding:14px;background:#202024;color:#fff;font:inherit}.bar button,.actions button{border:0;border-radius:24px;font-weight:700}.bar button{width:58px;background:#fff;font-size:21px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.actions button{padding:13px 8px;background:#202024;color:#fff}.source{display:block;color:#9cc7ff;margin-top:6px;word-break:break-all}.pic{max-width:100%;border-radius:18px;margin-top:8px}.small{color:#777;font-size:12px;text-align:center;margin-top:9px}a{color:#9cc7ff}</style></head><body><main><h1>🧠 My AI Unified</h1><div class="sub">Единый AI-помощник: чат, голос и создание изображений.</div><div class="status" id="st">🟡 Запускаюсь…</div><section class="chat" id="chat"><div class="m ai">Готов. Напиши задачу или нажми 🎙️. Можно попросить найти информацию, помочь с кодом, создать изображение или ответить на вопрос.</div></section><div class="bar"><textarea id="in" placeholder="Напиши задачу…"></textarea><button id="send">➤</button></div><div class="actions"><button id="mic">🎙️ Голос</button><button id="img">🖼️ Файл/фото</button><button id="file">📎 Файл</button><button id="gen">🎨 Создать</button><button id="sound">🔊 Звук</button><button id="clear">↻ Сначала</button></div><div class="small">Работает без Vercel. Основной чат использует доступный AI-маршрут.</div><input id="fi" type="file" hidden accept=".txt,.md,.csv,.json,.xml,.html,.pdf,.docx,.xlsx,image/*"></main><script>const $=s=>document.querySelector(s),chat=$('#chat'),inp=$('#in'),st=$('#st');let sound=true;function add(t,c='ai'){let d=document.createElement('div');d.className='m '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}function speak(t){if(!sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(t).slice(0,3500));u.lang='ru-RU';u.rate=.95;speechSynthesis.speak(u)}function rich(t){let d=add('');let p=String(t).split(/(https?:\/\/[^\s]+)/g);p.forEach((x,i)=>{if(i%2){let a=document.createElement('a');a.className='source';a.target='_blank';a.rel='noopener';a.href=x;a.textContent=x;d.appendChild(a)}else d.append(document.createTextNode(x))});return d}async function ai(t){let model=/найди|цена|магазин|новост|сейчас|сегодня|интернет|сайт|где купить/i.test(t)?'gemini-search':'openai';let u='https://text.pollinations.ai/?model='+encodeURIComponent(model)+'&prompt='+encodeURIComponent('Отвечай по-русски естественно и по делу. Ты My AI Unified. '+t);let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('AI HTTP '+r.status);let x=(await r.text()).trim();if(!x)throw Error('AI вернул пустой ответ');return x}function local(t){let x=t.toLowerCase();if(/^привет[!,. ]*$/.test(x))return'Привет! Я My AI Unified. Готов работать.';if(/кто ты|что ты за/.test(x))return'Я My AI Unified — единый AI-помощник.';if(/время.*моск|сколько.*врем/.test(x))return'Сейчас в Москве '+new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())+'.';if(/сегодня.*дата|какая.*дата/.test(x))return'Сегодня: '+new Intl.DateTimeFormat('ru-RU',{dateStyle:'full'}).format(new Date())+'.';return null}async function send(){let t=inp.value.trim();if(!t)return;add(t,'me');inp.value='';let l=local(t);if(l){add(l);speak(l);return}let w=add('⏳ Думаю…');try{let r=await ai(t);w.remove();rich(r);speak(r)}catch(e){w.remove();add('🔴 '+e.message)}}$('#send').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('🎙️ Используй микрофон клавиатуры iPhone.');return}let r=new R();r.lang='ru-RU';r.interimResults=false;r.continuous=false;r.onresult=e=>{inp.value=e.results[0][0].transcript;send()};r.onerror=()=>add('🔴 Не удалось получить голос.');try{r.start()}catch{add('🔴 Микрофон уже используется.')}};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Звук':'🔇 Звук выкл';if(!sound)speechSynthesis?.cancel()};$('#clear').onclick=()=>{speechSynthesis?.cancel();chat.innerHTML='<div class="m ai">Готов. Напиши задачу.</div>'};$('#gen').onclick=()=>{let p=inp.value.trim();if(!p){add('Сначала напиши, что создать.');return}add('🎨 '+p,'me');inp.value='';let d=add('');let im=document.createElement('img');im.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?model=flux&width=1024&height=1024&nologo=true';im.className='pic';d.appendChild(im);let a=document.createElement('a');a.href=im.src;a.target='_blank';a.className='source';a.textContent='Открыть изображение';d.appendChild(a)};$('#img').onclick=()=>$('#fi').click();$('#file').onclick=()=>$('#fi').click();$('#fi').onchange=()=>{let f=$('#fi').files[0];if(!f)return;add('📎 '+f.name,'me');add('Файл принят. Для полного анализа документа нужен серверный AI-маршрут; пока можно скопировать текст сюда.');$('#fi').value=''};st.textContent='🟢 Приложение запущено';</script></main></body></html>
