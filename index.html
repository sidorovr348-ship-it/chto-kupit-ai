<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><meta http-equiv="Cache-Control" content="no-store"><meta name="app-version" content="2026-09-14-robust-1"><title>My AI Unified</title><style>:root{--bg:#0b0b0d;--panel:#151518;--soft:#202024;--text:#f5f5f7;--muted:#999;--blue:#9cc7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:800px;margin:auto;padding:18px 14px 30px}h1{font-size:29px;margin:4px 0}.sub{color:var(--muted);margin-bottom:10px}.status{font-size:12px;color:#aaa;margin-bottom:10px}.chat{min-height:52vh;max-height:68vh;background:var(--panel);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto}.msg{padding:12px 14px;border-radius:20px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;max-width:96%}.ai{background:#222226;align-self:flex-start}.user{background:#fff;color:#111;align-self:flex-end}.msg a{color:var(--blue);display:block;margin-top:6px;word-break:break-all}.bar{display:flex;gap:8px;margin-top:10px}.bar textarea{flex:1;resize:none;border:0;border-radius:22px;padding:14px;background:var(--soft);color:#fff;font:inherit;min-height:52px}.bar button{width:58px;background:#fff;border:0;border-radius:999px;font-size:22px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.actions button{padding:13px 8px;background:var(--soft);color:#fff;border:0;border-radius:999px;font-weight:700}.actions button.active{background:#fff;color:#111}.camera{display:none;background:#000;border-radius:22px;padding:8px;margin-top:10px}.camera video{width:100%;border-radius:16px;display:block;max-height:55vh;object-fit:cover}.cambar{display:flex;gap:8px;margin-top:8px}.cambar button{flex:1;border:0;border-radius:999px;padding:12px;font-weight:700}.hint{color:#777;font-size:12px;text-align:center;margin-top:9px}.card{background:#1d1d21;border-radius:16px;padding:12px;margin-top:8px}.price{font-weight:800;font-size:18px}.muted{color:#aaa;font-size:12px}</style></head><body><main><h1>🧠 My AI Unified</h1><div class="sub">Чат, поиск, товары, фото, камера, видео, файлы, голос и картинки.</div><div class="status" id="status">🟡 Проверяю сервер…</div><section class="chat" id="chat"><div class="msg ai">Готов. Напиши задачу или используй кнопки ниже.</div></section><div class="bar"><textarea id="input" placeholder="Напиши или продиктуй задачу…"></textarea><button id="send">➤</button></div><div class="actions"><button id="voice">🎙️ Голос</button><button id="photo">📷 Фото</button><button id="camera">📹 Камера</button><button id="video">🎬 Видео</button><button id="file">📎 Файл</button><button id="imagegen">🎨 Картинка</button><button id="sound" class="active">🔊 Звук</button><button id="stop">⏹ Стоп</button><button id="clear">🧹 Очистить</button></div><section class="camera" id="cameraBox"><video id="cam" autoplay playsinline muted></video><div class="cambar"><button id="camAnalyze">🔎 Что это?</button><button id="camShot">📸 Снимок</button><button id="camOff">⏹ Выключить</button></div></section><div class="hint">My AI Unified · API: ai.aliceq.ru</div><input id="photoInput" type="file" accept="image/*" capture="environment" multiple hidden><input id="videoInput" type="file" accept="video/*" capture="environment" hidden><input id="fileInput" type="file" accept=".txt,.md,.csv,.tsv,.json,.xml,.html,.pdf,.docx,.xlsx,.xls" hidden></main><script>const API='https://ai.aliceq.ru',$=s=>document.querySelector(s),chat=$('#chat'),input=$('#input'),status=$('#status');let sound=true,player=null,messages=[],stream=null,busy=false;const add=(text,who='ai')=>{const d=document.createElement('div');d.className='msg '+who;d.textContent=String(text??'');chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d};function rich(text,sources=[]){const d=add('','ai');for(const p of String(text??'').split(/(https?:\/\/[^\s]+)/g)){if(/^https?:\/\//i.test(p)){const a=document.createElement('a');a.href=p;a.target='_blank';a.rel='noopener noreferrer';a.textContent=p;d.appendChild(a)}else d.appendChild(document.createTextNode(p))}for(const s of sources||[]){if(/^https?:\/\//i.test(String(s?.link||''))){const a=document.createElement('a');a.href=s.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Источник: '+(s.title||s.link);d.appendChild(a)}}return d}async function post(path,body,timeout=120000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body),cache:'no-store',mode:'cors',signal:c.signal});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.error||('Ошибка сервера HTTP '+r.status));return j}catch(e){if(e.name==='AbortError')throw Error('Сервер не ответил вовремя.');if(e.message==='Load failed'||e.message==='Failed to fetch'||e.message==='NetworkError when attempting to fetch resource.')throw Error('Не удаётся связаться с AI-сервером. Проверь интернет/VPN и повтори.');throw e}finally{clearTimeout(tm)}},body:JSON.stringify(body),cache:'no-store',signal:c.signal});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.error||'Ошибка сервера HTTP '+r.status);return j}catch(e){throw Error(e.name==='AbortError'?'Сервер не ответил вовремя.':e.message)}finally{clearTimeout(tm)}}async function check(){try{const r=await fetch(API+'/health?t='+Date.now(),{cache:'no-store'}),j=await r.json();if(!j.ok)throw Error();const a=j.adapters||{};let s=a.groq?'🟢 AI подключён':'🔴 AI не настроен';if(a.groqVision)s+=' · фото';if(a.documents)s+=' · документы';if(a.video)s+=' · видео';if(a.imageGeneration)s+=' · картинки';if(a.tts)s+=' · голос';status.textContent=s;return true}catch{status.textContent='🔴 Сервер недоступен';return false}}function stop(){if(player){player.pause();const u=player.src;player=null;try{URL.revokeObjectURL(u)}catch{}}if('speechSynthesis'in window)speechSynthesis.cancel()}async function speak(text){if(!sound)return;try{stop();const r=await fetch(API+'/tts',{method:'POST',headers:{'Content-Type':'application/json','Accept':'audio/mpeg'},body:JSON.stringify({text:String(text).slice(0,3500)}),cache:'no-store',mode:'cors'});if(!r.ok)throw Error('TTS HTTP '+r.status);const blob=await r.blob();if(!blob.size)throw Error('Пустой звук');const u=URL.createObjectURL(blob);player=new Audio(u);player.onended=()=>{URL.revokeObjectURL(u);player=null};await player.play()}catch(e){if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(String(text).slice(0,2500));u.lang='ru-RU';u.rate=.96;speechSynthesis.speak(u)}}},body:JSON.stringify({text:String(text).slice(0,3500)}),cache:'no-store'});if(!r.ok)throw Error();const u=URL.createObjectURL(await r.blob());player=new Audio(u);player.onended=()=>{URL.revokeObjectURL(u);player=null};await player.play()}catch{if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(String(text).slice(0,2500));u.lang='ru-RU';u.rate=.96;speechSynthesis.speak(u)}}}const purchase=q=>/(найди|найти|где купить|купить|цена|стоимость|в наличии|магазин|закаж|продаж|дешевле|сравни|актуальн).*|\b(товар|телефон|телевизор|стиральн|карниз|конструктор)\b/iu.test(q);async function send(){const text=input.value.trim();if(!text||busy)return;add(text,'user');input.value='';messages.push({role:'user',content:text});const w=add('⏳ Выполняю…');busy=true;try{const j=purchase(text)?await post('/shopping',{query:text}):await post('/chat',{prompt:text,messages});w.remove();if(Array.isArray(j.results)){renderShopping(j);const summary=j.results.slice(0,6).map(x=>`${x.store||'Магазин'}: ${x.title||'товар'} — ${x.price!=null?x.price+' '+(x.currency||'RUB'):'цена не указана'} — ${x.availability==='in_stock'?'в наличии':x.availability==='out_of_stock'?'нет в наличии':'наличие не подтверждено'}`).join('\n');messages.push({role:'assistant',content:summary});if(summary)speak(summary)}else{messages.push({role:'assistant',content:j.result||''});rich(j.result,j.sources);speak(j.result)}}catch(e){w.remove();add('🔴 '+e.message);check()}finally{busy=false}}function renderShopping(j){if(!j.results.length){add('Поиск не дал предложений. Уточни модель или город.');return}for(const x of j.results.slice(0,12)){const d=document.createElement('div');d.className='card';const title=document.createElement('b');title.textContent=x.title||'Товар';const store=document.createElement('div');store.className='muted';store.textContent=x.store||'Магазин не определён';const p=document.createElement('div');p.className='price';p.textContent=x.price!=null?String(x.price)+' '+(x.currency||'RUB'):'Цена не указана';const av=document.createElement('div');av.className='muted';av.textContent=x.availability==='in_stock'?'🟢 В наличии':x.availability==='out_of_stock'?'🔴 Нет в наличии':'🟡 Наличие не подтверждено';d.append(title,store,p,av);if(/^https?:\/\//i.test(String(x.url||''))){const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Открыть магазин';d.appendChild(a)}chat.appendChild(d)}chat.scrollTop=chat.scrollHeight}function dataUrl(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Не удалось прочитать файл'));r.readAsDataURL(file)})}async function analyzeImages(files,label='📷'){const a=[...files].slice(0,5);if(!a.length)return;add(label+' '+a.map(f=>f.name||'изображение').join(', '),'user');const w=add(`⏳ Анализирую ${a.length} изображени${a.length===1?'е':'я'}…`);try{const images=[];for(const f of a){if(f.size>8*1024*1024)throw Error('Изображение слишком большое (максимум 8 МБ).');images.push(await dataUrl(f))}const j=await post('/photo',{images,prompt:'Проанализируй изображения подробно по-русски. Если это товар, определи бренд, модель и видимые характеристики. Сравни изображения, если их несколько. Не выдумывай неизвестное.'});w.remove();rich(j.result);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}}function captureFrame(v){const c=document.createElement('canvas'),width=Math.min(1280,v.videoWidth||1280),height=Math.max(1,Math.round(width*(v.videoHeight||720)/(v.videoWidth||1280)));c.width=width;c.height=height;c.getContext('2d').drawImage(v,0,0,width,height);return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(Error('Не удалось получить кадр')),'image/jpeg',.78))}async function analyzeVideo(file){if(file.size>120*1024*1024)return add('🔴 Видео слишком большое (максимум 120 МБ).');add('🎬 '+file.name,'user');const url=URL.createObjectURL(file),v=document.createElement('video');v.src=url;v.muted=true;v.playsInline=true;v.preload='metadata';const w=add('⏳ Готовлю кадры 4 / 7 / 10 сек.…');try{await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(Error('Не удалось прочитать видео'))});const times=[4,7,10].filter(t=>Number.isFinite(v.duration)&&t<v.duration-.05);if(!times.length)times.push(Math.max(0,(v.duration||0)/2));const images=[];for(const t of times){v.currentTime=t;await new Promise((ok,no)=>{v.onseeked=ok;v.onerror=()=>no(Error('Не удалось получить кадр'))});images.push(await dataUrl(await captureFrame(v)))}w.remove();const j=await post('/photo',{images,prompt:`Это ${images.length} последовательных кадров одного видео, снятых примерно в моменты ${times.map(x=>x+' сек.').join(', ')}. Проанализируй их вместе и опиши, что происходит и что изменяется во времени. Отвечай по-русски, не выдумывай неизвестное.`},150000);rich(j.result);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}finally{URL.revokeObjectURL(url)}}async function analyzeDocument(file){if(file.size>30*1024*1024)return add('🔴 Файл слишком большой (максимум 30 МБ).');add('📎 '+file.name,'user');const w=add('⏳ Извлекаю текст и анализирую…');try{const j=await post('/document',{name:file.name,mime:file.type,file:await dataUrl(file)},150000);w.remove();rich(j.result);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}}async function openFile(file){if(file.type.startsWith('image/'))return analyzeImages([file]);if(/\.(txt|md|csv|tsv|json|xml|html)$/i.test(file.name)){if(file.size>2*1024*1024)return add('🔴 Текстовый файл слишком большой (максимум 2 МБ).');const w=add('⏳ Анализирую файл…');try{const text=await file.text(),j=await post('/chat',{prompt:`Проанализируй файл «${file.name}» по-русски.\n\n${text.slice(0,150000)}`});w.remove();rich(j.result,j.sources);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}return}return analyzeDocument(file)}async function startCamera(){if(!navigator.mediaDevices?.getUserMedia)return add('🔴 Камера недоступна в этом браузере.');offCamera();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('#cam').srcObject=stream;$('#cameraBox').style.display='block';$('#camera').classList.add('active')}catch{add('🔴 Не удалось включить камеру. Разреши доступ к камере в настройках iPhone.')}}function offCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#cam').srcObject=null;$('#cameraBox').style.display='none';$('#camera').classList.remove('active')}async function cameraAnalyze(){if(!stream)return startCamera();const b=await captureFrame($('#cam'));await analyzeImages([b],'📹 Камера')}async function generateImage(){const p=window.prompt('Что нарисовать?');if(!p)return;add('🎨 '+p,'user');const w=add('⏳ Создаю изображение…');try{const j=await post('/generate-image',{prompt:p},180000);w.remove();const d=document.createElement('div');d.className='msg ai';if(j.dataUrl){const im=new Image();im.src=j.dataUrl;im.alt='Созданное изображение';im.style.maxWidth='100%';im.style.borderRadius='16px';d.appendChild(im)}else if(j.url){const a=document.createElement('a');a.href=j.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Открыть изображение';d.appendChild(a)}else throw Error('Сервис изображений не вернул результат');chat.appendChild(d);chat.scrollTop=chat.scrollHeight}catch(e){w.remove();add('🔴 '+e.message)}}$('#send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return add('🎙️ Используй микрофон клавиатуры iPhone.');const r=new R();r.lang='ru-RU';r.interimResults=false;r.continuous=false;r.onresult=e=>{input.value=e.results[0][0].transcript;send()};r.onerror=()=>add('🔴 Не удалось получить голос.');try{r.start()}catch{add('🔴 Микрофон уже используется.')}};$('#photo').onclick=()=>$('#photoInput').click();$('#photoInput').onchange=()=>{const f=$('#photoInput').files;if(f.length)analyzeImages(f);$('#photoInput').value=''};$('#video').onclick=()=>$('#videoInput').click();$('#videoInput').onchange=()=>{const f=$('#videoInput').files[0];if(f)analyzeVideo(f);$('#videoInput').value=''};$('#file').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=()=>{const f=$('#fileInput').files[0];if(f)openFile(f);$('#fileInput').value=''};$('#camera').onclick=startCamera;$('#camOff').onclick=offCamera;$('#camShot').onclick=cameraAnalyze;$('#camAnalyze').onclick=cameraAnalyze;$('#imagegen').onclick=generateImage;$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Звук':'🔇 Звук выкл';$('#sound').classList.toggle('active',sound);if(!sound)stop()};$('#stop').onclick=stop;$('#clear').onclick=()=>{chat.innerHTML='<div class="msg ai">Готов. Напиши задачу или используй кнопки ниже.</div>';messages=[]};window.addEventListener('pagehide',offCamera);check();</script></body></html>
