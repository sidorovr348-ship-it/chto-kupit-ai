<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><meta name="app-version" content="2026-09-14-stable-2"><title>My AI Unified</title><style>:root{--bg:#0b0b0d;--panel:#151518;--soft:#202024;--text:#f5f5f7;--muted:#999;--blue:#9cc7ff;--green:#69d68b;--red:#ff7777;--yellow:#ffd36a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:16px 14px 30px}h1{font-size:29px;margin:3px 0}.sub{color:var(--muted);margin-bottom:9px}.status{font-size:12px;color:#aaa;margin-bottom:9px}.chat{min-height:50vh;max-height:64vh;background:var(--panel);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto}.msg{padding:12px 14px;border-radius:20px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;max-width:96%}.ai{background:#222226;align-self:flex-start}.user{background:#fff;color:#111;align-self:flex-end}.msg a{color:var(--blue);display:block;margin-top:6px;word-break:break-all}.bar{display:flex;gap:8px;margin-top:10px}.bar textarea{flex:1;resize:none;border:0;border-radius:22px;padding:14px;background:var(--soft);color:#fff;font:inherit;min-height:52px;max-height:150px}.bar button{width:58px;background:#fff;color:#111;border:0;border-radius:999px;font-size:22px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.actions button{padding:12px 7px;background:var(--soft);color:#fff;border:0;border-radius:999px;font-weight:700}.actions button.active{background:#fff;color:#111}.camera{display:none;background:#000;border-radius:22px;padding:8px;margin-top:10px}.camera video{width:100%;border-radius:16px;display:block;max-height:55vh;object-fit:cover}.cambar{display:flex;gap:8px;margin-top:8px}.cambar button{flex:1;border:0;border-radius:999px;padding:12px;font-weight:700}.hint{color:#777;font-size:12px;text-align:center;margin-top:9px}.card{background:#1d1d21;border-radius:16px;padding:12px;margin-top:8px}.price{font-weight:800;font-size:18px}.muted{color:#aaa;font-size:12px}.resultimg{width:100%;border-radius:16px;margin-top:8px;display:block}.diag{font-size:11px;color:#777;margin-top:8px;white-space:pre-wrap}</style></head><body><main><h1>🧠 My AI Unified</h1><div class="sub">Чат, поиск, товары, фото, камера, видео, файлы, голос и картинки.</div><div class="status" id="status">🟡 Проверяю сервер…</div><section class="chat" id="chat"><div class="msg ai">Готов. Напиши задачу или используй кнопки ниже.</div></section><div class="bar"><textarea id="input" placeholder="Напиши или продиктуй задачу…"></textarea><button id="send" aria-label="Отправить">➤</button></div><div class="actions"><button id="voice">🎙️ Голос</button><button id="photo">📷 Фото</button><button id="camera">📹 Камера</button><button id="video">🎬 Видео</button><button id="file">📎 Файл</button><button id="imagegen">🎨 Картинка</button><button id="sound" class="active">🔊 Звук</button><button id="stop">⏹ Стоп</button><button id="clear">🧹 Очистить</button></div><section class="camera" id="cameraBox"><video id="cam" autoplay playsinline muted></video><div class="cambar"><button id="camAnalyze">🔎 Что это?</button><button id="camShot">📸 Снимок</button><button id="camOff">⏹ Выключить</button></div></section><div class="diag" id="diag"></div><div class="hint">My AI Unified · API: ai.aliceq.ru</div><input id="photoInput" type="file" accept="image/*" capture="environment" multiple hidden><input id="videoInput" type="file" accept="video/*" capture="environment" hidden><input id="fileInput" type="file" accept=".txt,.md,.csv,.tsv,.json,.xml,.html,.pdf,.docx,.xlsx,.xls" hidden></main><script>'use strict';
const API='https://ai.aliceq.ru';const $=s=>document.querySelector(s);const chat=$('#chat'),input=$('#input'),status=$('#status'),diag=$('#diag');let sound=true,player=null,stream=null,busy=false,messages=[],recorder=null,voiceChunks=[];
function add(text,who='ai'){const d=document.createElement('div');d.className='msg '+who;d.textContent=String(text??'');chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function rich(text,sources=[]){const d=add('','ai');for(const p of String(text??'').split(/(https?:\/\/[^\s]+)/g)){if(/^https?:\/\//i.test(p)){const a=document.createElement('a');a.href=p;a.target='_blank';a.rel='noopener noreferrer';a.textContent=p;d.appendChild(a)}else d.appendChild(document.createTextNode(p))}for(const s of sources||[]){if(/^https?:\/\//i.test(String(s?.link||''))){const a=document.createElement('a');a.href=s.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Источник: '+(s.title||s.link);d.appendChild(a)}}return d}
async function post(path,body,timeout=120000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body),cache:'no-store',mode:'cors',signal:c.signal});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.error||('Ошибка сервера HTTP '+r.status));return j}catch(e){if(e.name==='AbortError')throw Error('Сервер не ответил вовремя.');if(/Load failed|Failed to fetch|NetworkError/i.test(e.message))throw Error('Не удаётся связаться с AI-сервером. Проверь интернет/VPN и повтори.');throw e}finally{clearTimeout(tm)}}
async function check(){try{const r=await fetch(API+'/health?t='+Date.now(),{cache:'no-store',mode:'cors'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.ok)throw Error('Сервер вернул ошибку');const a=j.adapters||{};const parts=[a.groq?'AI':''];if(a.groqVision)parts.push('фото');if(a.search)parts.push('поиск');if(a.documents)parts.push('документы');if(a.video)parts.push('видео');if(a.stt)parts.push('голос-ввод');if(a.tts)parts.push('озвучка');if(a.imageGeneration)parts.push('картинки');status.textContent='🟢 AI подключён · '+parts.filter(Boolean).join(' · ');diag.textContent='Диагностика: сервер OK · чат/поиск/медиа доступны по API';return true}catch(e){status.textContent='🔴 Сервер недоступен';diag.textContent='Диагностика: '+e.message;return false}}
function stop(){if(player){try{player.pause()}catch{}const u=player.src;player=null;try{URL.revokeObjectURL(u)}catch{}}if('speechSynthesis'in window)speechSynthesis.cancel()}
async function speak(text){if(!sound||!text)return;stop();try{const r=await fetch(API+'/tts',{method:'POST',headers:{'Content-Type':'application/json','Accept':'audio/mpeg'},body:JSON.stringify({text:String(text).slice(0,3500)}),cache:'no-store',mode:'cors'});if(!r.ok)throw Error();const blob=await r.blob();if(!blob.size)throw Error();const u=URL.createObjectURL(blob);player=new Audio(u);player.onended=()=>{URL.revokeObjectURL(u);player=null};await player.play()}catch{if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(String(text).slice(0,2500));u.lang='ru-RU';u.rate=.96;speechSynthesis.speak(u)}}}
const purchase=q=>/(найди|найти|где купить|купить|цена|стоимость|в наличии|магазин|закаж|продаж|дешевле|сравни|актуальн).*|\b(товар|телефон|телевизор|стиральн|карниз|конструктор|айфон|iphone)\b/iu.test(q);
async function send(){const text=input.value.trim();if(!text||busy)return;add(text,'user');input.value='';messages.push({role:'user',content:text});const w=add('⏳ Выполняю…');busy=true;try{const j=purchase(text)?await post('/shopping',{query:text},120000):await post('/chat',{prompt:text,messages},120000);w.remove();if(Array.isArray(j.results)){renderShopping(j);const summary=j.results.slice(0,8).map(x=>`${x.store||'Магазин'}: ${x.title||'товар'} — ${x.price!=null?x.price+' '+(x.currency||'RUB'):'цена не указана'} — ${x.availability==='in_stock'?'в наличии':x.availability==='out_of_stock'?'нет в наличии':'наличие не подтверждено'}`).join('\n');messages.push({role:'assistant',content:summary});if(summary)speak(summary)}else{const result=String(j.result||'');messages.push({role:'assistant',content:result});rich(result,j.sources);speak(result)}}catch(e){w.remove();add('🔴 '+e.message);await check()}finally{busy=false}}
function renderShopping(j){if(!j.results?.length){add('Поиск не дал предложений. Уточни модель или город.');return}for(const x of j.results.slice(0,12)){const d=document.createElement('div');d.className='card';const title=document.createElement('b');title.textContent=x.title||'Товар';const store=document.createElement('div');store.className='muted';store.textContent=x.store||'Магазин не определён';const p=document.createElement('div');p.className='price';p.textContent=x.price!=null?String(x.price)+' '+(x.currency||'RUB'):'Цена не указана';const av=document.createElement('div');av.className='muted';av.textContent=x.availability==='in_stock'?'🟢 В наличии':x.availability==='out_of_stock'?'🔴 Нет в наличии':'🟡 Наличие не подтверждено';d.append(title,store,p,av);if(/^https?:\/\//i.test(String(x.url||''))){const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Открыть магазин';d.appendChild(a)}if(x.evidence){const ev=document.createElement('div');ev.className='muted';ev.textContent='Источник: '+x.evidence;d.appendChild(ev)}chat.appendChild(d)}chat.scrollTop=chat.scrollHeight}
function dataUrl(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Не удалось прочитать файл'));r.readAsDataURL(file)})}
async function analyzeImages(files,label='📷'){const a=[...files].slice(0,5);if(!a.length)return;add(label+' '+a.map(f=>f.name||'изображение').join(', '),'user');const w=add(`⏳ Анализирую ${a.length} изображени${a.length===1?'е':'я'}…`);try{const images=[];for(const f of a){if(f.size>8*1024*1024)throw Error('Изображение слишком большое (максимум 8 МБ).');images.push(await dataUrl(f))}const j=await post('/photo',{images,prompt:'Проанализируй изображения подробно по-русски. Если это товар, определи бренд, модель и видимые характеристики. Сравни изображения, если их несколько. Не выдумывай неизвестное.'},150000);w.remove();rich(j.result);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}}
function captureFrame(v){const c=document.createElement('canvas'),width=Math.min(1280,v.videoWidth||1280),height=Math.max(1,Math.round(width*(v.videoHeight||720)/(v.videoWidth||1280)));c.width=width;c.height=height;c.getContext('2d').drawImage(v,0,0,width,height);return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(Error('Не удалось получить кадр')),'image/jpeg',.78))}
async function analyzeVideo(file){if(file.size>120*1024*1024)return add('🔴 Видео слишком большое (максимум 120 МБ).');add('🎬 '+file.name,'user');const url=URL.createObjectURL(file),v=document.createElement('video');v.src=url;v.muted=true;v.playsInline=true;v.preload='metadata';const w=add('⏳ Готовлю кадры 4 / 7 / 10 сек.…');try{await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(Error('Не удалось прочитать видео'))});const times=[4,7,10].filter(t=>Number.isFinite(v.duration)&&t<v.duration-.05);if(!times.length)times.push(Math.max(0,(v.duration||0)/2));const images=[];for(const t of times){v.currentTime=t;await new Promise((ok,no)=>{v.onseeked=ok;v.onerror=()=>no(Error('Не удалось получить кадр'))});images.push(await dataUrl(await captureFrame(v)))}w.remove();const j=await post('/photo',{images,prompt:`Это ${images.length} последовательных кадров одного видео, снятых примерно в моменты ${times.map(x=>x+' сек.').join(', ')}. Проанализируй их вместе и опиши, что происходит и что изменяется во времени. Отвечай по-русски, не выдумывай неизвестное.`},180000);rich(j.result);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}finally{URL.revokeObjectURL(url)}}
async function analyzeDocument(file){if(file.size>30*1024*1024)return add('🔴 Файл слишком большой (максимум 30 МБ).');add('📎 '+file.name,'user');const w=add('⏳ Извлекаю текст и анализирую…');try{const j=await post('/document',{name:file.name,mime:file.type,file:await dataUrl(file)},180000);w.remove();rich(j.result);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}}
async function openFile(file){if(file.type.startsWith('image/'))return analyzeImages([file]);if(/\.(txt|md|csv|tsv|json|xml|html)$/i.test(file.name)){if(file.size>2*1024*1024)return add('🔴 Текстовый файл слишком большой (максимум 2 МБ).');const w=add('⏳ Анализирую файл…');try{const text=await file.text(),j=await post('/chat',{prompt:`Проанализируй файл «${file.name}» по-русски.\n\n${text.slice(0,150000)}`},150000);w.remove();rich(j.result,j.sources);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}return}return analyzeDocument(file)}
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Браузер не дал доступ к камере.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('#cam').srcObject=stream;$('#cameraBox').style.display='block';$('#camera').classList.add('active')}catch(e){add('🔴 Не удалось включить камеру: '+e.message)}}
function stopCamera(){if(stream){for(const t of stream.getTracks())t.stop();stream=null}$('#cam').srcObject=null;$('#cameraBox').style.display='none';$('#camera').classList.remove('active')}
async function cameraAnalyze(){if(!stream)return add('🔴 Сначала включи камеру.');try{const b=await captureFrame($('#cam')),f=new File([b],'camera.jpg',{type:'image/jpeg'});await analyzeImages([f],'📹 Камера')}catch(e){add('🔴 '+e.message)}}
async function cameraShot(){if(!stream)return add('🔴 Сначала включи камеру.');try{const b=await captureFrame($('#cam')),f=new File([b],'camera-shot.jpg',{type:'image/jpeg'});await analyzeImages([f],'📸 Снимок')}catch(e){add('🔴 '+e.message)}}
async function startVoice(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return add('🔴 Этот браузер не поддерживает запись голоса.');try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].filter(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(s,types[0]?{mimeType:types[0]}:undefined);voiceChunks=[];recorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};recorder.onstop=async()=>{for(const t of s.getTracks())t.stop();const blob=new Blob(voiceChunks,{type:recorder.mimeType||'audio/webm'});try{add('🎙️ Голосовая команда','user');const audio=await dataUrl(new File([blob],'voice',{type:blob.type}));const j=await post('/transcribe',{audio},90000);if(!j.text)throw Error('Не удалось распознать речь');input.value=j.text;await send()}catch(e){add('🔴 '+e.message)}};recorder.start();$('#voice').textContent='⏹ Остановить запись';$('#voice').classList.add('active')}catch(e){add('🔴 Не удалось включить микрофон: '+e.message)}}
function stopVoice(){if(recorder&&recorder.state!=='inactive')recorder.stop();$('#voice').textContent='🎙️ Голос';$('#voice').classList.remove('active')}
async function generateImage(){const p=prompt('Что нужно нарисовать?');if(!p)return;const w=add('⏳ Создаю изображение…');try{const j=await post('/generate-image',{prompt:p},180000);w.remove();if(j.dataUrl||j.url){const d=add('','ai');const img=document.createElement('img');img.className='resultimg';img.src=j.dataUrl||j.url;img.alt='Сгенерированное изображение';d.appendChild(img)}else throw Error('Сервис не вернул изображение')}catch(e){w.remove();add('🔴 '+e.message)}}
$('#send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#sound').onclick=()=>{$('#sound').classList.toggle('active');sound=$('#sound').classList.contains('active');if(!sound)stop()};$('#stop').onclick=stop;$('#clear').onclick=()=>{chat.innerHTML='<div class="msg ai">Готов. Напиши задачу или используй кнопки ниже.</div>';messages=[];stop()};$('#photo').onclick=()=>$('#photoInput').click();$('#photoInput').onchange=e=>{analyzeImages(e.target.files);e.target.value=''};$('#video').onclick=()=>$('#videoInput').click();$('#videoInput').onchange=e=>{const f=e.target.files?.[0];if(f)analyzeVideo(f);e.target.value=''};$('#file').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{const f=e.target.files?.[0];if(f)openFile(f);e.target.value=''};$('#camera').onclick=()=>stream?stopCamera():startCamera();$('#camOff').onclick=stopCamera;$('#camAnalyze').onclick=cameraAnalyze;$('#camShot').onclick=cameraShot;$('#voice').onclick=()=>recorder&&recorder.state!=='inactive'?stopVoice():startVoice();$('#imagegen').onclick=generateImage;check();</script></body></html>
