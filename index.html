<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><meta http-equiv="Cache-Control" content="no-store"><title>My AI Unified</title><style>:root{--bg:#0b0b0d;--panel:#151518;--soft:#202024;--text:#f5f5f7;--muted:#999;--blue:#9cc7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 30px}h1{font-size:29px;margin:4px 0}.sub{color:var(--muted);margin-bottom:10px}.status{font-size:12px;color:#aaa;margin-bottom:10px}.chat{min-height:58vh;background:var(--panel);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto}.msg{padding:12px 14px;border-radius:20px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;max-width:96%}.ai{background:#222226;align-self:flex-start}.user{background:#fff;color:#111;align-self:flex-end}.msg a{color:var(--blue);display:block;margin-top:6px;word-break:break-all}.bar{display:flex;gap:8px;margin-top:10px}.bar textarea{flex:1;resize:none;border:0;border-radius:999px;padding:14px;background:var(--soft);color:#fff;font:inherit;min-height:52px}.bar button,.actions button{border:0;border-radius:999px;font-weight:700}.bar button{width:58px;background:#fff;font-size:22px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.actions button{padding:13px 8px;background:var(--soft);color:#fff}.actions button.active{background:#fff;color:#111}.hint{color:#777;font-size:12px;text-align:center;margin-top:9px}</style></head><body><main><h1>🧠 My AI Unified</h1><div class="sub">Один помощник: чат, поиск, фото, видео, файлы и живой голос.</div><div class="status" id="status">🟡 Проверяю сервер…</div><section class="chat" id="chat"><div class="msg ai">Готов. Напиши задачу или используй кнопки ниже.</div></section><div class="bar"><textarea id="input" placeholder="Напиши или продиктуй задачу…"></textarea><button id="send">➤</button></div><div class="actions"><button id="voice">🎙️ Голос</button><button id="photo">📷 Фото</button><button id="video">🎬 Видео</button><button id="file">📎 Файл</button><button id="sound" class="active">🔊 Звук</button><button id="stop">⏹ Стоп</button></div><div class="hint">My AI Unified · основной API: ai.aliceq.ru</div><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><input id="videoInput" type="file" accept="video/*" capture="environment" hidden><input id="fileInput" type="file" accept=".txt,.md,.csv,.tsv,.json,.xml,.html,.pdf,.docx,.xlsx" hidden></main><script>
const API='https://ai.aliceq.ru', $=s=>document.querySelector(s), chat=$('#chat'), input=$('#input'), status=$('#status'); let sound=true,player=null,messages=[];
function add(text,who='ai'){const d=document.createElement('div');d.className='msg '+who;d.textContent=String(text??'');chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function rich(text,sources=[]){const d=add('','ai');for(const p of String(text??'').split(/(https?:\/\/[^\s]+)/g)){if(/^https?:\/\//.test(p)){const a=document.createElement('a');a.href=p;a.target='_blank';a.rel='noopener noreferrer';a.textContent=p;d.appendChild(a)}else d.appendChild(document.createTextNode(p))}for(const s of sources||[]){if(s?.link){const a=document.createElement('a');a.href=s.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Источник: '+(s.title||s.link);d.appendChild(a)}}return d}
async function post(path,body,timeout=90000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store',signal:c.signal});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}catch(e){throw Error(e.name==='AbortError'?'Сервер не ответил вовремя.':e.message)}finally{clearTimeout(tm)}}
async function check(){try{const r=await fetch(API+'/health?t='+Date.now(),{cache:'no-store'});const j=await r.json();if(!j.ok)throw Error('ошибка сервера');const a=j.adapters||{};status.textContent='🟢 AI подключён'+(a.deepseek?' · DeepSeek':' · резервный AI');return true}catch(e){status.textContent='🔴 Сервер недоступен';return false}}
async function speak(text){if(!sound)return;try{if(player){player.pause();player=null}const r=await fetch(API+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:String(text).slice(0,3500)}),cache:'no-store'});if(!r.ok)throw Error('озвучивание недоступно');const url=URL.createObjectURL(await r.blob());player=new Audio(url);player.onended=()=>{URL.revokeObjectURL(url);player=null};await player.play()}catch{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).slice(0,2500));u.lang='ru-RU';u.rate=.96;speechSynthesis.speak(u)}}}
function stop(){if(player){player.pause();player.currentTime=0;try{URL.revokeObjectURL(player.src)}catch{}player=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
async function send(){const text=input.value.trim();if(!text)return;add(text,'user');input.value='';messages.push({role:'user',content:text});const w=add('⏳ Выполняю…');try{const j=await post('/chat',{prompt:text,messages});w.remove();messages.push({role:'assistant',content:j.result||''});rich(j.result,j.sources);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message);check()}}
function readData(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Не удалось прочитать файл'));r.readAsDataURL(file)})}
async function image(file){add('📷 '+(file.name||'фото'),'user');const w=add('⏳ Анализирую…');try{const j=await post('/photo',{image:await readData(file),prompt:'Проанализируй изображение подробно по-русски. Если это товар, определи бренд, модель и видимые характеристики. Не выдумывай неизвестное.'});w.remove();rich(j.result);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}}
function video(file){add('🎬 '+file.name,'user');const v=document.createElement('video');v.src=URL.createObjectURL(file);v.muted=true;v.playsInline=true;v.preload='metadata';v.onloadedmetadata=()=>{v.currentTime=Math.min(4,v.duration||0)};v.onseeked=async()=>{try{const c=document.createElement('canvas');c.width=Math.min(1280,v.videoWidth||1280);c.height=Math.round(c.width*(v.videoHeight||720)/(v.videoWidth||1280));c.getContext('2d').drawImage(v,0,0,c.width,c.height);const b=await new Promise(x=>c.toBlob(x,'image/jpeg',.82));await image(b)}finally{URL.revokeObjectURL(v.src)}};v.onerror=()=>add('🔴 Не удалось прочитать видео')}
async function file(file){add('📎 '+file.name,'user');if(file.type.startsWith('image/'))return image(file);if(/\.(txt|md|csv|tsv|json|xml|html)$/i.test(file.name)){const w=add('⏳ Анализирую файл…');try{const text=await file.text();const j=await post('/chat',{prompt:`Проанализируй файл «${file.name}» по-русски.\n\n${text.slice(0,100000)}`});w.remove();rich(j.result,j.sources);speak(j.result)}catch(e){w.remove();add('🔴 '+e.message)}return}add('🟡 Этот формат принят интерфейсом, но серверу пока нужен модуль извлечения текста для PDF/DOCX/XLSX.')}
$('#send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('🎙️ Используй микрофон клавиатуры iPhone.');return}const r=new R();r.lang='ru-RU';r.interimResults=false;r.continuous=false;r.onresult=e=>{input.value=e.results[0][0].transcript;send()};r.onerror=()=>add('🔴 Не удалось получить голос.');try{r.start()}catch{add('🔴 Микрофон уже используется.')}};$('#photo').onclick=()=>$('#photoInput').click();$('#photoInput').onchange=()=>{const f=$('#photoInput').files[0];if(f)image(f);$('#photoInput').value=''};$('#video').onclick=()=>$('#videoInput').click();$('#videoInput').onchange=()=>{const f=$('#videoInput').files[0];if(f)video(f);$('#videoInput').value=''};$('#file').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=()=>{const f=$('#fileInput').files[0];if(f)file(f);$('#fileInput').value=''};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Звук':'🔇 Звук выкл';$('#sound').classList.toggle('active',sound);if(!sound)stop()};$('#stop').onclick=stop;check();
</script></main></body></html>
