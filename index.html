<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My AI Unified</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:22px 16px 36px}h1{font-size:30px;margin:8px 0 4px}.sub{color:#999;margin-bottom:20px}.chat{min-height:55vh;background:#151518;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{padding:12px 14px;border-radius:17px;line-height:1.45;white-space:pre-wrap}.ai{background:#222226;align-self:flex-start;max-width:92%}.user{background:#fff;color:#111;align-self:flex-end;max-width:92%}.bar{display:flex;gap:8px;margin-top:12px}.bar textarea{flex:1;resize:none;border:0;border-radius:17px;padding:14px;background:#202024;color:#fff;font:inherit;min-height:52px}.bar button{width:58px;border:0;border-radius:17px;background:#fff;font-size:23px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{padding:13px;border:0;border-radius:15px;background:#202024;color:#fff;font-weight:700}.hint{color:#777;font-size:13px;text-align:center;margin-top:10px}</style></head>
<body><main><h1>🧠 My AI Unified</h1><div class="sub">Один помощник. Ты просто говоришь, что нужно сделать.</div><section class="chat" id="chat"><div class="msg ai">Готов. Скажи, что нужно сделать: найти информацию, разобрать фото, проанализировать документ, написать код, найти товар или выполнить другую задачу.</div></section><div class="bar"><textarea id="input" placeholder="Напиши или продиктуй задачу…"></textarea><button id="send">➤</button></div><div class="actions"><button id="voice">🎙️ Голос</button><button id="photo">📷 Фото</button><button id="file">📎 Файл</button><button id="reset">↻ Сначала</button></div><div class="hint">Dispatcher (диспетчер) сам определяет нужный тип AI и инструмент.</div><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><input id="fileInput" type="file" hidden>
<script>
const chat=document.querySelector('#chat'),input=document.querySelector('#input');
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function formatResult(j){if(j.result)return j.result;if(Array.isArray(j.results)&&j.results.length)return j.results.map((x,i)=>`${i+1}. ${x.title}\n${x.url}${x.content?'\n'+x.content:''}`).join('\n\n');return j.message||'Задача выполнена.'}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Ошибка API');return j}
async function send(){const text=input.value.trim();if(!text)return;add(text,'user');input.value='';add('⏳ Выполняю…','ai');try{const j=await api('/chat',{prompt:text});chat.lastChild.remove();add(formatResult(j),'ai')}catch(e){chat.lastChild.remove();add('🔴 '+e.message,'ai')}}
document.querySelector('#send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.querySelector('#voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('Голосовой ввод не поддерживается этим браузером.','ai');return}const r=new R();r.lang='ru-RU';r.onresult=e=>{input.value=e.results[0][0].transcript;send()};r.start()};
document.querySelector('#photo').onclick=()=>document.querySelector('#photoInput').click();
document.querySelector('#photoInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;add('📷 '+f.name,'user');add('⏳ Анализирую изображение…','ai');try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const j=await api('/photo',{image:data,prompt:'Опиши изображение и ответь, что на нём важно для пользователя.'});chat.lastChild.remove();add(j.result||'Изображение обработано.','ai')}catch(err){chat.lastChild.remove();add('🔴 '+err.message,'ai')}e.target.value=''};
document.querySelector('#file').onclick=()=>document.querySelector('#fileInput').click();
document.querySelector('#fileInput').onchange=e=>{const f=e.target.files[0];if(f){add('📎 '+f.name,'user');add('🟡 Обработка документов будет подключена следующим модулем.','ai')}e.target.value=''};
document.querySelector('#reset').onclick=()=>{chat.innerHTML='<div class="msg ai">Готов. Скажи, что нужно сделать.</div>';input.value=''};
</script></main></body></html>
