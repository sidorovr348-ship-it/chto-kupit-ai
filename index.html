<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Эй</title>
<style>
body{margin:0;background:#0b0b0d;color:#f5f5f7;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
main{max-width:860px;margin:auto;padding:10px}h1{font-size:28px;margin:4px 0 10px}
.chat{height:64vh;overflow:auto;background:#151518;border-radius:22px;padding:10px}.m{padding:11px 13px;border-radius:18px;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}.a{background:#222226}.u{background:#fff;color:#111;margin-left:8%}
.bar{display:flex;gap:7px;margin-top:8px}textarea{flex:1;border:0;border-radius:20px;background:#202024;color:#fff;padding:13px;font:inherit}button{border:0;border-radius:20px;padding:11px;background:#202024;color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.cam{display:none;margin-top:8px;background:#000;border-radius:18px;padding:7px}.cam video{width:100%;border-radius:14px}img{max-width:100%;border-radius:14px}
#voice.recording{background:#8b1e2d;box-shadow:0 0 0 3px #c43b50}.status{font-size:13px;opacity:.75;padding:3px 8px}
</style>
</head>
<body><main>
<h1>Эй</h1>
<section class="chat" id="chat"><div class="m a">Привет! Я Эй. Чем помочь?</div></section>
<div class="bar"><textarea id="in" placeholder="Напиши или скажи…"></textarea><button id="send">➤</button></div>
<div class="grid">
<button id="voice">🎙️ Голос</button><button id="photo">📷 Фото</button><button id="camBtn">📹 Камера</button>
<button id="video">🎬 Видео</button><button id="file">📎 Файл / ZIP</button><button id="img">🎨 Картинка</button>
<button id="sound">🔊 Звук</button><button id="stop">⏹ Стоп</button><button id="clear">🧹 Очистить</button>
</div>
<div class="cam" id="camBox"><video id="cam" autoplay playsinline muted></video><div class="grid"><button id="camWhat">🔎 Что это?</button><button id="camOff">⏹ Выключить</button></div></div>
<input id="pi" type="file" accept="image/*" capture="environment" multiple hidden>
<input id="vi" type="file" accept="video/*" hidden>
<input id="fi" type="file" accept=".zip,.txt,.md,.csv,.json,.xml,.html,.pdf,.docx,.xlsx,.xls" hidden>
<script>
'use strict';
const API='https://ai.aliceq.ru',MEMORY_KEY='my-ai-memory-id-v1',MEMORY_ID=localStorage.getItem(MEMORY_KEY)||(crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2)));localStorage.setItem(MEMORY_KEY,MEMORY_ID);
const $=x=>document.querySelector(x),chat=$('#chat'),input=$('#in');
let busy=0,sound=1,rec=null,chunks=[],stream=null,audio=new Audio(),msgs=[],voiceTimer=null,voiceCtx=null,voiceAnalyser=null;
function add(t,c='a'){let d=document.createElement('div');d.className='m '+c;d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight;return d}
function out(t,s=[]){let d=add('');for(let p of String(t||'').split(/(https?:\/\/[^\s]+)/g)){if(/^https?:\/\//i.test(p)){let a=document.createElement('a');a.href=p;a.target='_blank';a.rel='noopener';a.textContent=p;d.append(a)}else d.append(document.createTextNode(p))}for(let x of s||[]){if(/^https?:\/\//i.test(x.link||'')){let a=document.createElement('a');a.href=x.link;a.target='_blank';a.rel='noopener';a.textContent='Источник: '+(x.title||x.link);d.append(document.createElement('br'));d.append(a)}}}
async function api(path,b,to=120000){for(let n=0;n<3;n++){let c=new AbortController(),tm=setTimeout(()=>c.abort(),to);try{let r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),cache:'no-store',signal:c.signal}),t=await r.text(),j={};try{j=JSON.parse(t)}catch{}if(!r.ok){if(r.status>=500&&n<2){await new Promise(x=>setTimeout(x,1000*(n+1)));continue}throw Error(j.error||'Ошибка сервера HTTP '+r.status)}return j}catch(e){if(n===2)throw Error(e.name==='AbortError'?'Сервер не ответил вовремя.':/Failed to fetch|Load failed|NetworkError/i.test(e.message)?'Не удаётся связаться с AI-сервером.':e.message)}finally{clearTimeout(tm)}}throw Error('AI недоступен')}
function stop(){if(rec){try{rec.stop()}catch{}return}try{audio.pause()}catch{}if('speechSynthesis'in window)speechSynthesis.cancel()}
async function say(t){if(!sound||!t)return;try{let r=await fetch(API+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:String(t).slice(0,3500)}),cache:'no-store'});if(!r.ok)throw Error();let u=URL.createObjectURL(await r.blob());audio.src=u;await audio.play();audio.onended=()=>URL.revokeObjectURL(u)}catch{try{let u=new SpeechSynthesisUtterance(String(t).slice(0,2500));u.lang='ru-RU';u.rate=.96;speechSynthesis.speak(u)}catch{}}}
function shopping(q){return /(найди|найти|где купить|купить|цена|стоимость|в наличии|магазин|закаж|дешевле|сравни|товар|телефон|телевизор|стиральн|карниз|iphone|айфон)/iu.test(q)}
async function send(){let t=input.value.trim();if(!t||busy)return;add(t,'u');input.value='';msgs.push({role:'user',content:t});let w=add('⏳');busy=1;try{let j=shopping(t)?await api('/shopping',{query:t},150000):await api('/chat',{prompt:t,messages:msgs},150000);w.remove();if(j.routeUrl){let d=add(j.result||'Маршрут построен.');let a=document.createElement('a');a.href=j.routeUrl;a.target='_blank';a.rel='noopener';a.textContent='🗺️ Открыть маршрут на карте';d.append(a);say(j.result||'Маршрут построен.')}else if(j.results){for(let x of j.results.slice(0,12)){let d=add(`${x.store||x.merchant||'Магазин'}\n${x.title||'Товар'}\n${x.price!=null?x.price+' '+(x.currency||'RUB'):'Цена не указана'}\n${x.availability==='in_stock'?'🟢 В наличии':x.availability==='out_of_stock'?'🔴 Нет в наличии':'🟡 Наличие не подтверждено'}`);if(x.url){let a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent='Открыть';d.append(a)}}}else{let r=String(j.result||'');msgs.push({role:'assistant',content:r});out(r,j.sources);say(r)}}catch(e){w.remove();add('🔴 '+e.message)}finally{busy=0}}
async function data(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function photo(fs,label='📷'){let a=[...fs].slice(0,5);if(!a.length)return;add(label+' '+a.map(x=>x.name).join(', '),'u');let w=add('⏳ Анализирую…');try{let j=await api('/photo',{images:await Promise.all(a.map(data)),prompt:'Подробно проанализируй изображение по-русски. Определи предмет, товар, бренд, модель и характеристики, если они видимы. Не выдумывай неизвестное.'},180000);w.remove();out(j.result);say(j.result)}catch(e){w.remove();add('🔴 '+e.message)}}
function frame(v){let c=document.createElement('canvas'),w=Math.min(1280,v.videoWidth||1280),h=Math.round(w*(v.videoHeight||720)/(v.videoWidth||1280));c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);return new Promise(ok=>c.toBlob(ok,'image/jpeg',.8))}
async function video(f){let u=URL.createObjectURL(f),v=document.createElement('video');v.src=u;v.muted=1;v.preload='metadata';let w=add('⏳ Анализирую видео…');try{await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=no});let ts=[4,7,10].filter(x=>x<v.duration-.1);if(!ts.length)ts=[Math.max(.1,v.duration/2)];let im=[];for(let t of ts){v.currentTime=t;await new Promise(ok=>v.onseeked=ok);im.push(await data(new File([await frame(v)],'frame.jpg',{type:'image/jpeg'})))}let j=await api('/photo',{images:im,prompt:`Проанализируй последовательные кадры видео в моменты ${ts.join(', ')} секунд. Опиши, что происходит и что меняется.`},180000);w.remove();out(j.result);say(j.result)}catch(e){w.remove();add('🔴 '+e.message)}finally{URL.revokeObjectURL(u)}}
async function file(f){if(/\.zip$/i.test(f.name)||f.type==='application/zip'||f.type==='application/x-zip-compressed')return doc(f);if(/\.(txt|md|csv|json|xml|html)$/i.test(f.name))return sendText('Проанализируй файл '+f.name+' по-русски:\n\n'+(await f.text()).slice(0,150000));return doc(f)}
async function sendText(t){input.value=t;await send()}
async function doc(f){let w=add('⏳ Читаю '+f.name+'…');try{let j=await api('/document',{name:f.name,file:await data(f)},240000);w.remove();out(j.result);say(j.result)}catch(e){w.remove();add('🔴 '+e.message)}}
async function cameraOn(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('#cam').srcObject=stream;$('#camBox').style.display='block'}catch(e){add('🔴 Камера: '+e.message)}}
function cameraOff(){stream?.getTracks().forEach(t=>t.stop());stream=null;$('#camBox').style.display='none'}
async function cameraWhat(){if(!stream)return cameraOn();let b=await frame($('#cam'));await photo([new File([b],'camera.jpg',{type:'image/jpeg'})],'📹 Камера')}
function resetVoiceUI(){let b=$('#voice');b.classList.remove('recording');b.textContent='🎙️ Голос'}
async function voice(){
 if(rec){try{rec.stop()}catch{}return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){add('🔴 Этот браузер не поддерживает запись голоса.');return}
 try{
  add('🎙️ Говорите. Я остановлю запись автоматически после паузы.','a');
  const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  stream=s; chunks=[];
  const types=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
  const m=types.find(x=>MediaRecorder.isTypeSupported(x))||'';
  rec=new MediaRecorder(s,m?{mimeType:m}:undefined);
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onerror=()=>{add('🔴 Ошибка записи микрофона.');try{rec.stop()}catch{}};
  rec.onstop=async()=>{
   const r=rec;rec=null;clearTimeout(voiceTimer);voiceTimer=null;
   try{voiceCtx?.close()}catch{}voiceCtx=null;voiceAnalyser=null;s.getTracks().forEach(t=>t.stop());stream=null;resetVoiceUI();
   const b=new Blob(chunks,{type:r.mimeType||m||'audio/mp4'});
   if(!b.size){add('🔴 Микрофон не записал звук.');return}
   add('⏳ Распознаю голос…','a');
   try{
    const ext=b.type.includes('mp4')?'m4a':b.type.includes('ogg')?'ogg':'webm';
    const tr=await fetch(API+'/transcribe',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({audio:await data(new File([b],'voice.'+ext,{type:b.type||'audio/mp4'})),mime:b.type,filename:'voice.'+ext}),cache:'no-store'});const j=await tr.json();if(!tr.ok)throw Error(j.error||'Ошибка распознавания');
    if(!j.text)throw Error('Речь не распознана');
    input.value=j.text;await send();
   }catch(e){add('🔴 Голос: '+e.message)}
  };
  rec.start(250);
  $('#voice').classList.add('recording');$('#voice').textContent='⏹ Остановить';
  /* Главное: запись больше НЕ зависит от AudioContext. Даже если анализатор iPhone не запустится, запись завершится сама. */
  voiceTimer=setTimeout(()=>{if(rec)try{rec.stop()}catch{}},9000);
  try{
   voiceCtx=new (window.AudioContext||window.webkitAudioContext)();
   if(voiceCtx.state==='suspended')await voiceCtx.resume().catch(()=>{});
   const src=voiceCtx.createMediaStreamSource(s),an=voiceCtx.createAnalyser();an.fftSize=1024;src.connect(an);voiceAnalyser=an;
   const arr=new Uint8Array(an.fftSize);let heard=false,silentAt=0;
   const tick=()=>{
    if(!rec||!voiceAnalyser)return;
    an.getByteTimeDomainData(arr);let sum=0;for(let i=0;i<arr.length;i++){let v=(arr[i]-128)/128;sum+=v*v}
    const rms=Math.sqrt(sum/arr.length),now=Date.now();
    if(rms>.018){heard=true;silentAt=0}else if(heard){if(!silentAt)silentAt=now;if(now-silentAt>=900){try{rec.stop()}catch{}}}
    if(rec)requestAnimationFrame(tick);
   };requestAnimationFrame(tick);
  }catch{}
 }catch(e){resetVoiceUI();stream?.getTracks().forEach(t=>t.stop());stream=null;add('🔴 Микрофон: '+(e.message||'нет доступа к микрофону'))}
}
async function image(){let p=prompt('Что нарисовать?');if(!p)return;try{let j=await api('/generate-image',{prompt:p},240000);if(j.dataUrl||j.url){let d=add(''),i=document.createElement('img');i.src=j.dataUrl||j.url;d.append(i)}else throw Error('Генерация изображения не настроена')}catch(e){add('🔴 '+e.message)}}
$('#send').onclick=send;$('#voice').onclick=voice;$('#photo').onclick=()=>$('#pi').click();$('#pi').onchange=e=>{photo(e.target.files);e.target.value=''};$('#video').onclick=()=>$('#vi').click();$('#vi').onchange=e=>{if(e.target.files[0])video(e.target.files[0]);e.target.value=''};$('#file').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{if(e.target.files[0])file(e.target.files[0]);e.target.value=''};$('#camBtn').onclick=()=>stream?cameraOff():cameraOn();$('#camOff').onclick=cameraOff;$('#camWhat').onclick=cameraWhat;$('#img').onclick=image;$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Звук':'🔇 Без звука'};$('#stop').onclick=stop;$('#clear').onclick=()=>{chat.innerHTML='<div class="m a">Готов. Я Эй.</div>';msgs=[];stop()};
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script></main></body></html>
