/* =====================================================

let stream = null;

/* =====================================================
   CAMERA
===================================================== */

startCamera.onclick = async function(){

  startCamera.disabled = true;

  status.textContent =
    "📷 Запрашиваю камеру…";

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio:false,

        video:{
          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }
        }

      });

    video.srcObject =
      stream;

    video.style.display =
      "block";

    await video.play();

    startCamera.classList.add("hidden");

    stopCamera.classList.remove("hidden");

    takePhoto.classList.remove("hidden");

    counter.classList.remove("hidden");

    retake.classList.remove("hidden");

    videoButton.classList.remove("hidden");

    reset.classList.remove("hidden");

    updateInterface();

    status.textContent =
      "Камера готова.\n"+
      "Наведи на нужную сторону товара.";

  }

  catch(error){

    status.textContent =
      "❌ Ошибка камеры:\n"+
      (error?.name || "")+
      "\n"+
      (error?.message || "");

    startCamera.disabled =
      false;

  }

};


/* =====================================================
   STOP CAMERA
===================================================== */

stopCamera.onclick =
function(){

  stopCameraNow();

};

function stopCameraNow(){

  if(stream){

    stream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

  }

  stream = null;

  video.srcObject = null;

  video.style.display = "none";

  stopCamera.classList.add("hidden");

  startCamera.classList.remove("hidden");

  startCamera.disabled = false;

  takePhoto.classList.add("hidden");

  videoButton.classList.add("hidden");

  status.textContent =
    "⏹ Камера выключена.";

}


/* =====================================================
   CAPTURE PHOTO
===================================================== */

takePhoto.onclick =
async function(){

  if(
    photos.length >= 4 ||
    busy ||
    !stream
  ){
    return;
  }

  try{

    const file =
      await captureFrame();

    photos.push(file);

    showPhoto(
      photos.length,
      file
    );

    updateInterface();

    status.textContent =
      "✅ Фото "+
      photos.length+

  }

  catch(error){

    status.textContent =
      "❌ Не удалось сделать фото.";

  }

};


/* =====================================================
   CAPTURE FRAME
===================================================== */

async function captureFrame(){

  if(!video.videoWidth){

    throw new Error(
      "Камера ещё не готова."
    );

  }

  let width =
    video.videoWidth;

  let height =
    video.videoHeight;

  const maxWidth = 900;

  if(width > maxWidth){

    const ratio =
      maxWidth / width;

    width = maxWidth;

    height =
      Math.round(
        height * ratio
      );

  }

  canvas.width = width;

  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  const blob =
    await new Promise(function(resolve){

      canvas.toBlob(
        resolve,
        "image/jpeg",
        0.65
      );

    });

  if(!blob){

    throw new Error(
      "Не удалось создать JPEG."
    );

  }

  return new File(
    [blob],
    "product-"+Date.now()+".jpg",
    {
      type:"image/jpeg"
    }
  );

}

===================================================== */

/* =====================================================
   UPDATE INTERFACE
===================================================== */

function updateInterface(){

  counter.textContent =
    "Фото: "+
    photos.length+
    " / 4";

  if(photos.length > 0){

    finishPhoto.classList.remove(
      "hidden"
    );

    retake.classList.remove(
      "hidden"
    );

  }
  else{

    finishPhoto.classList.add(
      "hidden"
    );

    retake.classList.add(
      "hidden"
    );

  }

  if(photos.length >= 4){

    takePhoto.classList.add(
      "hidden"
    );

  }
  else{

    takePhoto.classList.remove(
      "hidden"
    );

  }

}


/* =====================================================
   DELETE LAST PHOTO
===================================================== */

retake.onclick =
function(){

  if(
    photos.length === 0 ||
    busy
  ){
    return;
  }

  const number =
    photos.length;

  const img =
    document.getElementById(
      "photo"+number
    );

  const box =
    document.getElementById(
      "box"+number
    );

  if(img.src){

    try{
      URL.revokeObjectURL(img.src);
    }
    catch(e){}

  }

  img.removeAttribute("src");

  box.style.display =
    "none";

  photos.pop();

  updateInterface();

  status.textContent =
    "Последнее фото удалено.";

};


/* =====================================================
   AI ANIMATION
===================================================== */

function startAIAnimation(){

      else{

===================================================== */

function stopAIAnimation(){

  }

/* =====================================================
   UPLOAD FILES
===================================================== */

async function uploadFiles(files){

  const uploaded =
    await puter.fs.upload(files);

  const list =
    Array.isArray(uploaded)
      ? uploaded
      : [uploaded];

  const paths =
    list
      .map(function(item){

        return item?.path || null;

      })
      .filter(Boolean);

  if(paths.length !== files.length){

    throw new Error(
      "Не все фотографии были загружены."
    );

  }

  return paths;

}


/* =====================================================
   AI IMAGE ANALYSIS
===================================================== */

async function analyzeImages(
  files,
  mode
){

  const apiURL =
    "https://parliament-striking-slim-place.trycloudflare.com/analyze";

  function fileToDataURL(file){
    return new Promise(function(resolve, reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){
          resolve(reader.result);
        };

      reader.onerror =
        function(){
          reject(
            new Error("Не удалось прочитать фотографию.")
          );
        };

      reader.readAsDataURL(file);

    });
  }

  const images = [];

  for(const file of files){
    images.push(
      await fileToDataURL(file)
    );
  }

  let prompt;

  if(mode === "video"){

    prompt = `
Определи товар по ${images.length} изображениям одного товара.

Используй ВСЕ изображения.

В первую очередь прочитай:
бренд, модель, Model No, артикул,
надписи, цифры и маркировку.

Не придумывай модель.
Если модель невозможно уверенно определить,
напиши: не определена.

Ответ только:

ТИП:
БРЕНД:
МОДЕЛЬ:
УВЕРЕННОСТЬ:
ПОИСК:
`;

  }
  else{

    prompt = `
Определи товар по фотографиям.

Внимательно прочитай все надписи,
логотипы, модель, Model No, артикулы,
цифры и маркировку.

Если модель написана на корпусе или наклейке,
используй именно её.

Не придумывай модель.
Если модель невозможно уверенно определить,
напиши: не определена.

Ответ только:

ТИП:
БРЕНД:
МОДЕЛЬ:
УВЕРЕННОСТЬ:
ПОИСК:
`;

  }

  const response =
    await fetch(
      apiURL,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          prompt:prompt,
          images:images
        })
      }
    );

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      typeof data.error === "string"
        ? data.error
        : JSON.stringify(data.error || data)
    );

  }

  if(!data.ok){

    throw new Error(
      data.error ||
      "API анализа вернул ошибку."
    );

  }

  return data.result || "";

}


/* =====================================================/* =====================================================
   EXTRACT TEXT
===================================================== */

function extractAIText(response){

  if(
    typeof response === "string"
  ){
    return response;
  }

  if(
    response?.message &&
    typeof response.message.content === "string"
  ){
    return response.message.content;
  }

  if(
    typeof response?.content === "string"
  ){
    return response.content;
  }

  return JSON.stringify(
    response,
    null,
    2
  );

}


/* =====================================================
   PARSE PRODUCT
===================================================== */

function parseProduct(text){

  function find(label){

    const re =
      new RegExp(
        label+
        "\\s*:\\s*(.+)",
        "i"
      );

    const match =
      text.match(re);

    return match
      ? match[1].trim()
      : "";

  }

  productInfo.type =
    find("ТИП");

  productInfo.brand =
    find("БРЕНД");

  productInfo.model =
    find("МОДЕЛЬ");

  productInfo.confidence =
    find("УВЕРЕННОСТЬ");

  productInfo.search =
    find("ПОИСК");

}

async function performShoppingSearch(mode){

  if(busy){

  }

  if(
    !productInfo.brand &&
    !productInfo.model &&
    !productInfo.search
  ){

  similarButton.disabled = true;

    "block";

      "Поиск похожих вариантов и более выгодных цен";

    shoppingResult.textContent =
      "⚡ Быстро ищу похожие предложения…";

  }
  else{

    shoppingTitle.textContent =
      "🛒 Найденные предложения";

    searchMode.textContent =
      "Сравниваю реальные предложения";

    shoppingResult.textContent =
      "⚡ Быстро ищу цены…";

  }

  status.textContent =
    mode === "similar"
      ? "🔎 Ищу похожие товары…"
      : "🛒 Ищу товар и лучшую цену…";


  const brand =
    productInfo.brand || "";

  const model =
    productInfo.model || "";

  const type =
    productInfo.type || "";

  const search =
    productInfo.search || "";


  let query;


  if(mode === "similar"){

    query = `

Найди 5 похожих товаров на:

${brand} ${model}
${type}
${search}

Ищи в:
Ozon,
Wildberries,
Яндекс Маркет,
AliExpress,
других магазинах.

Цель: найти максимально похожие товары,
особенно более дешёвые.

Ответ коротко:

🛍 МАГАЗИН:
ТОВАР:
💰 ЦЕНА:
🚚 ДОСТАВКА:
🔗 ССЫЛКА:

В конце:
🏆 ЛУЧШИЙ ВАРИАНТ:

Не выдумывай цены и ссылки.
Если данных нет — напиши "не указано".
`;

  }
  else{

    query = `

Найди актуальные предложения:

${brand} ${model}
${type}
${search}

Проверь прежде всего:
Ozon,
Wildberries,
Яндекс Маркет,
AliExpress.

Можно добавить другие магазины,
если там есть реальная карточка товара.

Найди до 5 лучших предложений.

Для каждого:

🛍 МАГАЗИН:
ТОВАР:
💰 ЦЕНА:
🚚 ДОСТАВКА:
💵 ИТОГО:
🔗 ССЫЛКА:

В конце:
🏆 САМАЯ ВЫГОДНАЯ ЦЕНА:

Учитывай доставку.

Не придумывай цены.
Не придумывай ссылки.
Если данные неизвестны — "не указано".

Ответ кратко, без длинных объяснений.
`;

  }


  try{

    const response =
      await fetch(
        "https://parliament-striking-slim-place.trycloudflare.com/search",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            query:query,
            mode: typeof mode !== "undefined" ? mode : "find",
            latitude: window.__userLatitude || null,
            longitude: window.__userLongitude || null,
            location: window.__userLocation || ""
          })
        }
      );

    const data = await response.json();

    if(!response.ok || !data.ok){
      throw new Error(
        data.error
          ? JSON.stringify(data.error)
          : "Ошибка веб-поиска."
      );
    }

    const text =
      (data.results || [])
        .map((item, i) =>
          `${i + 1}. ${item.title || "Без названия"}\n` +
          `Цена/информация: ${item.content || "не указано"}\n` +
          `Ссылка: ${item.url || "не указано"}`
        )
        .join("\n\n");

    shoppingResult.innerHTML =
      formatShoppingResult(text);

  catch(error){

    shoppingResult.textContent =

      );

      "❌ Ошибка поиска.";

  }
  finally{

    busy = false;

    searchButton.disabled = false;
    similarButton.disabled = false;

  }

}


/* =====================================================
   SHOPPING VISUAL FORMAT
===================================================== */

function formatShoppingResult(text){

  let safe =
    escapeHTML(text);

  /*
    Сохраняем нормальный текст,
    но визуально выделяем цены.
  */

  safe =
    safe.replace(
      /(₽|руб\.?|RUB|\$|USD|€|EUR)\s?([\d\s.,]+)/gi,
      '<span class="price medium">$1 $2</span>'
    );

  safe =
    safe.replace(
      /(МАГАЗИН|🛍\s*МАГАЗИН)\s*:/gi,
      '<strong>🛍 МАГАЗИН:</strong>'
    );

  safe =
    safe.replace(
      /(САМАЯ ВЫГОДНАЯ ЦЕНА|ЛУЧШИЙ ВАРИАНТ)/gi,
      '<div class="bestBox"><strong>🏆 $1</strong>'
    );

  safe =
    safe.replace(
      /(https?:\/\/[^\s<]+)/gi,
      '<br><span style="color:#65b7ff">$1</span>'
    );

  return safe;

}


function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

          "hidden"
        );

        status.textContent =

  catch(error){

      "🎙️ ОЗВУЧИТЬ РЕЗУЛЬТАТ";

    stopSpeech.classList.add(
      "hidden"
    );

    currentAudio = null;

    status.textContent =
      "❌ Ошибка голосового AI.";

/* =====================================================
   SHORT SPEECH
===================================================== */

function buildSpeechText(){

  let text = "";

  if(productInfo.brand){
    text += productInfo.brand;
  }

  if(
    productInfo.model &&
    !/не определена|not determined/i.test(
      productInfo.model
    )
  ){

    text +=
      " "+
      productInfo.model;

  }

  if(productInfo.type){

    text +=
      ". "+
      productInfo.type;

  }

  if(!text){

    text =
      "Товар определён. Подробный результат находится на экране.";

  }

  return text + ".";

}

function stopCurrentSpeech(){

  if(currentAudio){

    try{
      currentAudio.pause();
    }
    catch(e){}

    try{
      currentAudio.currentTime = 0;
    }
    catch(e){}

    currentAudio = null;

  }

}
