<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>My AI Unified</title><style>body{margin:0;background:#0b0b0d;color:#f5f5f7;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 30px}h1{margin:4px 0}.sub{color:#999}.status{font-size:13px;margin:8px 0}.chat{min-height:58vh;background:#151518;border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto}.m{padding:12px 14px;border-radius:20px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-width:94%}.ai{background:#222226;align-self:flex-start}.me{background:#fff;color:#111;align-self:flex-end}.bar{display:flex;gap:8px;margin-top:10px}.bar textarea{flex:1;min-height:52px;border:0;border-radius:28px;padding:14px;background:#202024;color:#fff;font:inherit}.bar button,.actions button{border:0;border-radius:24px;font-weight:700}.bar button{width:58px;background:#fff;font-size:21px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.actions button{padding:13px 8px;background:#202024;color:#fff}.source{display:block;color:#9cc7ff;margin-top:7px;word-break:break-all}.pic{max-width:100%;border-radius:18px;margin-top:8px}.small{color:#777;font-size:12px;text-align:center;margin-top:9px}</style></head><body><main><h1>🧠 My AI Unified</h1><div class="sub">Один помощник: чат, поиск, фото, видео, файлы, изображения и голос.</div><div id="st" class="status">🟡 Подключаю AI…</div><section id="chat" class="chat"><div class="m ai">Готов. Напиши задачу или используй кнопки ниже.</div></section><div class="bar"><textarea id="in" placeholder="Напиши задачу…"></textarea><button id="send">➤</button></div><div class="actions"><button id="mic">🎙️ Голос</button><button id="photo">📷 Фото</button><button id="video">🎬 Видео</button><button id="file">📎 Файл</button><button id="gen">🎨 Создать</button><button id="sound">🔊 Звук</button></div><div class="small">Единый AI · версия 2026-09-11.1</div><input id="pi" type="file" accept="image/*" capture="environment" hidden><input id="vi" type="file" accept="video/*" capture="environment" hidden><input id="fi" type="file" accept=".txt,.md,.csv,.json,.xml,.html,image/*" hidden></main><script>
const $=s=>document.querySelector(s),chat=$('#chat'),inp=$('#in'),st=$('#st');const APIS=['https://ai.aliceq.ru'];let sound=true,messages=[{role:'system',content:'Ты My AI Unified. Отвечай по-русски, естественно, точно и полезно. Не называй внутренние модели и сервисы.'}];
function add(t,c='ai'){let d=document.createElement('div');d.className='m '+c;d.textContent=String(t);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function rich(t){let d=add('');for(let p of String(t).split(/(https?:\/\/[^\s]+)/g)){if(/^https?:/.test(p)){let a=document.createElement('a');a.href=p;a.target='_blank';a.rel='noopener';a.className='source';a.textContent=p;d.append(a)}else d.append(document.createTextNode(p))}return d}
function speak(t){if(!sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(t).slice(0,3500));u.lang='ru-RU';u.rate=.94;speechSynthesis.speak(u)}
async function post(base,path,body,timeout=9000){let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{let r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal,cache:'no-store'});let txt=await r.text(),j;try{j=JSON.parse(txt)}catch{j={result:txt}}if(!r.ok)throw Error(j.error||('AI HTTP '+r.status));if(j.ok===false)throw Error(j.error||'AI ошибка');return j}finally{clearTimeout(timer)}}
async function backend(path,body,timeout=9000){let last;for(let base of APIS){try{return await post(base,path,body,timeout)}catch(e){last=e}}throw last||Error('сервер недоступен')}
async function directAI(prompt){let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);try{let u='https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai&system='+encodeURIComponent('Ты My AI Unified. Отвечай по-русски, естественно, точно и полезно.');let r=await fetch(u,{signal:ctl.signal,cache:'no-store'});if(!r.ok)throw Error('AI HTTP '+r.status);let t=(await r.text()).trim();if(!t)throw Error('пустой ответ');return t}finally{clearTimeout(timer)}}
async function askAI(prompt,body){try{return (await backend('/chat',body,12000)).result}catch(primary){try{return await directAI(prompt)}catch(fallback){throw Error('AI недоступен: '+(primary.name==='AbortError'?'основной сервер не отвечает':primary.message))}}}
async function init(){for(let base of APIS){try{let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),5000);let r=await fetch(base+'/health?t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(timer);if(r.ok){st.textContent='🟢 AI подключён';return}}catch{}}st.textContent='🔴 Основной AI сейчас недоступен'}
async function send(){let t=inp.value.trim();if(!t)return;add(t,'me');inp.value='';messages.push({role:'user',content:t});let w=add('⏳ Отправляю…');try{let r=await askAI(t,{prompt:t,messages});messages.push({role:'assistant',content:String(r)});w.remove();rich(r);speak(r)}catch(e){messages.pop();w.remove();add('🔴 '+e.message+'. Попробуй ещё раз.')}}
function read(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('не удалось прочитать файл'));r.readAsDataURL(f)})}
async function analyzeImage(file){add('📷 '+(file.name||'изображение'),'me');let data=await read(file),w=add('⏳ Анализирую изображение…');try{let j=await backend('/photo',{image:data,prompt:'Опиши изображение подробно. Если это товар, определи название, модель, бренд и видимые характеристики. Если есть текст, прочитай его.'},15000);w.remove();rich(j.result||'');speak(j.result||'')}catch(e){w.remove();add('🔴 Анализ изображения не выполнен: '+e.message)}}
function analyzeVideo(file){add('🎬 '+file.name,'me');let url=URL.createObjectURL(file),v=document.createElement('video');v.src=url;v.muted=true;v.playsInline=true;v.preload='metadata';v.onloadedmetadata=()=>{v.currentTime=Math.min(3,Math.max(0,v.duration/2))};v.onseeked=async()=>{try{let c=document.createElement('canvas');c.width=Math.min(1280,v.videoWidth);c.height=Math.round(c.width*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);let blob=await new Promise(x=>c.toBlob(x,'image/jpeg',.82));await analyzeImage(blob)}finally{URL.revokeObjectURL(url)}}}
$('#send').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('🎙️ Используй микрофон клавиатуры iPhone.');return}let r=new R();r.lang='ru-RU';r.interimResults=false;r.continuous=false;r.onresult=e=>{inp.value=e.results[0][0].transcript;send()};r.onerror=()=>add('🔴 Не удалось получить голос.');try{r.start()}catch{add('🔴 Микрофон уже используется.')}};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Звук':'🔇 Звук выкл';if(!sound)speechSynthesis?.cancel()};$('#photo').onclick=()=>$('#pi').click();$('#pi').onchange=()=>{let f=$('#pi').files[0];if(f)analyzeImage(f);$('#pi').value=''};$('#video').onclick=()=>$('#vi').click();$('#vi').onchange=()=>{let f=$('#vi').files[0];if(f)analyzeVideo(f);$('#vi').value=''};$('#file').onclick=()=>$('#fi').click();$('#fi').onchange=async()=>{let f=$('#fi').files[0];if(!f)return;add('📎 '+f.name,'me');if(f.type.startsWith('image/'))await analyzeImage(f);else if(/\.(txt|md|csv|json|xml|html)$/i.test(f.name)){let text=await f.text(),w=add('⏳ Анализирую файл…');try{let j=await backend('/chat',{prompt:'Проанализируй этот файл:\n\n'+text.slice(0,50000),messages:[...messages,{role:'user',content:'Проанализируй этот файл:\n\n'+text.slice(0,50000)}]},15000);w.remove();rich(j.result||'');speak(j.result||'')}catch(e){w.remove();add('🔴 '+e.message)}}else add('🔴 Для этого типа файла пока нужен отдельный серверный обработчик.');$('#fi').value=''};$('#gen').onclick=()=>{let p=inp.value.trim();if(!p){add('Сначала напиши, что создать.');return}add('🎨 '+p,'me');inp.value='';let d=add('⏳ Создаю…'),im=document.createElement('img');im.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?model=flux&width=1024&height=1024&nologo=true';im.className='pic';im.onload=()=>{d.textContent='';d.append(im);let a=document.createElement('a');a.href=im.src;a.target='_blank';a.className='source';a.textContent='Открыть изображение';d.append(a)};im.onerror=()=>d.textContent='🔴 Генерация изображения сейчас недоступна.'};init();
</script></body></html>
