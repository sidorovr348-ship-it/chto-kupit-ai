<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My AI Unified</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:22px 16px 36px}h1{font-size:30px;margin:8px 0 4px}.sub{color:#999;margin-bottom:20px}.chat{min-height:55vh;background:#151518;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{padding:12px 14px;border-radius:17px;line-height:1.45;white-space:pre-wrap}.ai{background:#222226;align-self:flex-start;max-width:90%}.user{background:#fff;color:#111;align-self:flex-end;max-width:90%}.bar{display:flex;gap:8px;margin-top:12px}.bar textarea{flex:1;resize:none;border:0;border-radius:17px;padding:14px;background:#202024;color:#fff;font:inherit;min-height:52px}.bar button{width:58px;border:0;border-radius:17px;background:#fff;font-size:23px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{padding:13px;border:0;border-radius:15px;background:#202024;color:#fff;font-weight:700}.hint{color:#777;font-size:13px;text-align:center;margin-top:10px}</style></head><body><main><h1>🧠 My AI Unified</h1><div class="sub">Один помощник. Ты просто говоришь, что нужно сделать.</div><section class="chat" id="chat"><div class="msg ai">Готов. Скажи, что нужно сделать: найти информацию, разобрать фото или видео, проанализировать таблицу, написать код, найти товар или выполнить другую задачу.</div></section><div class="bar"><textarea id="input" placeholder="Напиши или продиктуй задачу…"></textarea><button id="send">➤</button></div><div class="actions"><button id="voice">🎙️ Голос</button><button id="photo">📷 Фото</button><button id="file">📎 Файл</button><button id="reset">↻ Сначала</button></div><div class="hint">Dispatcher (диспетчер) сам определяет нужный тип AI и инструмент.</div><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><input id="fileInput" type="file" hidden><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input');function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function send(){const text=input.value.trim();if(!text)return;add(text,'user');input.value='';add('⏳ Определяю задачу…','ai');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text})});if(!r.ok)throw new Error();const j=await r.json();chat.lastChild.remove();add(j.message||j.answer||'Задача принята.','ai')}catch(e){chat.lastChild.remove();add('🔵 Интерфейс готов. Рабочий API будет подключён к этому интерфейсу на следующем этапе.','ai')}}document.querySelector('#send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelector('#voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('Голосовой ввод не поддерживается этим браузером.','ai');return}const r=new R();r.lang='ru-RU';r.onresult=e=>{input.value=e.results[0][0].transcript;send()};r.start()};document.querySelector('#photo').onclick=()=>document.querySelector('#photoInput').click();document.querySelector('#file').onclick=()=>document.querySelector('#fileInput').click();document.querySelector('#photoInput').onchange=e=>{if(e.target.files[0]){add('📷 Фото: '+e.target.files[0].name,'user');add('⏳ Передаю изображение Dispatcher (диспетчеру).','ai')}};document.querySelector('#fileInput').onchange=e=>{if(e.target.files[0]){add('📎 Файл: '+e.target.files[0].name,'user');add('⏳ Файл принят. Dispatcher определит обработчик.','ai')}};document.querySelector('#reset').onclick=()=>{chat.innerHTML='<div class="msg ai">Готов. Скажи, что нужно сделать.</div>';input.value=''}</script></main></body></html>
