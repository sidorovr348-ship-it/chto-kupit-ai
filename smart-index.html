function createRecognition(){

  if(rec!==x)return;

  clearTimeout(silenceTimer);
  silenceTimer=setTimeout(()=>{
   if(rec!==x||paused||processing)return;
   status('🟡 Перезапускаю распознавание после тишины…');
   stopCurrent(true);scheduleStart(Math.min(3500,700*(++attempts)));
  },18000);
 };
 x.onresult=e=>{
  if(rec!==x||paused)return;
  clearTimeout(silenceTimer);
  let spoken='';
  for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)spoken+=' '+String(e.results[i][0]?.transcript||'');

  const parsed=extract(spoken);
  if(parsed.wake){
   if(parsed.command){armedUntil=0;enqueue(parsed.command)}
   else{armedUntil=Date.now()+12000;status('🟢 Слушаю. Теперь задай вопрос…',true);stopCurrent(false);scheduleStart(250)}

  }

  }

   permissionBlocked=true;status('🎙️ Микрофон недоступен. Проверь разрешение Safari и нажми экран для повтора.');stopCurrent(true);return;
  }

 x.onend=()=>{
  clearTimeout(silenceTimer);
  if(rec!==x)return;

}
function start(){
