name: My AI Unified — canonical frontend resilience
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make frontend voice and network resilient
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          a=s.index('async function post(path,body,timeout=120000){')
          b=s.index('async function check(){',a)
          new='''async function post(path,body,timeout=120000){let last=null;for(let attempt=0;attempt<4;attempt++){const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body),cache:'no-store',mode:'cors',signal:c.signal});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok){const e=Error(j.error||('Ошибка сервера HTTP '+r.status));if((r.status>=500||r.status===429)&&attempt<3){last=e;await new Promise(x=>setTimeout(x,[1000,2500,5000][attempt]||7000));continue}throw e}return j}catch(e){last=e;if(attempt<3){await new Promise(x=>setTimeout(x,[1000,2500,5000][attempt]||7000));continue}if(e.name==='AbortError')throw Error('Сервер не ответил вовремя.');if(/Load failed|Failed to fetch|NetworkError/i.test(e.message))throw Error('Не удаётся связаться с AI-сервером. Проверь интернет/VPN и повтори.');throw e}finally{clearTimeout(tm)}}throw last||Error('Не удалось выполнить запрос.')}\n'''
          s=s[:a]+new+s[b:]
          # Remove the duplicate voice transcript: send() itself renders the user message.
          s=s.replace("add('🎙️ '+text,'user');input.value=text;await send()","input.value=text;await send()",1)
          # Replace the old button-only recognition with hands-free wake-word listening.
          va=s.index('async function startVoice(){')
          vb=s.index('function stopVoice(){',va)
          voice='''async function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return add('🔴 Safari не поддерживает режим «Эй» на этом устройстве.');if(recorder?.recognition)return;try{const r=new SR();r.lang='ru-RU';r.continuous=true;r.interimResults=false;r.maxAlternatives=1;recorder={state:'recording',recognition:r,wake:true};let restarting=false;r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;const raw=String(e.results[i][0]?.transcript||'').trim();const m=raw.match(/^\\s*эй[,:;.!?\\-\\s]*(.*)$/iu);if(m){const command=String(m[1]||'').trim();if(command){input.value=command;send()}}}};r.onerror=e=>{const code=e?.error||'unknown';if(code==='not-allowed'||code==='service-not-allowed'){add('🔴 Safari не дал доступ к микрофону. Разреши микрофон для Safari.');stopVoice()}else if(code!=='aborted'&&code!=='no-speech'){diag.textContent='Голос: '+code}};r.onend=()=>{if(recorder?.recognition!==r||restarting)return;if(document.visibilityState==='visible'){restarting=true;setTimeout(()=>{restarting=false;try{r.start()}catch{}},300)}};r.start();$('#voice').textContent='🟢 Слушаю «Эй»';$('#voice').classList.add('active');diag.textContent='Голос: скажи «Эй» и затем вопрос.';return}catch(e){recorder=null;add('🔴 Не удалось включить голос: '+e.message)}}
'''
          s=s[:va]+voice+s[vb:]
          # Make stopping clear the hands-free state.
          old="function stopVoice(){if(recorder?.recognition){try{recorder.recognition.stop()}catch{}recorder=null;$('#voice').textContent='🎙️ Голос';$('#voice').classList.remove('active');return}"
          newstop="function stopVoice(){if(recorder?.recognition){try{recorder.recognition.onend=null;recorder.recognition.stop()}catch{}recorder=null;$('#voice').textContent='🎙️ Голос';$('#voice').classList.remove('active');diag.textContent='';return}"
          s=s.replace(old,newstop,1)
          # Name the assistant and make the hands-free behavior explicit in the UI.
          s=s.replace('<h1>🧠 My AI Unified</h1>','<h1>👋 Эй</h1>',1)
          s=s.replace('<div class="sub">Чат, поиск, товары, фото, камера, видео, файлы, голос и картинки.</div>','<div class="sub">Чат, поиск, товары, фото, камера, видео, файлы, голос и картинки.</div>',1)
          s=s.replace('<button id="voice">🎙️ Голос</button>','<button id="voice">🎙️ Эй</button>',1)
          # Prevent duplicate click-triggered user messages when recognition sends the command.
          s=s.replace("$('#voice').onclick=()=>recorder&&((recorder.state&&recorder.state!=='inactive')||recorder.recognition)?stopVoice():startVoice();","$('#voice').onclick=()=>recorder?.recognition?stopVoice():startVoice();",1)
          # Bump cache/version so Safari receives the new page.
          s=s.replace('2026-09-15-voice-fix','2026-09-15-ey-handsfree-v1',1)
          p.write_text(s)
          PY
      - name: Commit canonical fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: hands-free wake word Эй'
          git push
