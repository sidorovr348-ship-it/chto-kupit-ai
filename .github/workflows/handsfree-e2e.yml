name: My AI Unified — hands-free E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  handsfree:
    runs-on: ubuntu-latest
    timeout-minutes: 8 # wake-gate-v2
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          set -euo pipefail
          node -e "require('playwright')" >/dev/null 2>&1 || npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run repeated hands-free wake test
        run: node wake-buffer-e2e.mjs
