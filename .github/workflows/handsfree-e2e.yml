name: My AI Unified — hands-free E2E

on:
  workflow_run:
    workflows: ["My AI Unified — production deploy"]
    types: [completed]
  workflow_dispatch:

jobs:
  handsfree:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          set -euo pipefail
          node -e "require('playwright')" >/dev/null 2>&1 || npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run repeated hands-free wake test
        run: node wake-buffer-e2e.mjs
