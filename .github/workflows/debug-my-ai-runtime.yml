name: Debug My AI Unified runtime
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect VPS runtime diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -u
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== SERVICE STATUS ==='
          systemctl status my-ai-unified --no-pager -l
          echo '=== JOURNAL ==='
          journalctl -u my-ai-unified -n 120 --no-pager -o short-iso
          echo '=== SERVER CHECK ==='
          workdir=$(systemctl show -p WorkingDirectory --value my-ai-unified)
          echo "WORKDIR=$workdir"
          node --check "$workdir/server.js"
          node --check "$workdir/src/local-ai.js"
          echo '=== LISTENING PORTS ==='
          ss -ltnp | grep -E ':3020|:11434' || true
          echo '=== PROCESS ==='
          pgrep -af 'node.*server.js' || true
          echo '=== HEALTH DIRECT ==='
          curl -sS --max-time 5 http://127.0.0.1:3020/health || true
          echo
          echo '=== OLLAMA DIRECT ==='
          curl -sS --max-time 5 http://127.0.0.1:11434/api/tags || true
          echo
          REMOTE