name: My AI Unified — production deploy v3 smart
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: my-ai-unified-production-smart
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate smart frontend and backend
        run: |
          set -euo pipefail
          node --check local-gateway.js
          node --check memory-map.js
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('smart-index.html','utf8');
          const x=h.match(/<script>([\s\S]*?)<\/script>/i);
          if(!x) throw Error('smart frontend script missing');
          new Function(x[1]);
          for(const id of ['send','voice','photo','camera','video','file','imagegen','sound','stop','clear','camAnalyze','camShot','camOff']) if(!h.includes('id="'+id+'"')) throw Error('missing '+id);
          for(const s of ['MediaRecorder','/transcribe','.zip','getUserMedia']) if(!h.includes(s)) throw Error('missing capability '+s);
          console.log('SMART_FRONTEND_OK');
          NODE
          node --test test-local-gateway.js
      - name: Deploy backend to VPS and patch archive support
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=5 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          workdir=$(ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          test -n "$workdir"
          scp "${O[@]}" -q local-gateway.js "$VPS_USER@$VPS_HOST:$workdir/local-gateway.js"
          scp "${O[@]}" -q memory-map.js "$VPS_USER@$VPS_HOST:$workdir/memory-map.js"
          scp "${O[@]}" -q package.json "$VPS_USER@$VPS_HOST:$workdir/package.json"
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "WORKDIR='$workdir' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$WORKDIR"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('local-gateway.js'); s=p.read_text()
          s=s.replace("const path=require('path');", "const path=require('path');\nconst {memoryMiddleware,memoryRoutes}=require('./memory-map');", 1) if "require('./memory-map')" not in s else s
          if "app.use(memoryMiddleware);" not in s:
              marker="app.get('/health'"
              if marker not in s: raise SystemExit('MEMORY_ROUTE_TARGET_NOT_FOUND')
              s=s.replace(marker,"app.use(memoryMiddleware);\nmemoryRoutes(app);\n"+marker,1)
          s=s.replace("const GROQ_VISION_MODEL=process.env.GROQ_VISION_MODEL||'qwen/qwen3.6-27b'","const GROQ_VISION_MODEL='qwen/qwen3.6-27b'",1)
          s=s.replace("const GROQ_TEXT_MODEL=process.env.GROQ_MODEL||'openai/gpt-oss-120b'","const GROQ_TEXT_MODEL=process.env.GROQ_MODEL||'openai/gpt-oss-20b'",1)
          sys="const sys='Ты — «Эй», умный русскоязычный персональный помощник и собеседник. Веди естественный живой диалог и учитывай контекст предыдущих сообщений. Отвечай дружелюбно, уверенно и человеческим языком; если пользователь просто общается — общайся, а не превращай ответ в сухую справку. Если нужна актуальная информация, поиск, товар, цена, файл, фото или другая задача — выполняй её и отделяй проверенное от предположений. Не выдумывай факты, цены, наличие или характеристики. Не упоминай внутренние модели, ключи и серверы без прямого вопроса пользователя.';"
          s=re.sub(r"const sys='[^']*';",sys,s,count=1)
          zipfn="""async function extractZip(buf){const {spawn}=require('child_process');return await new Promise((resolve,reject)=>{const py=`import sys,zipfile,io,json\ndata=sys.stdin.buffer.read()\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n out=[]\n for info in z.infolist():\n  n=info.filename\n  if info.is_dir() or n.startswith('/') or '..' in n.split('/'):\n   continue\n  size=info.file_size\n  item={'name':n,'size':size}\n  low=n.lower()\n  if size<=1000000 and low.endswith(('.txt','.md','.csv','.tsv','.json','.xml','.html','.js','.css','.log','.py')):\n   try:item['text']=z.read(info).decode('utf-8','replace')[:120000]\n   except Exception as e:item['text']='[не удалось прочитать текст: '+str(e)+']'\n  out.append(item)\n print(json.dumps(out,ensure_ascii=False))`;const p=spawn('python3',['-c',py]);let o='',e='';p.stdout.on('data',d=>o+=d);p.stderr.on('data',d=>e+=d);p.on('error',reject);p.on('close',code=>{if(code||!o)return reject(Error('Не удалось открыть ZIP: '+(e||'python3 error')));try{resolve(JSON.parse(o))}catch(x){reject(x)}});p.stdin.end(buf)})}"""
          if 'async function extractZip(' not in s:
              pos=s.index('async function extractDocument(')
              s=s[:pos]+zipfn+'\n'+s[pos:]
          old="const buf=Buffer.from(m[2],'base64'),mime=m[1],name=String(b.name||'').toLowerCase();"
          new="const buf=Buffer.from(m[2],'base64'),mime=m[1],name=String(b.name||'').toLowerCase();if(/zip|\\.zip$/i.test(mime+' '+name)){const entries=await extractZip(buf);const listed=entries.map(x=>`ФАЙЛ: ${x.name} (${x.size} байт)${x.text?'\\n'+x.text:''}`).join('\\n\\n');return ('СОДЕРЖИМОЕ ZIP-АРХИВА:\\n\\n'+listed).slice(0,180000)}"
          if old not in s: raise SystemExit('ZIP_TARGET_NOT_FOUND')
          s=s.replace(old,new,1)
          p.write_text(s)
          print('SMART_RUNTIME_PATCH_OK')
          PY
          npm install --omit=dev --no-audit --no-fund
          node --check local-gateway.js
          node --check memory-map.js
          systemctl restart my-ai-unified
          for i in $(seq 1 30); do systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/h.json && break; sleep 1; done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          a=j.get('adapters',{}); assert a.get('groq') and a.get('groqVision') and a.get('search') and a.get('tts') and a.get('stt') and a.get('documents') and a.get('video'),j
          print('LOCAL_HEALTH_OK')
          PY
          curl -fsS --max-time 90 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/c.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json')); assert j.get('ok') and j.get('result'),j; print('LOCAL_CHAT_OK')
          PY
          curl -fsS --max-time 40 -X POST http://127.0.0.1:3020/tts -H 'Content-Type: application/json' --data '{"text":"Проверка голоса."}' -o /tmp/tts.mp3
          test -s /tmp/tts.mp3; echo LOCAL_TTS_OK
          curl -fsS --max-time 20 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"memoryId":"smoke-memory","prompt":"Эй, запомни правило: отвечай по-русски"}' >/tmp/m.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/m.json')); assert j.get('ok') and 'Запомнил' in j.get('result',''),j; print('LOCAL_MEMORY_SAVE_OK')
          PY
          curl -fsS --max-time 20 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"memoryId":"smoke-memory","prompt":"Эй, что ты обо мне запомнил?"}' >/tmp/m2.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/m2.json')); assert 'по-русски' in j.get('result',''),j; print('LOCAL_MEMORY_READ_OK')
          PY
          REMOTE
      - name: Verify public API
        run: |
          set -euo pipefail
          sleep 10
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 90 https://ai.aliceq.ru/health >/tmp/h.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          a=j.get('adapters',{}); assert all(a.get(k) for k in ['groq','groqVision','search','tts','stt','documents','video']),j
          print('PUBLIC_HEALTH_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/c.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json')); assert j.get('ok') and j.get('result'),j; print('PUBLIC_CHAT_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 -X POST https://ai.aliceq.ru/tts -H 'Content-Type: application/json' --data '{"text":"Проверка голоса."}' -o /tmp/t.mp3
          test -s /tmp/t.mp3; echo PUBLIC_TTS_OK
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"memoryId":"public-smoke","prompt":"Эй, запомни правило: smoke-memory-OK"}' >/tmp/m.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/m.json')); assert j.get('ok') and 'Запомнил' in j.get('result',''),j; print('PUBLIC_MEMORY_SAVE_OK')
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"memoryId":"public-smoke","prompt":"Эй, что ты обо мне запомнил?"}' >/tmp/m2.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/m2.json')); assert 'smoke-memory-OK' in j.get('result',''),j; print('PUBLIC_MEMORY_READ_OK')
          PY
      - name: Publish smart Pages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('smart-index.html'); x=p.read_text()
          if 'my-ai-memory-id-v1' not in x:
              x=x.replace("const API='https://ai.aliceq.ru'", "const API='https://ai.aliceq.ru',MEMORY_KEY='my-ai-memory-id-v1',MEMORY_ID=localStorage.getItem(MEMORY_KEY)||(crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2)));localStorage.setItem(MEMORY_KEY,MEMORY_ID)",1)
          if 'memoryId:MEMORY_ID' not in x:
              x=x.replace("api('/chat',{prompt:t,messages}","api('/chat',{prompt:t,messages,memoryId:MEMORY_ID}",1)
          p.write_text(x)
          PY
          rm -rf pages && mkdir pages
          cp smart-index.html pages/index.html
          printf '%s\n' '{"ok":true,"api":"https://ai.aliceq.ru","version":"smart-2026-09-15-memory-map"}' > pages/api.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
