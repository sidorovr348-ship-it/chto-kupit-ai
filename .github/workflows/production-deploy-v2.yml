name: My AI Unified — production deploy v6 smart
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: my-ai-unified-production-smart
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          set -euo pipefail
          node --check local-gateway.js
          node --check memory-map.js
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('smart-index.html','utf8');
          const x=h.match(/<script>([\s\S]*?)<\/script>/i); if(!x) throw Error('smart frontend script missing');
          new Function(x[1]);
          for(const id of ['send','voice','photo','camera','video','file','imagegen','sound','stop','clear','camAnalyze','camShot','camOff']) if(!h.includes('id="'+id+'"')) throw Error('missing '+id);
          for(const s of ['MediaRecorder','/transcribe','.zip','getUserMedia','memoryId']) if(!h.includes(s)) throw Error('missing capability '+s);
          console.log('SOURCE_OK');
          NODE
          node --test test-local-gateway.js
      - name: Fix smart frontend dispatcher
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('smart-index.html'); s=p.read_text()
          old="let shop=/(найди|найти|где купить|купить|цена|стоимость|в наличии|магазин|закаж|дешевле|сравни|товар|телефон|телевизор|стиральн|карниз|iphone|айфон)/iu.test(t);let j=shop?await api('/shopping',{query:t},150000):await api('/chat',{prompt:t,messages,memoryId:MEMORY_ID,...loc},150000);"
          new="let j=await api('/chat',{prompt:t,messages,memoryId:MEMORY_ID,...loc},180000);"
          if old in s: s=s.replace(old,new,1)
          else:
              import re
              s=re.sub(r"let shop=.*?;let j=shop\?await api\('/shopping',\{query:t\},150000\):await api\('/chat',\{prompt:t,messages,memoryId:MEMORY_ID,\.\.\.loc\},150000\);",new,s,count=1)
          p.write_text(s)
          PY
      - name: Deploy and verify VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=5 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          workdir=$(ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          test -n "$workdir"
          scp "${O[@]}" -q local-gateway.js "$VPS_USER@$VPS_HOST:$workdir/local-gateway.js"
          scp "${O[@]}" -q memory-map.js "$VPS_USER@$VPS_HOST:$workdir/memory-map.js"
          scp "${O[@]}" -q package.json "$VPS_USER@$VPS_HOST:$workdir/package.json"
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "WORKDIR='$workdir' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$WORKDIR"
          npm install --omit=dev --no-audit --no-fund
          node --check local-gateway.js
          node --check memory-map.js
          systemctl restart my-ai-unified
          for i in $(seq 1 30); do systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/h.json && break; sleep 1; done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          a=j.get('adapters',{}); assert all(a.get(k) for k in ['groq','groqVision','search','tts','stt','documents','video','zip']),j; print('LOCAL_HEALTH_OK')
          PY
          curl -fsS --max-time 90 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/c.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json')); assert j.get('ok') and j.get('route')=='chat' and j.get('result'),j; print('LOCAL_CHAT_OK')
          PY
          curl -fsS --max-time 120 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Найди iPhone 18 Pro в Москве где купить дешевле"}' >/tmp/shop.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/shop.json')); assert j.get('ok') and j.get('route')=='shopping' and j.get('results'),j; print('LOCAL_SMART_SHOPPING_OK',len(j['results']))
          PY
          curl -fsS --max-time 90 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Найди свежую информацию о погоде в Москве сегодня"}' >/tmp/search.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/search.json')); assert j.get('ok') and j.get('route')=='search' and j.get('sources'),j; print('LOCAL_SMART_SEARCH_OK')
          PY
          python3 - <<'PY'
          import base64,json
          png=base64.b64encode(bytes.fromhex('89504e470d0a1a0a0000000d4948445200000040000000400806000000aa6971de0000000d49444154789c6360a001000000ffff03000006000557bf9b0000000049454e44ae426082')).decode()
          open('/tmp/photo.json','w').write(json.dumps({'images':['data:image/png;base64,'+png],'prompt':'Опиши изображение одним коротким предложением.'},ensure_ascii=False))
          PY
          P=$(curl -sS --max-time 120 -o /tmp/p.json -w '%{http_code}' -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data-binary @/tmp/photo.json); test "$P" = 200
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/p.json')); assert j.get('ok') and j.get('result'),j; print('LOCAL_PHOTO_OK',j.get('provider'),j.get('model'))
          PY
          curl -fsS --max-time 40 -X POST http://127.0.0.1:3020/tts -H 'Content-Type: application/json' --data '{"text":"Проверка голоса."}' -o /tmp/t.mp3; test -s /tmp/t.mp3; echo LOCAL_TTS_OK
          curl -fsS --max-time 90 -X POST http://127.0.0.1:3020/document -H 'Content-Type: application/json' --data '{"name":"smoke.txt","mime":"text/plain","text":"Это тестовый документ. Ответь одним словом: ДОК_OK"}' >/tmp/d.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/d.json')); assert j.get('ok') and j.get('result'),j; print('LOCAL_DOCUMENT_OK')
          PY
          python3 - <<'PY'
          import io,zipfile,json,base64
          b=io.BytesIO()
          with zipfile.ZipFile(b,'w',zipfile.ZIP_DEFLATED) as z:z.writestr('hello.txt','ZIP_OK');z.writestr('data.json','{"ok":true}')
          open('/tmp/z.json','w').write(json.dumps({'name':'smoke.zip','mime':'application/zip','file':'data:application/zip;base64,'+base64.b64encode(b.getvalue()).decode()}))
          PY
          curl -fsS --max-time 120 -X POST http://127.0.0.1:3020/document -H 'Content-Type: application/json' --data-binary @/tmp/z.json >/tmp/zr.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/zr.json')); assert j.get('ok') and 'hello.txt' in j.get('result','') and 'data.json' in j.get('result',''),j; print('LOCAL_ZIP_OK')
          PY
          REMOTE
      - name: Verify public API
        run: |
          set -euo pipefail
          sleep 8
          API=https://ai.aliceq.ru
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 90 "$API/health" >/tmp/h.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          a=j.get('adapters',{}); assert all(a.get(k) for k in ['groq','groqVision','search','tts','stt','documents','video','zip']),j; print('PUBLIC_HEALTH_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 120 -X POST "$API/chat" -H 'Content-Type: application/json' --data '{"prompt":"Кто ты?"}' >/tmp/c.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json')); assert j.get('ok') and j.get('route')=='chat' and j.get('result'),j; print('PUBLIC_CHAT_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 120 -X POST "$API/chat" -H 'Content-Type: application/json' --data '{"prompt":"Найди iPhone 18 Pro в Москве где купить дешевле"}' >/tmp/s.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/s.json')); assert j.get('ok') and j.get('route')=='shopping' and j.get('results'),j; print('PUBLIC_SHOPPING_OK',len(j['results']))
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 120 -X POST "$API/photo" -H 'Content-Type: application/json' --data '{"images":["data:image/png;base64,"],"prompt":"Опиши изображение одним коротким предложением."}' >/tmp/p.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/p.json')); assert j.get('ok') and j.get('result'),j; print('PUBLIC_PHOTO_OK',j.get('provider'),j.get('model'))
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$API/tts" -H 'Content-Type: application/json' --data '{"text":"Проверка голоса."}' -o /tmp/t.mp3; test -s /tmp/t.mp3; echo PUBLIC_TTS_OK
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 -X POST "$API/document" -H 'Content-Type: application/json' --data '{"name":"smoke.txt","mime":"text/plain","text":"Это тестовый документ."}' >/tmp/d.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/d.json')); assert j.get('ok') and j.get('result'),j; print('PUBLIC_DOCUMENT_OK')
          PY
      - name: Publish smart Pages
        run: |
          set -euo pipefail
          rm -rf pages && mkdir pages
          cp smart-index.html pages/index.html
          printf '%s\n' '{"ok":true,"api":"https://ai.aliceq.ru","version":"smart-2026-09-15"}' > pages/api.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
