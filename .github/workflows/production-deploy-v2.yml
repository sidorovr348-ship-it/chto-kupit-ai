name: My AI Unified — production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          set -euo pipefail
          node --check local-gateway.js
          node --check memory-map.js
          node --check image-generation-fallback.js
          node --check vision-runtime-hotfix.js
          node --test test-local-gateway.js
          grep -q 'EY_WAKE_WORD_V1' smart-index.html
          grep -q 'MediaRecorder' smart-index.html
          grep -q 'memoryId' smart-index.html
          grep -q 'window.send=send' smart-index.html
          grep -q 'navigator.geolocation' smart-index.html
          grep -q '/generate-image' smart-index.html
      - name: Deploy backend to VPS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"; test -n "$VPS_USER"; test -n "$VPS_SSH_KEY"
          printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key; chmod 600 /tmp/vps_key
          ssh_opts=(-i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          WORKDIR=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          [ -n "$WORKDIR" ] || WORKDIR=/root/my-ai-unified
          scp "${ssh_opts[@]}" local-gateway.js memory-map.js image-generation-fallback.js vision-runtime-hotfix.js package.json "$VPS_USER@$VPS_HOST:$WORKDIR/"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "cd '$WORKDIR' && npm install --omit=dev --no-audit --no-fund && node --check local-gateway.js && node --check memory-map.js && node --check image-generation-fallback.js && node --check vision-runtime-hotfix.js && node image-generation-fallback.js local-gateway.js && node vision-runtime-hotfix.js local-gateway.js && node --check local-gateway.js && systemctl restart my-ai-unified"
          healthy=0
          for i in $(seq 1 30); do
            if ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "curl -fsS http://127.0.0.1:3020/health >/tmp/my-ai-health.json"; then healthy=1; break; fi
            sleep 1
          done
          test "$healthy" = 1
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "cat /tmp/my-ai-health.json"
          rm -f /tmp/vps_key
      - name: Verify public API
        shell: bash
        run: |
          set -euo pipefail
          API='https://ai.aliceq.ru'
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 90 "$API/health" >/tmp/health.json
          cat /tmp/health.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/health.json')); assert j.get('ok') and j.get('dispatcher'),j
          print('PUBLIC_HEALTH_OK')
          PY
          curl --fail --silent --show-error --max-time 120 -X POST "$API/chat" -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/chat.json
          cat /tmp/chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/chat.json')); assert j.get('result') or j.get('text') or j.get('answer'),j
          print('CHAT_OK')
          PY
          curl --fail --silent --show-error --max-time 180 -X POST "$API/shopping" -H 'Content-Type: application/json' --data '{"query":"Найди iPhone 18 Pro в Москве"}' >/tmp/shopping.json
          cat /tmp/shopping.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/shopping.json')); assert j.get('ok') and j.get('results'),j
          print('SHOPPING_OK',len(j['results']))
          PY
          printf '%s\n' '{"images":["https://placehold.co/256x256.jpg"],"prompt":"Кратко опиши изображение по-русски. Ответь одним предложением."}' >/tmp/photo.json
          photo_ok=0
          for attempt in $(seq 1 32); do
            echo "PHOTO_ATTEMPT=$attempt"
            rm -f /tmp/photo-result.json /tmp/photo.err
            curl --silent --show-error --max-time 120 -X POST "$API/photo" -H 'Content-Type: application/json' --data-binary @/tmp/photo.json >/tmp/photo-result.json 2>/tmp/photo.err || true
            cat /tmp/photo-result.json || true
            if grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/photo-result.json; then photo_ok=1; break; fi
            if grep -qi '502\|rate limit\|try again in\|429\|temporarily' /tmp/photo-result.json; then sleep 30; continue; fi
            cat /tmp/photo.err || true
            break
          done
          test "$photo_ok" = 1
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo-result.json')); assert j.get('ok') and j.get('result'),j
          print('PHOTO_OK',j.get('provider'),j.get('model'))
          PY
          curl --fail --silent --show-error --max-time 180 -X POST "$API/generate-image" -H 'Content-Type: application/json' --data '{"prompt":"Простой красный круг на белом фоне"}' >/tmp/image.json
          cat /tmp/image.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/image.json')); assert j.get('ok') and (j.get('url') or j.get('dataUrl') or j.get('image')),j
          print('IMAGE_GEN_OK',j.get('provider'),j.get('model'))
          PY
          echo PUBLIC_API_OK
      - name: Publish Pages
        run: |
          set -euo pipefail
          mkdir -p pages
          cp smart-index.html pages/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
