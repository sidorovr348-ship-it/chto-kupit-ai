name: My AI Unified — production deploy
# production root audit is mandatory before downstream mobile and deep-audit checks
# verified redeploy trigger for deterministic time/location and final vision fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: my-ai-unified-acceptance-suite
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          set -euo pipefail
          bash -n scripts/deploy-vps.sh scripts/rollback-vps.sh
          python3 -m py_compile scripts/prepare-vps-key.py
          node --check local-gateway.js
          node --check memory-map.js
          node --check image-generation-fallback.js
          node --check vision-runtime-hotfix.js
          node --check supervisor-daemon.js
          node --check autonomy-lab/autonomy-orchestrator.mjs
          node --check autonomy-lab/project-adapter.mjs
          node --check autonomy-lab/project-task-bridge.mjs
          node --check autonomy-lab/merge-readiness-gate.mjs
          node --check autonomy-lab/release-controller.mjs
          node --check autonomy-lab/runtime.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node --check src/deadline.js
          node --check src/speech-text.js
          node --check src/single-flight.js
          grep -q 'EY_WAKE_WORD_V2_STATE_MACHINE' smart-index.html
          grep -q 'let rec=null' smart-index.html
          grep -q 'function processQueue()' smart-index.html
          grep -q 'MediaRecorder' smart-index.html
          grep -q 'memoryId' smart-index.html
          grep -q 'window.send=send' smart-index.html
          grep -q 'navigator.geolocation' smart-index.html
          grep -q '/generate-image' smart-index.html
      - name: Deploy backend to VPS
        id: deploy_backend
        shell: bash
        run: bash scripts/deploy-vps.sh

      - name: Verify complete public production
        shell: bash
        run: |
          set -euo pipefail
          acceptance_ok=0
          for attempt in 1 2 3; do
            if node production-acceptance.mjs; then acceptance_ok=1; break; fi
            if [ "$attempt" = 1 ]; then
              echo 'VISION_PROVIDER_COOLDOWN_WAIT_30S'
              sleep 30
            fi
          done
          if [ "$acceptance_ok" != 1 ]; then
            echo 'PRODUCTION_ACCEPTANCE_FAILED'
            exit 1
          fi
          status=""
          autonomy_ready=0
          for attempt in $(seq 1 30); do
            status=$(curl -fsS --max-time 10 https://ai.aliceq.ru/autonomy/status || true)
            echo "AUTONOMY_STATUS_ATTEMPT=$attempt $status"
            if echo "$status" | grep -q 'FULL_BOUNDED'; then autonomy_ready=1; break; fi
            if echo "$status" | grep -q '"initState":"failed"'; then
              echo "AUTONOMY_INITIALIZATION_FAILED"
              exit 1
            fi
            sleep 2
          done
          test "$autonomy_ready" = 1
          self=$(curl -fsS --max-time 30 -X POST -H 'Content-Type: application/json' -d '{}' https://ai.aliceq.ru/autonomy/self-check)
          echo "$self"
          echo "$self" | grep -q '"ok":true'
          task=$(curl -fsS --max-time 30 -X POST -H 'Content-Type: application/json' -d '{"kind":"self-check","goal":"Публичная проверка лабораторного контура"}' https://ai.aliceq.ru/autonomy/task)
          echo "$task"
          echo "$task" | grep -q '"ok":true'
          for payload in \
            '{"kind":"chat","goal":"Лабораторный smoke-тест чата","input":{"prompt":"Кто ты?"}}' \
            '{"kind":"search","goal":"Лабораторный smoke-тест поиска","input":{"query":"OpenAI"}}' \
            '{"kind":"vision","goal":"Лабораторный smoke-тест зрения","input":{"prompt":"Опиши тестовое изображение","images":["https://docs.mistral.ai/img/eiffel-tower-paris.jpg"]}}'; do
            lab=""
            ok=0
            for attempt in 1 2 3 4 5; do
              if lab=$(curl -fsS --retry 2 --retry-all-errors --retry-delay 2 --max-time 60 -X POST -H 'Content-Type: application/json' -d "$payload" https://ai.aliceq.ru/autonomy/task); then
                if echo "$lab" | grep -q '"ok":true' && echo "$lab" | grep -q '"status":"ACCEPTED"'; then ok=1; break; fi
              fi
              echo "LAB_RETRY attempt=$attempt" >&2
              sleep 2
            done
            test "$ok" = 1
            echo "$lab"
          done
          echo LAB_CONTOUR_PUBLIC_SMOKE_OK
          echo COMPLETE_PUBLIC_PRODUCTION_OK
      - name: Run 100-case production acceptance
        timeout-minutes: 30
        run: |
          set -euo pipefail
          node acceptance-100.mjs

      - name: Diagnose backend after acceptance failure
        if: failure()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import os
          import os, base64, binascii
          raw = os.environ["VPS_SSH_KEY"].strip()
          if raw.startswith(("'", '"')) and raw[-1:] == raw[:1]:
              raw = raw[1:-1]
          raw = raw.replace("\\r", "\r").replace("\\n", "\n").replace("\r", "")
          key = raw.strip()
          if key.startswith("VPS_SSH_KEY="):
              key = key.split("=", 1)[1].strip().strip("'\"")
          if not key.startswith("-----BEGIN ") or "PRIVATE KEY-----" not in key:
              compact = "".join(key.split())
              try:
                  decoded = base64.b64decode(compact, validate=True).decode("utf-8")
                  decoded = decoded.replace("\\r", "\r").replace("\\n", "\n").replace("\r", "").strip()
                  if decoded.startswith("-----BEGIN ") and "PRIVATE KEY-----" in decoded:
                      key = decoded
              except (binascii.Error, UnicodeDecodeError, ValueError):
                  pass
          if not key.startswith("-----BEGIN ") or "PRIVATE KEY-----" not in key:
              raise SystemExit('Unsupported VPS_SSH_KEY format; secret value was not printed. Safe diagnostics: chars=%d lines=%d pem_header=%s public_key_header=%s putty_header=%s env_assignment=%s' % (len(raw), len(raw.splitlines()), str(raw.startswith("-----BEGIN ")), str(raw.startswith(("ssh-rsa ", "ssh-ed25519 ", "ecdsa-sha2-"))), str(raw.startswith("PuTTY-User-Key-File-")), str(raw.startswith("VPS_SSH_KEY="))))
          with open("/tmp/vps_key", "w", encoding="utf-8") as f:
              f.write(key + "\n")
          PY
          chmod 600 /tmp/vps_key
          ssh-keygen -y -P "" -f /tmp/vps_key >/dev/null
          ssh_opts=(-i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15)
          echo '=== DIAGNOSTIC TIMESTAMP ==='
          date -Is
          echo '=== SERVICE STATUS ==='
          ssh "${ssh_opts[@]}" "root@$VPS_HOST" "systemctl --no-pager --full status my-ai-unified || true"
          echo '=== SERVICE JOURNAL ==='
          ssh "${ssh_opts[@]}" "root@$VPS_HOST" "journalctl -u my-ai-unified --since '30 minutes ago' -n 250 --no-pager || true"
          echo '=== WATCHDOG JOURNAL ==='
          ssh "${ssh_opts[@]}" "root@$VPS_HOST" "journalctl -u my-ai-unified-supervisor --since '30 minutes ago' -n 150 --no-pager || true"
          echo '=== WATCHDOG LOG ==='
          ssh "${ssh_opts[@]}" "root@$VPS_HOST" "tail -n 120 /root/my-ai-unified/data/supervisor/daemon.log 2>/dev/null || true"
          echo '=== OOM ==='
          ssh "${ssh_opts[@]}" "root@$VPS_HOST" "dmesg -T 2>/dev/null | grep -Ei 'out of memory|oom|killed process|my-ai-unified' | tail -n 80 || true"
          rm -f /tmp/vps_key
      - name: Run repeated hands-free wake test
        timeout-minutes: 8
        run: |
          set -euo pipefail
          node -e "require('playwright')" >/dev/null 2>&1 || npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
          node wake-buffer-e2e.mjs

      - name: Run mobile UI E2E against canonical production
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node mobile-e2e.mjs

      - name: Verify production app root
        run: |
          set -euo pipefail
          curl -LfsS --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 'https://ai.aliceq.ru/?root-audit=1' -o /tmp/live-app.html
          grep -q 'EY_WAKE_WORD_V2_STATE_MACHINE' /tmp/live-app.html
          grep -q 'let rec=null' /tmp/live-app.html
          grep -q 'function processQueue()' /tmp/live-app.html
          grep -q 'MediaRecorder' /tmp/live-app.html
          grep -q 'navigator.geolocation' /tmp/live-app.html
          echo PRODUCTION_APP_ROOT_OK
      - name: Roll back VPS if any production verification fails
        if: ${{ failure() && steps.deploy_backend.outputs.backup_archive != '' && steps.deploy_backend.outputs.rolled_back != 'true' }}
        shell: bash
        env:
          BACKUP_ARCHIVE: ${{ steps.deploy_backend.outputs.backup_archive }}
        run: bash scripts/rollback-vps.sh

  pages:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish Pages
        run: |
          set -euo pipefail
          mkdir -p pages
          cp smart-index.html pages/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
