name: My AI Unified — production deploy v4 verified
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: my-ai-unified-production-smart
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          set -euo pipefail
          node --check local-gateway.js
          node --check memory-map.js
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('smart-index.html','utf8');
          const x=h.match(/<script>([\s\S]*?)<\/script>/i);
          if(!x) throw Error('smart frontend script missing');
          new Function(x[1]);
          for(const id of ['send','voice','photo','camera','video','file','imagegen','sound','stop','clear','camAnalyze','camShot','camOff']) if(!h.includes('id="'+id+'"')) throw Error('missing '+id);
          for(const s of ['MediaRecorder','/transcribe','.zip','getUserMedia']) if(!h.includes(s)) throw Error('missing capability '+s);
          console.log('SOURCE_OK');
          NODE
          node --test test-local-gateway.js
      - name: Deploy and verify VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=5 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          workdir=$(ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          test -n "$workdir"
          scp "${O[@]}" -q local-gateway.js "$VPS_USER@$VPS_HOST:$workdir/local-gateway.js"
          scp "${O[@]}" -q memory-map.js "$VPS_USER@$VPS_HOST:$workdir/memory-map.js"
          scp "${O[@]}" -q package.json "$VPS_USER@$VPS_HOST:$workdir/package.json"
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "WORKDIR='$workdir' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$WORKDIR"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('local-gateway.js'); s=p.read_text()
          s=s.replace("const GROQ_VISION_MODEL='meta-llama/llama-4-scout-17b-16e-instruct'","const GROQ_VISION_MODEL=process.env.GROQ_VISION_MODEL||'qwen/qwen3.6-27b'")
          s=s.replace("const GROQ_VISION_MODEL='qwen/qwen3.8-27b'","const GROQ_VISION_MODEL=process.env.GROQ_VISION_MODEL||'qwen/qwen3.6-27b'")
          s=s.replace("const GROQ_VISION_MODEL=process.env.GROQ_VISION_MODEL||'qwen/qwen3.6-27b'","const GROQ_VISION_MODEL=process.env.GROQ_VISION_MODEL||'qwen/qwen3.6-27b'",1)
          s=s.replace("const GROQ_TEXT_MODEL=process.env.GROQ_MODEL||'openai/gpt-oss-120b'","const GROQ_TEXT_MODEL=process.env.GROQ_MODEL||'openai/gpt-oss-120b'",1)
          p.write_text(s)
          env=Path('/root/my-ai-unified/.local-ai.env')
          if env.exists():
              e=env.read_text(); import re
              e=re.sub(r'^GROQ_VISION_MODEL=.*$', 'GROQ_VISION_MODEL=qwen/qwen3.6-27b', e, flags=re.M)
              if 'GROQ_VISION_MODEL=' not in e: e+='\nGROQ_VISION_MODEL=qwen/qwen3.6-27b\n'
              env.write_text(e)
          PY
          npm install --omit=dev --no-audit --no-fund
          node --check local-gateway.js
          node --check memory-map.js
          systemctl restart my-ai-unified
          for i in $(seq 1 30); do systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/h.json && break; sleep 1; done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          a=j.get('adapters',{}); assert all(a.get(k) for k in ['groq','groqVision','search','tts','stt','documents','video']),j
          print('LOCAL_HEALTH_OK')
          PY
          curl -fsS --max-time 90 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/c.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json')); assert j.get('ok') and j.get('result'),j; print('LOCAL_CHAT_OK')
          PY
          python3 - <<'PY'
          import base64,json
          png=base64.b64encode(bytes.fromhex('89504e470d0a1a0a0000000d4948445200000040000000400806000000aa6971de0000000d49444154789c6360a001000000ffff03000006000557bf9b0000000049454e44ae426082')).decode()
          open('/tmp/photo.json','w').write(json.dumps({'images':['data:image/png;base64,'+png],'prompt':'Опиши изображение одним коротким предложением.'},ensure_ascii=False))
          PY
          PHOTO_CODE=$(curl -sS --max-time 120 -o /tmp/photo.json.out -w '%{http_code}' -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data-binary @/tmp/photo.json)
          cat /tmp/photo.json.out
          test "$PHOTO_CODE" = 200
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo.json.out')); assert j.get('ok') and j.get('result'),j; print('LOCAL_PHOTO_OK',j.get('provider'),j.get('model'))
          PY
          curl -fsS --max-time 40 -X POST http://127.0.0.1:3020/tts -H 'Content-Type: application/json' --data '{"text":"Проверка голоса."}' -o /tmp/tts.mp3
          test -s /tmp/tts.mp3; echo LOCAL_TTS_OK
          curl -fsS --max-time 30 -X POST http://127.0.0.1:3020/search -H 'Content-Type: application/json' --data '{"query":"iPhone 18 Pro Москва цена"}' >/tmp/search.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/search.json')); assert j.get('ok') and j.get('results'),j; print('LOCAL_SEARCH_OK')
          PY
          curl -fsS --max-time 120 -X POST http://127.0.0.1:3020/shopping -H 'Content-Type: application/json' --data '{"query":"Найди iPhone 18 Pro в Москве"}' >/tmp/shop.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/shop.json')); assert j.get('ok') and j.get('results'),j; print('LOCAL_SHOPPING_OK',len(j['results']))
          PY
          curl -fsS --max-time 90 -X POST http://127.0.0.1:3020/document -H 'Content-Type: application/json' --data '{"name":"smoke.txt","mime":"text/plain","text":"Это тестовый документ. Ответь одним словом: ДОК_OK"}' >/tmp/doc.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/doc.json')); assert j.get('ok') and j.get('result'),j; print('LOCAL_DOCUMENT_OK')
          PY
          curl -fsS --max-time 30 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"memoryId":"final-smoke","prompt":"Эй, запомни правило: smoke-memory-OK"}' >/tmp/m.json
          curl -fsS --max-time 30 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"memoryId":"final-smoke","prompt":"Эй, что ты обо мне запомнил?"}' >/tmp/m2.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/m.json')); b=json.load(open('/tmp/m2.json')); assert a.get('ok') and b.get('ok') and 'smoke-memory-OK' in b.get('result',''),(a,b); print('LOCAL_MEMORY_OK')
          PY
          REMOTE
      - name: Verify public API
        run: |
          set -euo pipefail
          sleep 10
          API=https://ai.aliceq.ru
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 90 "$API/health" >/tmp/h.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          a=j.get('adapters',{}); assert all(a.get(k) for k in ['groq','groqVision','search','tts','stt','documents','video']),j; print('PUBLIC_HEALTH_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 -X POST "$API/chat" -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/c.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json')); assert j.get('ok') and j.get('result'),j; print('PUBLIC_CHAT_OK')
          PY
          python3 - <<'PY'
          import base64,json
          png=base64.b64encode(bytes.fromhex('89504e470d0a1a0a0000000d4948445200000040000000400806000000aa6971de0000000d49444154789c6360a001000000ffff03000006000557bf9b0000000049454e44ae426082')).decode()
          open('/tmp/photo.json','w').write(json.dumps({'images':['data:image/png;base64,'+png],'prompt':'Опиши изображение одним коротким предложением.'},ensure_ascii=False))
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 150 -X POST "$API/photo" -H 'Content-Type: application/json' --data-binary @/tmp/photo.json >/tmp/p.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/p.json')); assert j.get('ok') and j.get('result'),j; print('PUBLIC_PHOTO_OK',j.get('provider'),j.get('model'))
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$API/tts" -H 'Content-Type: application/json' --data '{"text":"Проверка голоса."}' -o /tmp/t.mp3
          test -s /tmp/t.mp3; echo PUBLIC_TTS_OK
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$API/search" -H 'Content-Type: application/json' --data '{"query":"iPhone 18 Pro Москва цена"}' >/tmp/s.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/s.json')); assert j.get('ok') and j.get('results'),j; print('PUBLIC_SEARCH_OK')
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 120 -X POST "$API/shopping" -H 'Content-Type: application/json' --data '{"query":"Найди iPhone 18 Pro в Москве"}' >/tmp/shop.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/shop.json')); assert j.get('ok') and j.get('results'),j; print('PUBLIC_SHOPPING_OK',len(j['results']))
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 90 -X POST "$API/document" -H 'Content-Type: application/json' --data '{"name":"smoke.txt","mime":"text/plain","text":"Это тестовый документ. Ответь одним словом: ДОК_OK"}' >/tmp/d.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/d.json')); assert j.get('ok') and j.get('result'),j; print('PUBLIC_DOCUMENT_OK')
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 -X POST "$API/chat" -H 'Content-Type: application/json' --data '{"memoryId":"public-final-smoke","prompt":"Эй, запомни правило: public-memory-OK"}' >/tmp/m.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 -X POST "$API/chat" -H 'Content-Type: application/json' --data '{"memoryId":"public-final-smoke","prompt":"Эй, что ты обо мне запомнил?"}' >/tmp/m2.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/m.json')); b=json.load(open('/tmp/m2.json')); assert a.get('ok') and b.get('ok') and 'public-memory-OK' in b.get('result',''),(a,b); print('PUBLIC_MEMORY_OK')
          PY
      - name: Publish smart Pages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('smart-index.html'); x=p.read_text()
          if 'my-ai-memory-id-v1' not in x:
              x=x.replace("const API='https://ai.aliceq.ru'", "const API='https://ai.aliceq.ru',MEMORY_KEY='my-ai-memory-id-v1',MEMORY_ID=localStorage.getItem(MEMORY_KEY)||(crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2)));localStorage.setItem(MEMORY_KEY,MEMORY_ID)",1)
          if 'memoryId:MEMORY_ID' not in x:
              x=x.replace("api('/chat',{prompt:t,messages}","api('/chat',{prompt:t,messages,memoryId:MEMORY_ID}",1)
          p.write_text(x)
          PY
          rm -rf pages && mkdir pages
          cp smart-index.html pages/index.html
          printf '%s\n' '{"ok":true,"api":"https://ai.aliceq.ru","version":"verified-2026-09-15"}' > pages/api.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
