name: My AI Unified — production deploy
# production root audit is mandatory before downstream mobile and deep-audit checks
# verified redeploy trigger for deterministic time/location and final vision fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: my-ai-unified-production
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          set -euo pipefail
          node --check local-gateway.js
          node --check memory-map.js
          node --check image-generation-fallback.js
          node --check vision-runtime-hotfix.js
          node --check supervisor-daemon.js
          node --check autonomy-lab/autonomy-orchestrator.mjs
          node --check autonomy-lab/project-adapter.mjs
          node --check autonomy-lab/project-task-bridge.mjs
          node --check autonomy-lab/merge-readiness-gate.mjs
          node --check autonomy-lab/release-controller.mjs
          node --check autonomy-lab/runtime.mjs
          node --test test-local-gateway.js
          grep -q 'EY_WAKE_WORD_V1' smart-index.html
          grep -q 'wakeQueue' smart-index.html
          grep -q 'function pump()' smart-index.html
          grep -q 'MediaRecorder' smart-index.html
          grep -q 'memoryId' smart-index.html
          grep -q 'window.send=send' smart-index.html
          grep -q 'navigator.geolocation' smart-index.html
          grep -q '/generate-image' smart-index.html
      - name: Deploy backend to VPS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"; test -n "$VPS_USER"; test -n "$VPS_SSH_KEY"
          printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key; chmod 600 /tmp/vps_key
          ssh_opts=(-i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          WORKDIR=$(ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          [ -n "$WORKDIR" ] || WORKDIR=/root/my-ai-unified
          scp "${ssh_opts[@]}" local-gateway.js smart-index.html memory-map.js image-generation-fallback.js vision-runtime-hotfix.js supervisor-daemon.js package.json "$VPS_USER@$VPS_HOST:$WORKDIR/"
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "mkdir -p '$WORKDIR/autonomy-lab'"
          scp "${ssh_opts[@]}" autonomy-lab/*.mjs autonomy-lab/package.json "$VPS_USER@$VPS_HOST:$WORKDIR/autonomy-lab/"
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "set -e; if ! swapon --show --noheadings | grep -q .; then if [ ! -f /swapfile ]; then sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048; sudo chmod 600 /swapfile; sudo mkswap /swapfile; fi; sudo swapon /swapfile; fi; grep -q '^/swapfile ' /etc/fstab 2>/dev/null || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null; cd '$WORKDIR' && npm install --omit=dev --no-audit --no-fund && node --check local-gateway.js && node --check memory-map.js && node --check image-generation-fallback.js && node --check vision-runtime-hotfix.js && node --check supervisor-daemon.js && node image-generation-fallback.js local-gateway.js && node vision-runtime-hotfix.js local-gateway.js && node --check local-gateway.js && systemctl restart my-ai-unified && sudo systemctl set-property my-ai-unified.service MemoryMax=768M MemoryHigh=640M || true && sudo systemctl set-property my-ai-unified-supervisor.service MemoryMax=128M MemoryHigh=96M || true && printf '%s\n' '[Unit]' 'Description=My AI Unified safe self-healing watchdog' 'After=network-online.target my-ai-unified.service' 'Wants=network-online.target' '' '[Service]' 'Type=simple' 'User=$VPS_USER' 'WorkingDirectory=$WORKDIR' 'ExecStart=/usr/bin/node $WORKDIR/supervisor-daemon.js' 'Restart=always' 'RestartSec=5' 'PrivateTmp=true' '' '[Install]' 'WantedBy=multi-user.target' >/tmp/my-ai-unified-supervisor.service && sudo install -m 644 /tmp/my-ai-unified-supervisor.service /etc/systemd/system/my-ai-unified-supervisor.service && printf '%s\\n' '${VPS_USER} ALL=(root) NOPASSWD: /usr/bin/systemctl restart my-ai-unified.service' >/tmp/my-ai-unified-supervisor.sudoers && sudo install -m 440 /tmp/my-ai-unified-supervisor.sudoers /etc/sudoers.d/my-ai-unified-supervisor && sudo systemctl daemon-reload && sudo systemctl enable --now my-ai-unified-supervisor.service && systemctl is-active --quiet my-ai-unified-supervisor.service"
          healthy=0
          for i in $(seq 1 30); do
            if ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "curl -fsS http://127.0.0.1:3020/health >/tmp/my-ai-health.json"; then healthy=1; break; fi
            sleep 1
          done
          test "$healthy" = 1
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "cat /tmp/my-ai-health.json"
          rm -f /tmp/vps_key
      - name: Diagnose HTTPS ingress without changing Xray
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "bash -s" <<'REMOTE'
          set -euo pipefail
          echo "=== 443 OWNER ==="
          sudo ss -ltnp | grep -E ':443\b' || true
          echo "=== XRAY SERVICE ==="
          sudo systemctl --no-pager --full status xray 2>/dev/null | head -n 35 || true
          echo "=== XRAY CONFIG LOCATIONS ==="
          sudo find /etc /usr/local/etc -maxdepth 3 -type f \( -name 'config.json' -o -name '*.json' \) 2>/dev/null | grep -i xray | head -n 30 || true
          for f in /usr/local/etc/xray/config.json /etc/xray/config.json; do
            if [ -f "$f" ]; then
              echo "=== XRAY SAFE CONFIG: $f ==="
              sudo jq 'del(.. | .privateKey?, .password?, .id?, .keys?) | {inbounds:(.inbounds//[]|map({port,protocol,streamSettings,settings})),outbounds:(.outbounds//[]|map({protocol,settings}))}' "$f" 2>/dev/null | head -n 260 || sudo sed -n '1,260p' "$f" | sed -E 's/(privateKey|password|id|email|secret)\s*[:=]\s*"[^"]*"/\1:"REDACTED"/g'
            fi
          done
          echo "=== CLOUDFLARED SERVICES ==="
          sudo systemctl list-units --type=service --all --no-legend | grep -i cloudflared || true
          echo "=== CLOUDFLARED UNIT ==="
          sudo systemctl cat cloudflared.service 2>/dev/null | sed -E 's/(token=|token:|credentials-file=|credentials-file:).*/REDACTED/' | head -n 120 || true
          sudo systemctl show cloudflared.service -p ExecStart -p Environment --no-pager 2>/dev/null | sed -E 's/(token=|token:|credentials-file=|credentials-file:).*/REDACTED/' || true
          echo "=== CLOUDFLARED FILES ==="
          sudo find /etc/cloudflared /root/.cloudflared /home -maxdepth 3 -type f 2>/dev/null | head -n 80 || true
          for f in /etc/cloudflared/config.yml /etc/cloudflared/config.yaml /root/.cloudflared/config.yml /root/.cloudflared/config.yaml; do
            if [ -f "$f" ]; then
              echo "=== CLOUDFLARED CONFIG: $f ==="
              sudo sed -E 's/(token:|tunnel:|credentials-file:).*/\1 REDACTED/' "$f" | head -n 180
            fi
          done
          REMOTE
          rm -f /tmp/vps_key
      - name: Diagnose VPS DNS versus Cloudflare path
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "bash -s" <<'REMOTE'
          set -euo pipefail
          echo "=== VPS DNS FOR APP ==="
          getent ahosts ai.aliceq.ru || true
          echo "=== VPS DNS CONFIG ==="
          resolvectl status 2>/dev/null | head -n 80 || cat /etc/resolv.conf
          echo "=== XRAY DNS/ROUTING ==="
          jq '{dns:(.dns//{}),routing:(.routing//{}),inbounds:(.inbounds//[]|map({port,protocol,streamSettings,settings})),outbounds:(.outbounds//[]|map({protocol,tag,settings}))}' /etc/xray/config.json 2>/dev/null | head -n 500 || true
          echo "=== VPS HTTPS BY CLOUDFLARE IP ==="
          for ip in 172.67.208.169 104.21.93.102; do
            echo "IP=$ip"
            curl -skS --connect-timeout 5 --max-time 15 --resolve ai.aliceq.ru:443:$ip -D - -o /dev/null https://ai.aliceq.ru/ | head -n 20 || true
          done
          REMOTE
          rm -f /tmp/vps_key
      - name: Verify public DNS and TLS path
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PUBLIC DNS ==="
          getent ahostsv4 ai.aliceq.ru || true
          getent ahosts ai.aliceq.ru || true
          echo "=== TLS CERTIFICATE ==="
          echo | openssl s_client -connect ai.aliceq.ru:443 -servername ai.aliceq.ru -verify_return_error 2>/tmp/tls.err | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          echo "=== TLS ERRORS ==="
          cat /tmp/tls.err || true
          echo "=== HTTPS HEADERS ==="
          curl -Iv --max-time 20 https://ai.aliceq.ru/ 2>&1 | tail -n 30
      - name: Verify complete public production
        shell: bash
        run: |
          set -euo pipefail
          acceptance_ok=0
          for attempt in 1 2 3; do
            if node production-acceptance.mjs; then acceptance_ok=1; break; fi
            if [ "$attempt" = 1 ]; then
              echo 'VISION_PROVIDER_COOLDOWN_WAIT_30S'
              sleep 30
            fi
          done
          if [ "$acceptance_ok" != 1 ]; then
            printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key; chmod 600 /tmp/vps_key
                        echo '=== VPS PHOTO DIAGNOSTIC ==='
            ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "curl -sS -D /tmp/photo.diag.headers -o /tmp/photo.diag.out -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data-binary '{\"images\":[\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYElEQVR4nO3PQQ0AIBDAMMC/50MEj4ZkVbDtmVk/OzrgVQNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgPaBXKqA31N0fbGAAAAAElFTkSuQmCC\"],\"prompt\":\"Опиши изображение.\"}'; cat /tmp/photo.diag.headers; cat /tmp/photo.diag.out; echo '=== SERVICE ==='; systemctl --no-pager --full status my-ai-unified || true; echo '=== JOURNAL ==='; journalctl -u my-ai-unified -n 120 --no-pager || true"
            rm -f /tmp/vps_key
            exit 1
          fi
          status=$(curl -fsS --max-time 20 https://ai.aliceq.ru/autonomy/status)
          echo "$status"
          echo "$status" | grep -q 'FULL_BOUNDED'
          self=$(curl -fsS --max-time 30 -X POST -H 'Content-Type: application/json' -d '{}' https://ai.aliceq.ru/autonomy/self-check)
          echo "$self"
          echo "$self" | grep -q '"ok":true'
          task=$(curl -fsS --max-time 30 -X POST -H 'Content-Type: application/json' -d '{"kind":"self-check","goal":"Публичная проверка лабораторного контура"}' https://ai.aliceq.ru/autonomy/task)
          echo "$task"
          echo "$task" | grep -q '"ok":true'
          for payload in \
            '{"kind":"chat","goal":"Лабораторный smoke-тест чата","input":{"prompt":"Кто ты?"}}' \
            '{"kind":"search","goal":"Лабораторный smoke-тест поиска","input":{"query":"OpenAI"}}' \
            '{"kind":"vision","goal":"Лабораторный smoke-тест зрения","input":{"prompt":"Опиши тестовое изображение","images":["https://docs.mistral.ai/img/eiffel-tower-paris.jpg"]}}'; do
            lab=""
            ok=0
            for attempt in 1 2 3 4 5; do
              if lab=$(curl -fsS --retry 2 --retry-all-errors --retry-delay 2 --max-time 60 -X POST -H 'Content-Type: application/json' -d "$payload" https://ai.aliceq.ru/autonomy/task); then
                if echo "$lab" | grep -q '"ok":true' && echo "$lab" | grep -q '"status":"ACCEPTED"'; then ok=1; break; fi
              fi
              echo "LAB_RETRY attempt=$attempt" >&2
              sleep 2
            done
            test "$ok" = 1
            echo "$lab"
          done
          echo LAB_CONTOUR_PUBLIC_SMOKE_OK
          echo COMPLETE_PUBLIC_PRODUCTION_OK
      - name: Run 100-case production acceptance
        timeout-minutes: 30
        run: |
          set -euo pipefail
          node acceptance-100.mjs

      - name: Diagnose backend after acceptance failure
        if: failure()
        shell: bash
        run: |
          set +e
          printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key; chmod 600 /tmp/vps_key
                    echo '=== SERVICE STATUS ==='
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "systemctl --no-pager --full status my-ai-unified || true"
          echo '=== SERVICE JOURNAL ==='
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "journalctl -u my-ai-unified --since '2026-09-27 14:59:00' --until '2026-09-27 15:02:00' --no-pager || true"
          echo '=== WATCHDOG JOURNAL ==='
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "journalctl -u my-ai-unified-supervisor --since '2026-09-27 14:59:00' --until '2026-09-27 15:02:00' --no-pager || true"
          echo '=== WATCHDOG LOG ==='
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "tail -n 120 /root/my-ai-unified/data/supervisor/daemon.log 2>/dev/null || true"
          echo '=== OOM ==='
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "dmesg -T 2>/dev/null | grep -Ei 'out of memory|oom|killed process|my-ai-unified' | tail -n 80 || true"
          rm -f /tmp/vps_key
      - name: Run repeated hands-free wake test
        timeout-minutes: 8
        run: |
          set -euo pipefail
          node -e "require('playwright')" >/dev/null 2>&1 || npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
          node wake-buffer-e2e.mjs

      - name: Verify production app root
        run: |
          set -euo pipefail
          curl -LfsS --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 'https://ai.aliceq.ru/?root-audit=1' -o /tmp/live-app.html
          grep -q 'EY_WAKE_WORD_V1' /tmp/live-app.html
          grep -q 'wakeQueue' /tmp/live-app.html
          grep -q 'function pump()' /tmp/live-app.html
          grep -q 'MediaRecorder' /tmp/live-app.html
          grep -q 'navigator.geolocation' /tmp/live-app.html
          echo PRODUCTION_APP_ROOT_OK

  pages:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish Pages
        run: |
          set -euo pipefail
          mkdir -p pages
          cp smart-index.html pages/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

# HTTPS diagnostic trigger: verify VPS DNS/Xray path without changing VPN
