name: My AI Unified — production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          set -euo pipefail
          node --check local-gateway.js
          node --check memory-map.js
          node --check image-generation-fallback.js
          node --check vision-runtime-hotfix.js
          node --check supervisor-daemon.js
          node --test test-local-gateway.js
          grep -q 'EY_WAKE_WORD_V1' smart-index.html
          grep -q 'MediaRecorder' smart-index.html
          grep -q 'memoryId' smart-index.html
          grep -q 'window.send=send' smart-index.html
          grep -q 'navigator.geolocation' smart-index.html
          grep -q '/generate-image' smart-index.html
      - name: Deploy backend to VPS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"; test -n "$VPS_USER"; test -n "$VPS_SSH_KEY"
          printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key; chmod 600 /tmp/vps_key
          ssh_opts=(-i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          WORKDIR=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          [ -n "$WORKDIR" ] || WORKDIR=/root/my-ai-unified
          scp "${ssh_opts[@]}" local-gateway.js memory-map.js image-generation-fallback.js vision-runtime-hotfix.js supervisor-daemon.js package.json "$VPS_USER@$VPS_HOST:$WORKDIR/"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "cd '$WORKDIR' && npm install --omit=dev --no-audit --no-fund && node --check local-gateway.js && node --check memory-map.js && node --check image-generation-fallback.js && node --check vision-runtime-hotfix.js && node --check supervisor-daemon.js && node image-generation-fallback.js local-gateway.js && node vision-runtime-hotfix.js local-gateway.js && node --check local-gateway.js && systemctl restart my-ai-unified && printf '%s\n' '[Unit]' 'Description=My AI Unified safe self-healing watchdog' 'After=network-online.target my-ai-unified.service' 'Wants=network-online.target' '' '[Service]' 'Type=simple' 'User=$VPS_USER' 'WorkingDirectory=$WORKDIR' 'ExecStart=/usr/bin/node $WORKDIR/supervisor-daemon.js' 'Restart=always' 'RestartSec=5' 'NoNewPrivileges=true' 'PrivateTmp=true' '' '[Install]' 'WantedBy=multi-user.target' >/tmp/my-ai-unified-supervisor.service && sudo install -m 644 /tmp/my-ai-unified-supervisor.service /etc/systemd/system/my-ai-unified-supervisor.service && printf '%s\n' "$VPS_USER ALL=(root) NOPASSWD: /usr/bin/systemctl restart my-ai-unified.service" >/tmp/my-ai-unified-supervisor.sudoers && sudo install -m 440 /tmp/my-ai-unified-supervisor.sudoers /etc/sudoers.d/my-ai-unified-supervisor && sudo systemctl daemon-reload && sudo systemctl enable --now my-ai-unified-supervisor.service && systemctl is-active --quiet my-ai-unified-supervisor.service"
          healthy=0
          for i in $(seq 1 30); do
            if ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "curl -fsS http://127.0.0.1:3020/health >/tmp/my-ai-health.json"; then healthy=1; break; fi
            sleep 1
          done
          test "$healthy" = 1
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "cat /tmp/my-ai-health.json"
          rm -f /tmp/vps_key
      - name: Verify complete public production
        shell: bash
        run: |
          set -euo pipefail
          node production-acceptance.mjs
          echo COMPLETE_PUBLIC_PRODUCTION_OK

  pages:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish Pages
        run: |
          set -euo pipefail
          mkdir -p pages
          cp smart-index.html pages/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
