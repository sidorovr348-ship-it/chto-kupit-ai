name: My AI Unified — final 100x verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 100x health and chat
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            curl --fail --silent --show-error --max-time 20 https://ai.aliceq.ru/health > /tmp/h.json
            python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          PY
            curl --fail --silent --show-error --max-time 45 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' > /tmp/c.json
            python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json')); assert j.get('ok') and str(j.get('result','')).strip(),j
          PY
            echo "ROUND $i OK"
          done
      - name: 20x photo
        env:
          IMAGE_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          open('/tmp/p.json','w').write(json.dumps({'images':['data:image/png;base64,'+os.environ['IMAGE_B64']],'prompt':'Что изображено? Ответь кратко по-русски.'},ensure_ascii=False))
          PY
          for i in $(seq 1 20); do
            curl --fail --silent --show-error --max-time 120 -X POST https://ai.aliceq.ru/photo -H 'Content-Type: application/json' --data-binary @/tmp/p.json > /tmp/pout.json
            python3 - <<'PY'
          import json
          j=json.load(open('/tmp/pout.json')); assert j.get('ok') and str(j.get('result','')).strip(),j
          PY
            echo "PHOTO $i OK"
          done
      - name: 20x TTS
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            curl --fail --silent --show-error --max-time 60 -X POST https://ai.aliceq.ru/tts -H 'Content-Type: application/json' --data '{"text":"Проверка голоса."}' -o /tmp/t.mp3
            test -s /tmp/t.mp3
            echo "TTS $i OK"
          done
      - name: Final result
        run: echo 'FINAL_100X_VERIFICATION_OK'
