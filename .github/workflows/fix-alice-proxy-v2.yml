name: My AI Unified — harden Alice proxy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Harden Alice dispatcher proxy with retries
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cat > /root/alice-ai/server.js <<'NODE'
          // MY_AI_UNIFIED_ALICE_PROXY_V2
          const express=require('express');
          const app=express();
          const PORT=Number(process.env.PORT||3011);
          app.use(express.json({limit:'10mb'}));
          app.get('/health',(_q,res)=>res.json({ok:true,service:'alice-ai',unified:true,dispatcher:'127.0.0.1:3020'}));
          async function dispatch(body){
            let last=null;
            for(let i=0;i<5;i++){
              try{
                const r=await fetch('http://127.0.0.1:3020/alice',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify(body)});
                const text=await r.text();
                if(r.ok)return {status:r.status,text};
                last=new Error('dispatcher HTTP '+r.status);
              }catch(e){last=e;}
              await new Promise(x=>setTimeout(x,700*(i+1)));
            }
            throw last||new Error('dispatcher unavailable');
          }
          app.post('/alice',async(req,res)=>{try{const r=await dispatch(req.body);res.status(r.status).type('application/json').send(r.text)}catch(e){res.status(502).json({ok:false,error:'Alice dispatcher unavailable'})}});
          app.listen(PORT,'127.0.0.1',()=>console.log('Alice unified proxy V2 listening on 127.0.0.1:'+PORT));
          NODE
          systemctl restart alice-ai
          sleep 2
          systemctl is-active --quiet alice-ai
          for i in $(seq 1 5); do
            if curl --fail --silent --show-error --max-time 40 -X POST http://127.0.0.1:3011/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: АЛИСА_V2_OK"},"session":{"session_id":"alice-v2"}}' >/tmp/a.json; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/a.json')); assert j.get('response',{}).get('text'),j
          print('LOCAL_ALICE_V2_OK')
          PY
          REMOTE
      - name: Verify public Alice
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 120 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: ПУБЛИЧНАЯ_АЛИСА_V2_OK"},"session":{"session_id":"alice-public-v2"}}' >/tmp/a.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/a.json')); assert j.get('response',{}).get('text'),j
          print('PUBLIC_ALICE_V2_OK')
          PY
