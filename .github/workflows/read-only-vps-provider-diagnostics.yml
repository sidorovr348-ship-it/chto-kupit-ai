name: Read-only VPS provider diagnostics

on:
  push:
    branches:
      - diagnose/provider-journal-2026-11-08

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read provider and local fallback diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-vps-key.py
          chmod 600 /tmp/vps_key
          trap 'rm -f /tmp/vps_key /tmp/vps_key.pub' EXIT
          ssh-keygen -y -P "" -f /tmp/vps_key > /tmp/vps_key.pub
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== CLOCK AND LOAD ==='
          date -Is
          uptime
          free -h
          df -h /
          df -Pi /
          echo '=== SERVICE ==='
          systemctl show my-ai-unified.service -p ActiveState -p SubState -p MainPID -p ExecMainStartTimestamp -p NRestarts
          echo '=== LOCAL HEALTH ==='
          curl --max-time 8 -sS http://127.0.0.1:3020/health
          echo
          echo '=== LOCAL AI HEALTH ==='
          curl --max-time 8 -sS http://127.0.0.1:3020/local-ai/health
          echo
          echo '=== LIVE GATEWAY FALLBACK SOURCE ==='
          python3 -c 'from pathlib import Path; s=Path("/root/my-ai-unified/local-gateway.js").read_text(errors="replace"); m="max_completion_tokens"; i=s.find(m); print("SOURCE_TOKEN_BUDGET",s[max(0,i-450):i+1000] if i>=0 else "NOT_FOUND")'
          python3 -c 'from pathlib import Path; s=Path("/root/my-ai-unified/local-gateway.js").read_text(errors="replace"); m="callOllama"; i=s.find(m); print("SOURCE_OLLAMA_FALLBACK",s[max(0,i-500):i+1400] if i>=0 else "NOT_FOUND")'
          echo '=== OLLAMA MODEL STATE ==='
          timeout 5 ollama ps 2>&1
          timeout 5 ollama list 2>&1
          du -sh /root/.ollama/models /usr/share/ollama/.ollama/models /var/lib/ollama/models 2>&1
          ps -eo pid,rss,etime,comm,args | grep -E '[o]llama|[m]y-ai-unified' | head -n 30
          echo '=== LIVE FALLBACK CALL SITE ==='
          python3 -c 'from pathlib import Path; s=Path("/root/my-ai-unified/local-gateway.js").read_text(errors="replace"); m="callOllama(messages"; i=s.find(m); print(s[max(0,i-700):i+1800] if i>=0 else "NOT_FOUND")'
          python3 -c 'from pathlib import Path; s=Path("/root/my-ai-unified/local-gateway.js").read_text(errors="replace"); m="const textTimeout="; i=s.find(m); print(s[max(0,i-500):i+4000] if i>=0 else "NOT_FOUND")'
          echo '=== NON-SECRET OPTIONAL PROVIDER SETTINGS ==='
          python3 -c 'from pathlib import Path; keys={"FREELM_ENABLED","FREELM_MODEL","FREELM_BASE_URL","OLLAMA_TIMEOUT_MS","TTS_VOICE"}; paths=[Path("/root/my-ai-unified/.local-ai.env"),Path("/root/chto-kupit-ai.env")]; [(print(str(p),k,v)) for p in paths if p.exists() for line in p.read_text(errors="replace").splitlines() if "=" in line for k,v in [line.split("=",1)] if k in keys]'
          python3 -c 'from pathlib import Path; paths=[Path("/root/my-ai-unified/.local-ai.env"),Path("/root/chto-kupit-ai.env")]; keys={"FREELM_API_KEY","CLOUDRU_AGENT_TOKEN","HF_TOKEN"}; [(print(str(p),k,"configured",bool(v.strip()))) for p in paths if p.exists() for line in p.read_text(errors="replace").splitlines() if "=" in line for k,v in [line.split("=",1)] if k in keys]'
          echo '=== OPTIONAL FREE LLM LOCAL ENDPOINT ==='
          curl --max-time 3 -sS http://127.0.0.1:4000/v1/models 2>&1 | head -c 1500
          echo
          echo '=== CLOUDRU AGENT REFERENCES IN LIVE JS ==='
          grep -R -n --include='*.js' --exclude='cloudru-agent.js' --exclude-dir=node_modules --exclude='*.log' 'cloudru-agent' /root/my-ai-unified 2>/dev/null | head -n 40
          echo '=== PROVIDER JOURNAL LAST 15 MINUTES ==='
          journalctl -u my-ai-unified.service --since '15 minutes ago' --no-pager 2>&1 | grep -E 'AI_PROVIDER|GROQ|OLLAMA|CHAT_REQUEST|ZVENOAI|FALLBACK|deadline|timeout|429|401|502' | tail -n 240
          echo '=== SYSTEM JOURNAL LAST 15 MINUTES ==='
          journalctl -k --since '15 minutes ago' --no-pager 2>&1 | tail -n 80
          REMOTE
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$VPS_HOST" "cd /root/my-ai-unified && tar -czf - local-gateway.js smart-index.html memory-map.js image-generation-fallback.js vision-runtime-hotfix.js supervisor-daemon.js package.json package-lock.json src autonomy-lab" > /tmp/live-source.tar.gz
          mkdir -p /tmp/live-source
          tar -xzf /tmp/live-source.tar.gz -C /tmp/live-source
          echo '=== LIVE SOURCE DRIFT ==='
          diff -qr --exclude=node_modules . /tmp/live-source | head -n 100 || true
          echo '=== LIVE SOURCE FILE HASHES ==='
          (cd /tmp/live-source && find . -type f -not -path '*/node_modules/*' -print0 | sort -z | xargs -0 sha256sum) | head -n 100
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$VPS_HOST" "cat /root/my-ai-unified/local-gateway.js" > /tmp/live-local-gateway.js
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$VPS_HOST" "cat /root/my-ai-unified/src/local-ai.js" > /tmp/live-local-ai.js
          python3 -c 'from pathlib import Path; import hashlib; a=Path("local-gateway.js").read_text(errors="replace"); b=Path("/tmp/live-local-gateway.js").read_text(errors="replace"); print("LOCAL_GATEWAY_SHA_REPO",hashlib.sha256(a.encode()).hexdigest(),"LIVE",hashlib.sha256(b.encode()).hexdigest()); markers=["max_completion_tokens","AI_PROVIDER_OK","freelmEnabled","const textTimeout=","callOllama(messages","provider(url,key"]; [(print("MARKER",m,"REPO",a[max(0,a.find(m)-220):a.find(m)+750],"LIVE",b[max(0,b.find(m)-220):b.find(m)+750])) for m in markers]'
          python3 -c 'from pathlib import Path; import hashlib; a=Path("src/local-ai.js").read_text(errors="replace"); b=Path("/tmp/live-local-ai.js").read_text(errors="replace"); print("LOCAL_AI_SHA_REPO",hashlib.sha256(a.encode()).hexdigest(),"LIVE",hashlib.sha256(b.encode()).hexdigest()); markers=["async function callOllama","async function health","keep_alive","num_predict"]; [(print("MARKER",m,"REPO",a[max(0,a.find(m)-150):a.find(m)+650],"LIVE",b[max(0,b.find(m)-150):b.find(m)+650])) for m in markers]'
