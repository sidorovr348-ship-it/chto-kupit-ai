name: My AI Unified — provider fallback hardening

on:
  push:
    branches: [main]
    paths:
      - 'local-gateway.js'
      - '.github/workflows/provider-fallback-hardening.yml'
      - '.deploy-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add provider fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('local-gateway.js'); s=p.read_text()
          old="async function ask(messages,vision=false){const errors=[],groq=keyOf('GROQ_API_KEY');if(groq)try{return{text:await provider('https://api.groq.com/openai/v1/chat/completions',groq,vision?GROQ_VISION_MODEL:GROQ_TEXT_MODEL,messages,vision?60000:30000,vision),provider:'groq',model:vision?GROQ_VISION_MODEL:GROQ_TEXT_MODEL}}catch(e){errors.push(`Groq: ${e.message}`);console.error('GROQ_ERROR',e.message)}"
          new="async function ask(messages,vision=false){const errors=[],groq=keyOf('GROQ_API_KEY');if(groq){const models=vision?[GROQ_VISION_MODEL]:[GROQ_TEXT_MODEL,'llama-3.3-70b-versatile'];for(const model of models)try{return{text:await provider('https://api.groq.com/openai/v1/chat/completions',groq,model,messages,vision?60000:30000,vision),provider:'groq',model}}catch(e){errors.push(`Groq ${model}: ${e.message}`);console.error('GROQ_ERROR',model,e.message)}}"
          if old not in s: raise SystemExit('Groq provider block not found')
          s=s.replace(old,new,1)
          marker='// PROVIDER_FALLBACK_HARDENING_V1'
          if marker not in s: s+='\n'+marker+'\n'
          p.write_text(s)
          PY
          node --check local-gateway.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-gateway.js
          git diff --cached --quiet || git commit -m 'Add resilient Groq text fallback'
          git push
