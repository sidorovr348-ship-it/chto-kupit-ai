name: My AI Unified — provider fallback hardening

on:
  push:
    branches: [main]
    paths:
      - 'local-gateway.js'
      - '.github/workflows/provider-fallback-hardening.yml'
      - '.deploy-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add provider fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('local-gateway.js'); s=p.read_text()
          old="const models=vision?[GROQ_VISION_MODEL]:[GROQ_TEXT_MODEL,'llama-3.3-70b-versatile'];"
          new="const models=vision?[GROQ_VISION_MODEL]:[GROQ_TEXT_MODEL,'openai/gpt-oss-20b','llama-3.1-8b-instant','llama-3.3-70b-versatile'];"
          if old not in s: raise SystemExit('fallback model list not found')
          s=s.replace(old,new,1)
          marker='// PROVIDER_FALLBACK_HARDENING_V2'
          if marker not in s: s+='\n'+marker+'\n'
          p.write_text(s)
          PY
          node --check local-gateway.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-gateway.js
          git diff --cached --quiet || git commit -m 'Expand Groq model fallback chain'
          git push
