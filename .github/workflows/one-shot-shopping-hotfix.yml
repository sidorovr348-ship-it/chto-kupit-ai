name: One-shot shopping price hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor == 'sidorovr348-ship-it' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shopping to use structured Google Shopping prices
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('local-gateway.js')
          s=p.read_text()
          marker='async function shopping(query){'
          helper='''async function shoppingWeb(query,city){
  const k=keyOf('SERPER_API_KEY','SERPER_KEY');
  if(k){
    try{
      const r=await fetch('https://google.serper.dev/shopping',{method:'POST',headers:{'X-API-KEY':k,'Content-Type':'application/json'},body:JSON.stringify({q:String(query).slice(0,500),gl:'ru',hl:'ru',num:12,location:String(city||'Москва')}),signal:AbortSignal.timeout(30000)});
      const raw=await r.text(); let d={}; try{d=raw?JSON.parse(raw):{}}catch{}
      if(r.ok){
        const out=(d.shopping||[]).map(x=>({title:String(x.title||''),link:String(x.link||''),snippet:[String(x.snippet||''),String(x.price||'')].filter(Boolean).join(' | ')})).filter(x=>x.title&&/^https?:\\/\\//i.test(x.link));
        if(out.length)return out;
      }else console.error('SERPER_SHOPPING_FAILED',r.status,String(d.message||d.error||raw).slice(0,300));
    }catch(e){console.error('SERPER_SHOPPING_FAILED',e.message)}
  }
  return searchWeb(String(query)+' купить цена '+String(city||'Москва')+' в наличии',12);
}
'''
          if marker not in s: raise SystemExit('shopping marker not found')
          if 'async function shoppingWeb(query,city)' not in s:
              s=s.replace(marker,helper+marker,1)
          old='const raw=await searchWeb(`${query} купить цена ${city} в наличии`,12);'
          new='const raw=await shoppingWeb(query,city);'
          if old not in s: raise SystemExit('shopping call pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check local-gateway.js
          git config user.name 'sidorovr348-ship-it'
          git config user.email 'sidorovr348@gmail.com'
          git rm .github/workflows/one-shot-shopping-hotfix.yml
          git add local-gateway.js
          git commit -m 'fix: use structured shopping prices when available'
          git push
