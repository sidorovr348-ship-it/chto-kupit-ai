name: Deploy and verify My AI Unified
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: my-ai-unified-local-ai
  cancel-in-progress: true
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Update verified local AI locator'
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - name: Deploy VPS local AI and Alice
        env: { VPS_HOST: '${{ secrets.VPS_HOST }}', VPS_USER: '${{ secrets.VPS_USER }}', VPS_SSH_KEY: '${{ secrets.VPS_SSH_KEY }}' }
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"; SCP="scp -q -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$VPS_USER@$VPS_HOST" 'set -e; echo "DISK_BEFORE"; df -h /; npm cache clean --force >/dev/null 2>&1 || true; journalctl --vacuum-size=50M >/dev/null 2>&1 || true; apt-get clean >/dev/null 2>&1 || true; rm -rf /var/lib/apt/lists/* /root/.cache/pip /root/.cache/npm/_cacache 2>/dev/null || true; find /root/.npm/_logs -type f -delete 2>/dev/null || true; find /tmp -type f -mtime +2 -delete 2>/dev/null || true; echo "DISK_AFTER_CLEAN"; df -h /; mkdir -p /root/my-ai-unified/backups /root/my-ai-unified/src /root/alice-ai; ts=$(date +%Y%m%d-%H%M%S); free_mb=$(df -Pm / | awk "NR==2{print \$4}"); if [ "$free_mb" -ge 300 ]; then for f in server.js supervisor.js package.json local-gateway.js src/local-ai.js src/dispatcher.js src/capabilities.json src/document-tools.js; do [ -f "/root/my-ai-unified/$f" ] && cp -a "/root/my-ai-unified/$f" "/root/my-ai-unified/backups/$(basename "$f").$ts" || true; done; [ -f /root/alice-ai/server.js ] && cp -a /root/alice-ai/server.js "/root/alice-ai/server.js.backup-unified-$ts" || true; else echo "LOW_DISK_SKIP_NEW_BACKUP free_mb=$free_mb (existing backups preserved)"; fi'
          $SCP server.js supervisor.js package.json local-gateway.js "$VPS_USER@$VPS_HOST:/root/my-ai-unified/"
          $SCP src/local-ai.js src/dispatcher.js src/capabilities.json src/document-tools.js "$VPS_USER@$VPS_HOST:/root/my-ai-unified/src/"
          $SSH "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/my-ai-unified
          if [ ! -d node_modules/express ] || [ ! -d node_modules/cors ] || [ ! -d node_modules/dotenv ]; then npm install --omit=dev --no-audit --no-fund; fi
          if ! command -v ollama >/dev/null 2>&1; then curl -fsSL https://ollama.com/install.sh | sh; fi
          if ! systemctl list-unit-files ollama.service >/dev/null 2>&1 || ! systemctl cat ollama.service >/dev/null 2>&1; then
            OLLAMA_BIN=$(command -v ollama)
            cat >/etc/systemd/system/ollama.service <<UNIT
          [Unit]
          Description=Ollama Service
          After=network-online.target
          [Service]
          ExecStart=${OLLAMA_BIN} serve
          User=root
          Restart=always
          RestartSec=3
          Environment=OLLAMA_HOST=127.0.0.1:11434
          [Install]
          WantedBy=multi-user.target
          UNIT
          fi
          systemctl daemon-reload; systemctl enable ollama >/dev/null 2>&1 || true; systemctl restart ollama
          for i in $(seq 1 30); do curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null
          MODEL='qwen3:0.6b'; ollama pull "$MODEL"
          printf 'OLLAMA_BASE_URL=http://127.0.0.1:11434\nOLLAMA_MODEL=%s\nOLLAMA_TIMEOUT_MS=30000\n' "$MODEL" >/root/my-ai-unified/.local-ai.env
          cat >/etc/systemd/system/my-ai-unified-legacy.service <<'UNIT'
          [Unit]
          After=network-online.target
          [Service]
          WorkingDirectory=/root/my-ai-unified
          Environment=PORT=3021
          Environment=ENV_FILE=/root/chto-kupit-ai.env
          ExecStart=/usr/bin/node /root/my-ai-unified/server.js
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target
          UNIT
          cat >/etc/systemd/system/my-ai-unified.service <<'UNIT'
          [Unit]
          After=network-online.target ollama.service my-ai-unified-legacy.service
          [Service]
          WorkingDirectory=/root/my-ai-unified
          Environment=PORT=3020
          Environment=LEGACY_URL=http://127.0.0.1:3021
          EnvironmentFile=-/root/my-ai-unified/.local-ai.env
          ExecStart=/usr/bin/node /root/my-ai-unified/local-gateway.js
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target
          UNIT
          cat >/root/alice-ai/server.js <<'NODE'
          const express=require('express');const app=express();app.use(express.json({limit:'10mb'}));const TARGET='http://127.0.0.1:3020/alice';
          app.get('/health',(q,r)=>r.json({ok:true,service:'alice-ai-adapter',target:TARGET}));
          app.post('/alice',async(q,r)=>{try{const c=new AbortController(),t=setTimeout(()=>c.abort(),4300);const x=await fetch(TARGET,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q.body||{}),signal:c.signal});clearTimeout(t);r.status(x.status).type('application/json').send(await x.text())}catch(e){const s=String(q.body?.request?.command||q.body?.request?.original_utterance||'');const text=/кто тебя создал/iu.test(s)?'Меня создал Roman.':/как тебя зовут/iu.test(s)?'Мой AI.':'Мой AI получил запрос. Повтори его ещё раз.';r.json({version:'1.0',response:{text,end_session:false},session_state:{fallback:true}})}});
          app.listen(3011,'127.0.0.1',()=>console.log('Alice -> My AI Unified :3020'));
          NODE
          cat >/etc/systemd/system/alice-ai.service <<'UNIT'
          [Unit]
          After=network-online.target my-ai-unified.service
          [Service]
          WorkingDirectory=/root/alice-ai
          ExecStart=/usr/bin/node /root/alice-ai/server.js
          Restart=always
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload; systemctl enable my-ai-unified-legacy my-ai-unified alice-ai
          systemctl restart my-ai-unified-legacy; systemctl restart my-ai-unified; systemctl restart alice-ai
          systemctl is-active ollama my-ai-unified-legacy my-ai-unified alice-ai
          REMOTE
      - name: Verify local AI and Alice
        env: { VPS_HOST: '${{ secrets.VPS_HOST }}', VPS_USER: '${{ secrets.VPS_USER }}', VPS_SSH_KEY: '${{ secrets.VPS_SSH_KEY }}' }
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/tmp/ollama.json
          curl -fsS --max-time 10 http://127.0.0.1:3020/health >/tmp/health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json')); assert h.get('ok') and h.get('dispatcher') and h.get('local_ai',{}).get('ok'),h; print('LOCAL_HEALTH_OK',h['local_ai'])
          PY
          curl --fail --silent --show-error --max-time 45 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/chat.json')); assert j.get('ok') and j.get('local') and j.get('result'),j; print('LOCAL_CHAT_OK',j.get('model'),j.get('result'))
          PY
          curl --fail --silent --show-error --max-time 10 -X POST http://127.0.0.1:3011/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Кто тебя создал?","original_utterance":"Кто тебя создал?"},"session":{"session_id":"ci-alice"}}' >/tmp/alice.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/alice.json')); assert j.get('response',{}).get('text'),j; print('ALICE_LOCAL_OK',j['response']['text'])
          PY
          curl --fail --silent --show-error --max-time 10 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Кто тебя создал?","original_utterance":"Кто тебя создал?"},"session":{"session_id":"ci-public-alice"}}' >/tmp/alice-public.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/alice-public.json')); assert j.get('response',{}).get('text'),j; print('ALICE_PUBLIC_OK',j['response']['text'])
          PY
          REMOTE
      - name: Rebuild verified Quick Tunnel and Pages
        env: { VPS_HOST: '${{ secrets.VPS_HOST }}', VPS_USER: '${{ secrets.VPS_USER }}', VPS_SSH_KEY: '${{ secrets.VPS_SSH_KEY }}' }
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/tunnel-output.txt <<'REMOTE'
          set -euo pipefail
          : >/var/log/my-ai-unified-quick-tunnel.log
          cat >/etc/systemd/system/my-ai-unified-quick-tunnel.service <<'UNIT'
          [Unit]
          After=network-online.target
          [Service]
          ExecStart=/usr/local/bin/cloudflared tunnel --protocol http2 --no-autoupdate --url http://127.0.0.1:3020
          Restart=always
          RestartSec=3
          StandardOutput=append:/var/log/my-ai-unified-quick-tunnel.log
          StandardError=append:/var/log/my-ai-unified-quick-tunnel.log
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload; systemctl enable my-ai-unified-quick-tunnel; systemctl restart my-ai-unified-quick-tunnel
          url=''; for i in $(seq 1 45); do url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /var/log/my-ai-unified-quick-tunnel.log | tail -1 || true); [ -n "$url" ] && break; sleep 2; done; test -n "$url"
          for i in $(seq 1 120); do if curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 10 "$url/health?t=verify" >/tmp/public-health.json 2>/dev/null; then break; fi; sleep 2; done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-health.json')); assert j.get('ok') and j.get('local_ai',{}).get('ok'),j; print('PUBLIC_HEALTH_OK',j['local_ai'])
          PY
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 60 -X POST "$url/chat" -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/public-chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-chat.json')); assert j.get('ok') and j.get('local') and j.get('result'),j; print('PUBLIC_CHAT_OK',j.get('model'),j.get('result'))
          PY
          echo "FULL_CHAIN_OK=$url"
          REMOTE
          url=$(grep '^FULL_CHAIN_OK=' /tmp/tunnel-output.txt | cut -d= -f2-); test -n "$url"; printf '%s' "$url" > /tmp/quick-url
          rm -rf pages; mkdir -p pages; cp index.html app-fixed.html pages/
          python3 - "$(cat /tmp/quick-url)" <<'PY'
          import pathlib,sys,json
          u=sys.argv[1].rstrip('/'); pathlib.Path('api.json').write_text(json.dumps({'ok':True,'api':u,'verified':'full-chain-local-ai-alice'},ensure_ascii=False,indent=2)+'\n'); pathlib.Path('index.html').write_text('<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My AI Unified</title></head><body><script>location.replace(\'./app-fixed.html?v=local-\'+Date.now());</script><p>Открываю My AI Unified…</p></body></html>\n')
          PY
          cp index.html app-fixed.html api.json pages/
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add index.html api.json; git diff --cached --quiet || (git commit -m 'Update verified local AI locator' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - uses: actions/deploy-pages@v4