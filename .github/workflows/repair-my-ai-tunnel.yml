name: Repair My AI Unified tunnel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair and verify Cloudflare Tunnel
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== LOCAL APP ==='
          systemctl is-active my-ai-unified.service || true
          curl -sS --max-time 10 http://127.0.0.1:3020/health || true
          echo
          echo '=== CLOUDFLARED SERVICE ==='
          if systemctl list-unit-files | grep -q '^chto-kupit-cloudflared.service'; then
            CF_SERVICE=chto-kupit-cloudflared.service
          elif systemctl list-unit-files | grep -q '^cloudflared.service'; then
            CF_SERVICE=cloudflared.service
          else
            echo 'ERROR: no cloudflared service'
            exit 1
          fi
          echo "service=$CF_SERVICE"
          systemctl is-active "$CF_SERVICE" || true
          systemctl show -p ExecStart "$CF_SERVICE" || true
          echo '=== CONFIG ==='
          sed -n '1,160p' /etc/cloudflared/config.yml 2>/dev/null || true
          echo '=== RECENT JOURNAL ==='
          journalctl -u "$CF_SERVICE" -n 60 --no-pager || true
          echo '=== ENSURE SERVICE IS RUNNING ==='
          if ! systemctl is-active --quiet "$CF_SERVICE"; then
            systemctl start "$CF_SERVICE"
          fi
          sleep 5
          systemctl is-active "$CF_SERVICE"
          echo '=== LOCAL HEALTH AFTER REPAIR ==='
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3020/health
          REMOTE

      - name: Verify public API
        run: |
          set -euo pipefail
          echo '=== PUBLIC HEALTH ==='
          curl --fail --silent --show-error --max-time 25 https://ai.aliceq.ru/health
