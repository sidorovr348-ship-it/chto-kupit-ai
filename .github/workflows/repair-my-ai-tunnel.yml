name: Verify My AI Unified tunnel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair and verify My AI Unified endpoint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== LOCAL APP ==='
          if ! systemctl is-active --quiet my-ai-unified.service; then
            echo 'My AI Unified service is not active; restarting it.'
            systemctl restart my-ai-unified.service
            sleep 3
          fi
          systemctl is-active my-ai-unified.service
          echo '=== LOCAL HEALTH ==='
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3020/health
          echo
          echo '=== LOCAL SHOPPING ==='
          curl --fail --silent --show-error --max-time 30 -X POST http://127.0.0.1:3020/shopping \
            -H 'Content-Type: application/json' \
            --data '{"query":"iPhone 17 Pro","location":"Москва, Россия","mode":"find"}'
          echo
          REMOTE

      - name: Verify public API
        run: |
          set -euo pipefail
          echo '=== PUBLIC HEALTH ==='
          curl --fail --silent --show-error --max-time 25 'https://ai.aliceq.ru/health?t=repair'
          echo
          echo '=== PUBLIC SHOPPING ==='
          curl --fail --silent --show-error --max-time 30 -X POST 'https://ai.aliceq.ru/shopping' \
            -H 'Content-Type: application/json' \
            --data '{"query":"iPhone 17 Pro","location":"Москва, Россия","mode":"find"}'
          echo
