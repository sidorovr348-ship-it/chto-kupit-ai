name: Deploy and verify My AI Unified
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: my-ai-unified-local-ai
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Update verified local AI locator'
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing VPS services
        env: { VPS_HOST: '${{ secrets.VPS_HOST }}', VPS_USER: '${{ secrets.VPS_USER }}', VPS_SSH_KEY: '${{ secrets.VPS_SSH_KEY }}' }
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet ollama
          systemctl is-active --quiet my-ai-unified
          systemctl is-active --quiet alice-ai
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/tmp/ollama.json
          curl -fsS --max-time 10 http://127.0.0.1:3020/health >/tmp/health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h.get('ok') and h.get('dispatcher') and h.get('local_ai',{}).get('ok'), h
          assert 'qwen3:0.6b' in h.get('local_ai',{}).get('models',[]), h
          print('LOCAL_HEALTH_OK', h['local_ai'])
          PY
          curl --fail --silent --show-error --max-time 45 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/chat.json'))
          assert j.get('ok') and j.get('local') and j.get('result'), j
          print('LOCAL_CHAT_OK', j.get('model'), j.get('result'))
          PY
          curl --fail --silent --show-error --max-time 8 -X POST http://127.0.0.1:3011/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Кто тебя создал?","original_utterance":"Кто тебя создал?"},"session":{"session_id":"ci-alice"}}' >/tmp/alice.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/alice.json'))
          assert j.get('response',{}).get('text'), j
          print('ALICE_LOCAL_OK', j['response']['text'])
          PY
          REMOTE
      - name: Verify Alice public endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 12 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Кто тебя создал?","original_utterance":"Кто тебя создал?"},"session":{"session_id":"ci-public-alice"}}' >/tmp/alice-public.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/alice-public.json'))
          assert j.get('response',{}).get('text'), j
          print('ALICE_PUBLIC_OK', j['response']['text'])
          PY
      - name: Rebuild verified Quick Tunnel and Pages
        env: { VPS_HOST: '${{ secrets.VPS_HOST }}', VPS_USER: '${{ secrets.VPS_USER }}', VPS_SSH_KEY: '${{ secrets.VPS_SSH_KEY }}' }
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/tunnel-output.txt <<'REMOTE'
          set -euo pipefail
          : >/var/log/my-ai-unified-quick-tunnel.log
          cat >/etc/systemd/system/my-ai-unified-quick-tunnel.service <<'UNIT'
          [Unit]
          After=network-online.target
          [Service]
          ExecStart=/usr/local/bin/cloudflared tunnel --protocol http2 --no-autoupdate --url http://127.0.0.1:3020
          Restart=always
          RestartSec=3
          StandardOutput=append:/var/log/my-ai-unified-quick-tunnel.log
          StandardError=append:/var/log/my-ai-unified-quick-tunnel.log
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable my-ai-unified-quick-tunnel >/dev/null
          systemctl restart my-ai-unified-quick-tunnel
          url=''
          for i in $(seq 1 45); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /var/log/my-ai-unified-quick-tunnel.log | tail -1 || true)
            [ -n "$url" ] && break
            sleep 2
          done
          test -n "$url"
          for i in $(seq 1 120); do
            if curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 10 "$url/health?t=verify" >/tmp/public-health.json 2>/dev/null; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-health.json'))
          assert j.get('ok') and j.get('local_ai',{}).get('ok'), j
          print('PUBLIC_HEALTH_OK', j['local_ai'])
          PY
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 60 -X POST "$url/chat" -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/public-chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-chat.json'))
          assert j.get('ok') and j.get('local') and j.get('result'), j
          print('PUBLIC_CHAT_OK', j.get('model'), j.get('result'))
          PY
          echo "FULL_CHAIN_OK=$url"
          REMOTE
          url=$(grep '^FULL_CHAIN_OK=' /tmp/tunnel-output.txt | cut -d= -f2-)
          test -n "$url"
          printf '%s' "$url" > /tmp/quick-url
          rm -rf pages
          mkdir -p pages
          cp app-fixed.html pages/
          python3 - "$(cat /tmp/quick-url)" <<'PY'
          import pathlib,sys,json
          u=sys.argv[1].rstrip('/')
          pathlib.Path('api.json').write_text(json.dumps({'ok':True,'api':u,'verified':'full-chain-local-ai-alice'},ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('index.html').write_text('<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My AI Unified</title></head><body><script>location.replace(\'./app-fixed.html?v=local-\'+Date.now());</script><p>Открываю My AI Unified…</p></body></html>\n')
          PY
          cp index.html app-fixed.html api.json pages/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html api.json
          git diff --cached --quiet || (git commit -m 'Update verified local AI locator' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - uses: actions/deploy-pages@v4
