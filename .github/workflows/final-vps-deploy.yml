name: My AI Unified — VPS and Pages deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: my-ai-unified-final-vps
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact unified gateway
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          O=(-o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          workdir=$(ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          test -n "$workdir"
          scp "${O[@]}" -q local-gateway.js "$VPS_USER@$VPS_HOST:$workdir/local-gateway.js"
          scp "${O[@]}" -q package.json "$VPS_USER@$VPS_HOST:$workdir/package.json"
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "WORKDIR='$workdir' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$WORKDIR"
          npm install --omit=dev --no-audit --no-fund
          node --check local-gateway.js
          nodebin=$(command -v node)
          install -d /etc/systemd/system/my-ai-unified.service.d
          cat >/etc/systemd/system/my-ai-unified.service.d/override.conf <<EOF
[Service]
WorkingDirectory=$WORKDIR
ExecStart=
ExecStart=$nodebin $WORKDIR/local-gateway.js
EnvironmentFile=/root/chto-kupit-ai.env
EnvironmentFile=-/root/my-ai-unified/.local-ai.env
Environment=PORT=3020
Restart=always
RestartSec=2
EOF
          systemctl daemon-reload
          systemctl reset-failed my-ai-unified || true
          systemctl restart my-ai-unified
          ready=0
          for i in $(seq 1 30); do if systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/health.json; then ready=1; break; fi; sleep 1; done
          test "$ready" = 1
          cat /tmp/health.json
          echo
          echo '=== DEEPSEEK DIAGNOSTIC ==='
          set +e
          ENV_FILE=/root/my-ai-unified/.local-ai.env node <<'NODE'
          const fs=require('fs'); const dotenv=require('dotenv'); for(const f of ['/root/my-ai-unified/.local-ai.env','/root/chto-kupit-ai.env']) if(fs.existsSync(f)) dotenv.config({path:f,override:false});
          (async()=>{const map={'с':'c','С':'C','а':'a','А':'A','е':'e','Е':'E','о':'o','О':'O','р':'p','Р':'P','х':'x','Х':'X','у':'y','У':'Y','к':'k','К':'K','м':'m','М':'M','т':'t','Т':'T','в':'b','В':'B','н':'h','Н':'H'};const key=[...(process.env.DEEPSEEK_API_KEY||'').trim()].map(c=>map[c]||c).join('');console.log('KEY_PRESENT',!!key,'KEY_LENGTH',key.length,'ASCII',/^[\x21-\x7E]+$/.test(key));if(!key)return;const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify({model:'deepseek-v4-flash',messages:[{role:'user',content:'Ответь одним словом: ГОТОВО'}],max_tokens:16,temperature:0,thinking:{type:'disabled'}})});const t=await r.text();console.log('DEEPSEEK_HTTP',r.status);try{const d=JSON.parse(t);console.log('DEEPSEEK_MESSAGE',String(d?.error?.message||d?.choices?.[0]?.message?.content||'NO_MESSAGE').slice(0,500))}catch{console.log('DEEPSEEK_BODY',t.slice(0,500))}})().catch(e=>console.log('DEEPSEEK_FETCH_ERROR',String(e)))
          NODE
          set -e
          echo '=== LOCAL CHAT ==='
          curl -sS --max-time 45 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ГОТОВО"}' || true
          echo
          echo '=== TTS ==='
          curl -sS --max-time 30 -X POST http://127.0.0.1:3020/tts -H 'Content-Type: application/json' --data '{"text":"Привет. Я My AI Unified."}' -o /tmp/tts.mp3 || true
          test -s /tmp/tts.mp3 || true
          echo '=== JOURNAL ==='
          journalctl -u my-ai-unified -n 60 --no-pager -o cat
          REMOTE
      - name: Verify stable public API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --max-time 60 https://aliceq.ru/health >/tmp/public-health.json
          cat /tmp/public-health.json
          echo
          curl --fail --silent --show-error --retry 8 --retry-all-errors --max-time 60 -X POST https://aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ГОТОВО"}' >/tmp/public-chat.json
          cat /tmp/public-chat.json
          echo
      - name: Prepare GitHub Pages
        run: |
          set -euo pipefail
          rm -rf pages
          mkdir -p pages
          cp index.html pages/index.html
          printf '%s\n' '{"ok":true,"api":"https://ai.aliceq.ru","verified":"stable-full-chain"}' > pages/api.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
