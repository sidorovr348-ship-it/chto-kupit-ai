name: My AI Unified — VPS final deploy
on:
  push:
    branches: [main]
concurrency:
  group: my-ai-unified-final-vps
  cancel-in-progress: true
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - name: Deploy local gateway to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          workdir=$(ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          test -n "$workdir"
          scp -q -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes local-gateway.js "$VPS_USER@$VPS_HOST:$workdir/local-gateway.js"
          scp -q -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes src/local-ai.js "$VPS_USER@$VPS_HOST:$workdir/src/local-ai.js"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -s" <<REMOTE
          set -euo pipefail
          node --check "$workdir/local-gateway.js"
          node --check "$workdir/src/local-ai.js"
          systemctl restart my-ai-unified
          systemctl is-active --quiet ollama
          ready=0
          for i in \$(seq 1 30); do
            if systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/health.json; then ready=1; break; fi
            sleep 1
          done
          test "\$ready" = 1
          curl --fail --silent --show-error --max-time 45 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/chat.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json')); j=json.load(open('/tmp/chat.json'))
          assert h.get('ok') and h.get('dispatcher'), h
          assert j.get('ok') and j.get('result'), j
          print('LOCAL_HEALTH_OK'); print('LOCAL_CHAT_OK',j.get('result'),j.get('fallback',False))
          PY
          REMOTE
      - name: Verify Alice
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "curl --fail --silent --show-error --max-time 30 -X POST http://127.0.0.1:3011/alice -H 'Content-Type: application/json' --data '{\"version\":\"1.0\",\"request\":{\"command\":\"Кто тебя создал?\"},\"session\":{\"session_id\":\"final-ci\"}}'"
      - name: Rebuild and verify public app
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/tunnel-output.txt <<'REMOTE'
          set -euo pipefail
          STABLE='https://ai.aliceq.ru'
          cloudflared tunnel route dns alice-ai ai.aliceq.ru >/tmp/dns.out 2>&1 || true
          cfg=''
          for f in /etc/cloudflared/config.yml /etc/cloudflared/config.yaml /root/.cloudflared/config.yml /root/.cloudflared/config.yaml; do [ -f "$f" ] && cfg="$f" && break; done
          test -n "$cfg"
          cp "$cfg" "$cfg.bak-my-ai-unified"
          python3 - "$cfg" <<'PY'
          import sys
          p=sys.argv[1]
          s=open(p).read()
          entry='  - hostname: ai.aliceq.ru\n    service: http://127.0.0.1:3020\n'
          if 'hostname: ai.aliceq.ru' not in s:
              marker='ingress:\n'
              if marker in s: s=s.replace(marker,marker+entry,1)
              else: s += '\n\ningress:\n'+entry
          alice_path='  - hostname: aliceq.ru\n    path: ^/alice$\n    service: http://127.0.0.1:3020\n'
          if 'path: ^/alice$' not in s:
              marker='ingress:\n'
              if marker in s: s=s.replace(marker,marker+alice_path,1)
              else: s += '\n\ningress:\n'+alice_path
          open(p,'w').write(s)
          PY
          cloudflared tunnel ingress validate --config "$cfg"
          systemctl restart cloudflared 2>/dev/null || systemctl restart cloudflared.service 2>/dev/null || true
          for i in $(seq 1 45); do curl -fsS --max-time 5 "$STABLE/health?t=verify" >/tmp/public-health.json 2>/dev/null && break; sleep 2; done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-health.json'))
          assert j.get('ok'), j
          print('STABLE_PUBLIC_HEALTH_OK')
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 60 -X POST "$STABLE/chat" -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/public-chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-chat.json'))
          assert j.get('ok') and j.get('result'), j
          print('STABLE_PUBLIC_CHAT_OK',j.get('result'))
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 -X POST 'https://aliceq.ru/alice' -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: АЛИСА_OK"},"session":{"session_id":"public-unified-check"}}' >/tmp/public-alice.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-alice.json'))
          text=str(j.get('response',{}).get('text',''))
          assert text, j
          print('ALICE_PUBLIC_OK',text)
          PY
          echo "FULL_CHAIN_OK=$STABLE"
          REMOTE
          url=$(grep '^FULL_CHAIN_OK=' /tmp/tunnel-output.txt | cut -d= -f2-)
          test -n "$url"
          rm -rf pages
          mkdir -p pages
          cp index.html pages/index.html
          python3 - "$url" <<'PY'
          import json,pathlib,sys
          u=sys.argv[1].rstrip('/')
          data=json.dumps({'ok':True,'api':u,'verified':'stable-full-chain'},ensure_ascii=False,indent=2)+'\n'
          pathlib.Path('api.json').write_text(data)
          pathlib.Path('pages/api.json').write_text(data)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - uses: actions/deploy-pages@v4
