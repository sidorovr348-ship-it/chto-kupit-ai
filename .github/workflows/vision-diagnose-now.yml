name: My AI Unified — vision diagnose now
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture local VPS vision failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -u
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=5 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          workdir=$(ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "WORKDIR='$workdir' bash -s" <<'REMOTE'
          set +e
          cd "$WORKDIR"
          echo '--- FILE PATCH MARKERS ---'
          grep -o "MISTRAL_VISION_MODEL\|max_completion_tokens=256\|delete body.include_reasoning" local-gateway.js || true
          echo '--- HEALTH ---'
          curl -sS http://127.0.0.1:3020/health; echo
          echo '--- BEFORE ---'
          systemctl is-active my-ai-unified
          echo '--- PHOTO ---'
          printf '%s' '{"images":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYElEQVR4nO3PQQ0AIBDAMMC/50MEj4ZkVbDtmVk/OzrgVQNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgPaBXKqA31N0fbGAAAAAElFTkSuQmCC"],"prompt":"Опиши изображение одним коротким предложением."}' >/tmp/p.json
          curl -sS --max-time 120 -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data @/tmp/p.json; echo
          echo '--- AFTER ---'
          systemctl is-active my-ai-unified
          echo '--- JOURNAL ---'
          journalctl -u my-ai-unified -n 120 --no-pager
          REMOTE
