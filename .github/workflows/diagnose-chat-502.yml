name: My AI Unified — diagnose chat 502
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and test VPS chat
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== STATUS ==='
          systemctl status my-ai-unified --no-pager -l | tail -80
          echo '=== JOURNAL ==='
          journalctl -u my-ai-unified -n 120 --no-pager -o short-iso
          echo '=== HEALTH ==='
          curl -sS -i --max-time 10 http://127.0.0.1:3020/health
          echo '=== CHAT ==='
          for i in $(seq 1 5); do date -Is; curl -sS -i --max-time 60 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ДИАГНОСТИКА"}'; echo; sleep 2; done
          REMOTE
