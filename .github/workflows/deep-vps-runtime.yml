name: My AI Unified — deep VPS runtime check
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          workdir=$(systemctl show -p WorkingDirectory --value my-ai-unified)
          echo "WORKDIR=$workdir"
          echo '=== BEFORE ==='
          systemctl is-active my-ai-unified; systemctl is-active ollama
          ss -ltnp | grep -E ':3020|:11434' || true
          echo '=== CHECK FILES ==='
          node --check "$workdir/local-gateway.js"; echo "gateway_check=$?"
          node --check "$workdir/src/local-ai.js"; echo "localai_check=$?"
          echo '=== RESTART ==='
          systemctl restart my-ai-unified
          sleep 5
          systemctl status my-ai-unified --no-pager -l
          echo '=== PORTS ==='
          ss -ltnp | grep -E ':3020|:11434' || true
          echo '=== HEALTH ==='
          curl -v --max-time 10 http://127.0.0.1:3020/health || true
          echo
          echo '=== STATUS AFTER HEALTH ==='
          systemctl status my-ai-unified --no-pager -l
          echo '=== JOURNAL AFTER HEALTH ==='
          journalctl -u my-ai-unified -n 100 --no-pager -o short-iso
          echo '=== CHAT ==='
          curl -v --max-time 50 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' || true
          echo
          echo '=== STATUS AFTER CHAT ==='
          systemctl status my-ai-unified --no-pager -l
          echo '=== JOURNAL AFTER CHAT ==='
          journalctl -u my-ai-unified -n 140 --no-pager -o short-iso
          echo '=== OLLAMA DIRECT ==='
          curl -sS --max-time 5 http://127.0.0.1:11434/api/tags || true
          echo
          REMOTE