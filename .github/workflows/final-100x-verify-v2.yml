name: My AI Unified — final 100x verification v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 100x public health and chat with transient retry
        run: |
          set -euo pipefail
          req(){
            local url="$1" data="${2:-}" max=5 n=1
            while true; do
              if [ -n "$data" ]; then code=$(curl -sS -o /tmp/out --write-out '%{http_code}' --max-time 60 -X POST "$url" -H 'Content-Type: application/json' --data "$data" || true); else code=$(curl -sS -o /tmp/out --write-out '%{http_code}' --max-time 30 "$url" || true); fi
              if [ "$code" = 200 ]; then return 0; fi
              if [ "$n" -ge "$max" ]; then echo "FAILED $url HTTP $code"; cat /tmp/out || true; return 1; fi
              sleep $((n*2)); n=$((n+1))
            done
          }
          for i in $(seq 1 100); do
            req 'https://ai.aliceq.ru/health'
            python3 - <<'PY'
          import json
          j=json.load(open('/tmp/out')); assert j.get('ok') and j.get('dispatcher'),j
          PY
            req 'https://ai.aliceq.ru/chat' '{"prompt":"Ответь одним словом: ОК"}'
            python3 - <<'PY'
          import json
          j=json.load(open('/tmp/out')); assert j.get('ok') and str(j.get('result','')).strip(),j
          PY
            echo "ROUND $i OK"
          done
      - name: 20x public photo with transient retry
        env:
          IMAGE_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          open('/tmp/p.json','w').write(json.dumps({'images':['data:image/png;base64,'+os.environ['IMAGE_B64']],'prompt':'Что изображено? Ответь кратко по-русски.'},ensure_ascii=False))
          PY
          for i in $(seq 1 20); do
            n=1
            while true; do code=$(curl -sS -o /tmp/pout.json --write-out '%{http_code}' --max-time 150 -X POST https://ai.aliceq.ru/photo -H 'Content-Type: application/json' --data-binary @/tmp/p.json || true); [ "$code" = 200 ] && break; [ "$n" -ge 5 ] && { cat /tmp/pout.json || true; exit 1; }; sleep $((n*2)); n=$((n+1)); done
            python3 - <<'PY'
          import json
          j=json.load(open('/tmp/pout.json')); assert j.get('ok') and str(j.get('result','')).strip(),j
          PY
            echo "PHOTO $i OK"
          done
      - name: Final result
        run: echo 'FINAL_100X_VERIFICATION_V2_OK'
