name: Read-only live VPS source audit v2

on:
  push:
    branches:
      - audit/live-source-2026-11-08

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare live gateway without changing the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-vps-key.py
          chmod 600 /tmp/vps_key
          trap 'rm -f /tmp/vps_key /tmp/vps_key.pub' EXIT
          ssh-keygen -y -P "" -f /tmp/vps_key >/dev/null
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$VPS_HOST" "df -h /; df -Pi /; systemctl show my-ai-unified.service -p ActiveState -p SubState -p NRestarts"
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$VPS_HOST" "cat /root/my-ai-unified/local-gateway.js" > /tmp/live-gateway.js
          python3 - <<'PY'
          from pathlib import Path
          import difflib, hashlib, re
          repo=Path('local-gateway.js').read_text(errors='replace').splitlines()
          live=Path('/tmp/live-gateway.js').read_text(errors='replace').splitlines()
          print('REPO_GATEWAY_SHA256',hashlib.sha256('\n'.join(repo).encode()).hexdigest())
          print('LIVE_GATEWAY_SHA256',hashlib.sha256('\n'.join(live).encode()).hexdigest())
          print('REPO_LINES',len(repo),'LIVE_LINES',len(live))
          for label,lines in [('REPO',repo),('LIVE',live)]:
              source='\n'.join(lines)
              for marker in ['max_completion_tokens=vision?1024:64','max_completion_tokens=vision?1024:512','const textTimeout=2200','modelTimeout=vision?visionTimeout']:
                  if marker in source: print(label+'_MARKER',marker)
          diff=list(difflib.unified_diff(repo,live,fromfile='main/local-gateway.js',tofile='VPS/local-gateway.js',lineterm=''))
          patterns=[
              (re.compile(r'(?i)([A-Z0-9_]*(?:API_KEY|TOKEN|SECRET|PASSWORD)[A-Z0-9_]*\s*[:=]\s*)[^,;\s]+'),r'\1[REDACTED]'),
              (re.compile(r'(?i)(Bearer\s+)[A-Za-z0-9._~+/-]+'),r'\1[REDACTED]'),
              (re.compile(r'(?i)(sk-[A-Za-z0-9_-]{12,}|gsk_[A-Za-z0-9_-]{12,})'),r'[REDACTED_KEY]')
          ]
          print('DIFF_LINES',len(diff))
          for line in diff[:300]:
              for pattern,repl in patterns: line=pattern.sub(repl,line)
              print(line)
          if len(diff)>300: print('DIFF_TRUNCATED',len(diff)-300,'additional lines omitted')
          PY
