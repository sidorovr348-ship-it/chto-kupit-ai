name: Deploy My AI Unified to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'set -e
            cd /root/my-ai-unified
            git fetch origin main
            cp server.js "server.js.before-auto-deploy-$(date +%s).bak"
            git checkout origin/main -- server.js src/dispatcher.js
            node --check server.js
            npm test
            systemctl restart my-ai-unified.service
            sleep 2
            curl -fsS http://127.0.0.1:3020/health
          '
