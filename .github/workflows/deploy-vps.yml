name: Deploy My AI Unified to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: my-ai-unified-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/my-ai-unified
          git fetch origin main
          cp server.js "server.js.before-github-deploy-$(date +%Y%m%d-%H%M%S).bak"
          git checkout origin/main -- server.js src/dispatcher.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          if "app.post('/shopping'" not in s:
              marker = "app.post('/chat',async(req,res)=>"
              route = "app.post('/shopping',async(req,res)=>{try{const {query='',location='Россия',mode='find'}=req.body||{};if(!String(query).trim())return res.status(400).json({ok:false,error:'query is required'});return res.json({ok:true,route:'shopping',results:await searchShopping(query,location,mode)});}catch(error){console.error('SHOPPING ERROR:',error);res.status(error.status||500).json({ok:false,error:error.message||'Shopping request failed',details:error.details||undefined});}});\n"
              if marker not in s:
                  raise SystemExit('CHAT route marker not found')
              s = s.replace(marker, route + marker, 1)
              p.write_text(s)
          PY
          node --check server.js
          npm test
          systemctl restart my-ai-unified.service
          if systemctl list-unit-files | grep -q '^chto-kupit-cloudflared.service'; then
            systemctl restart chto-kupit-cloudflared.service
            echo '--- CLOUDFLARED STATUS ---'
            systemctl is-active chto-kupit-cloudflared.service
            systemctl --no-pager -l status chto-kupit-cloudflared.service | tail -40
          elif systemctl list-unit-files | grep -q '^cloudflared.service'; then
            systemctl restart cloudflared.service
            echo '--- CLOUDFLARED STATUS ---'
            systemctl is-active cloudflared.service
            systemctl --no-pager -l status cloudflared.service | tail -40
          else
            echo 'Cloudflared systemd service not found'
            exit 1
          fi
          sleep 3
          echo '--- LOCAL HEALTH ---'
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3020/health
          REMOTE

      - name: Verify public API
        run: |
          set -euo pipefail
          echo '--- PUBLIC HEALTH ---'
          curl --fail --silent --show-error --max-time 20 https://ai.aliceq.ru/health
