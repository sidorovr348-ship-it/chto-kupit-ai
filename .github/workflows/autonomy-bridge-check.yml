name: Autonomy bridge verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify autonomy bridge and release controller
        run: node --test test-autonomy-integration.js test-autonomy-bridge.js test-autonomy-release-controller.js
      - name: Verify production syntax and existing tests
        run: |
          node --check local-gateway.js
          node --test test-local-gateway.js
