name: My AI Unified — production repair
on:
  push:
    branches: [main]
concurrency:
  group: my-ai-unified-production-repair
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - name: Repair production tunnel
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== LOCAL BACKEND ==='
          systemctl restart my-ai-unified
          for i in $(seq 1 30); do
            if systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/h.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json'))
          assert j.get('ok') and j.get('dispatcher'), j
          print('LOCAL_HEALTH_OK')
          PY
          curl -fsS --max-time 60 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/c.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json'))
          assert j.get('ok') and j.get('result'), j
          print('LOCAL_CHAT_OK',j.get('result'))
          PY

          echo '=== STOP ANY SYSTEMD QUICK-TUNNEL UNITS ==='
          while read -r unit; do
            [ -n "$unit" ] || continue
            execstart=$(systemctl show "$unit" -p ExecStart --value 2>/dev/null || true)
            case "$execstart" in
              *cloudflared*--url*)
                echo "STOPPING_QUICK_UNIT=$unit"
                systemctl disable --now "$unit" || true
                ;;
            esac
          done < <(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -i cloudflared || true)

          echo '=== KILL ALL STRAY QUICK TUNNELS ==='
          for n in 1 2 3; do
            pgrep -af 'cloudflared.*--url' || true
            pkill -9 -f 'cloudflared.*--url' || true
            sleep 1
          done

          echo '=== START ONLY NAMED TUNNEL ==='
          systemctl restart cloudflared
          sleep 6
          systemctl is-active --quiet cloudflared

          echo '=== VERIFY ONLY NAMED TUNNEL REMAINS ==='
          stray=$(pgrep -af 'cloudflared.*--url' || true)
          if [ -n "$stray" ]; then
            echo "$stray"
            echo 'ERROR: STRAY_QUICK_TUNNEL_REMAINS'
            exit 1
          fi
          ps aux | grep '[c]loudflared' || true

          echo '=== PUBLIC HEALTH ==='
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 8 https://ai.aliceq.ru/health >/tmp/ph.json; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/ph.json'))
          assert j.get('ok') and j.get('dispatcher'), j
          print('PUBLIC_HEALTH_OK')
          PY

          echo '=== PUBLIC CHAT ==='
          curl -fsS --retry 8 --retry-all-errors --retry-delay 1 --max-time 90 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/pc.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/pc.json'))
          assert j.get('ok') and j.get('result'), j
          print('PUBLIC_CHAT_OK',j.get('result'))
          PY

          echo '=== PUBLIC ALICE ==='
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 --max-time 90 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: АЛИСА_OK"},"session":{"session_id":"production-check"}}' >/tmp/pa.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/pa.json'))
          text=str(j.get('response',{}).get('text',''))
          assert text and j.get('session_state',{}).get('unified') is True, j
          print('ALICE_PUBLIC_OK',text)
          print('ALICE_UNIFIED',j['session_state']['unified'])
          PY
          echo 'PRODUCTION_CHAIN_OK'
          REMOTE
      - name: Publish Pages only after backend verification
        run: |
          set -euo pipefail
          rm -rf pages && mkdir pages
          cp index.html pages/index.html
          printf '%s\n' '{"ok":true,"api":"https://ai.aliceq.ru","verified":"production-chain"}' > pages/api.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - uses: actions/deploy-pages@v4
