name: My AI Unified — immediate browser repair
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: my-ai-unified-immediate-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: |
          set -euo pipefail
          node repair-now.js
          node --check local-gateway.js
          git diff --check
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html local-gateway.js
          if git diff --cached --quiet; then
            echo 'NO_REPAIR_CHANGES'
            exit 0
          fi
          git commit -m 'Repair browser API connectivity and voice fallback'
          git push origin HEAD:main
