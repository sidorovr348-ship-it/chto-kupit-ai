name: My AI Unified — provider fixer
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production deploy
        run: sleep 60
      - name: Force stable vision path
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "cd /root/my-ai-unified && sed -i 's/if(groq)try{/if(groq\\&\\&!vision)try{/' local-gateway.js && sed -i 's/qwen\\/qwen3\\.6-27b/qwen\\/qwen3.8-27b/g' local-gateway.js && systemctl restart my-ai-unified && curl -fsS --max-time 10 http://127.0.0.1:3020/health"
