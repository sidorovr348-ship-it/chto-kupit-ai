name: My AI Unified — provider fixer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Persist vision bypass in source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('local-gateway.js')
          s=p.read_text()
          s=s.replace('if(groq)try{','if(groq&&!vision)try{',1)
          s=s.replace('qwen/qwen3.6-27b','qwen/qwen3.8-27b')
          if 'if(groq&&!vision)try{' not in s:
              raise SystemExit('VISION_BYPASS_PATCH_FAILED')
          p.write_text(s)
          PY
          grep -o "if(groq[^)]*)try{" local-gateway.js | head -1
          if git diff --quiet -- local-gateway.js; then
            echo SOURCE_ALREADY_STABLE
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add local-gateway.js
            git commit -m 'Bypass Groq for vision requests'
            git push
          fi
      - name: Wait for production deploy
        run: sleep 60
      - name: Apply vision bypass on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'cd /root/my-ai-unified && python3 - <<"PY"
from pathlib import Path
p=Path("local-gateway.js")
s=p.read_text()
s=s.replace("if(groq)try{","if(groq&&!vision)try{",1)
s=s.replace("qwen/qwen3.6-27b","qwen/qwen3.8-27b")
if "if(groq&&!vision)try{" not in s: raise SystemExit("VISION_BYPASS_PATCH_FAILED")
p.write_text(s)
PY
node --check local-gateway.js && systemctl restart my-ai-unified && for i in $(seq 1 30); do if systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/h; then cat /tmp/h; exit 0; fi; sleep 1; done; systemctl status my-ai-unified --no-pager -l; exit 1'
