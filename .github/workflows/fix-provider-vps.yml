name: My AI Unified — keep live supported provider
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enforce supported vision model
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          sleep 25
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/root/my-ai-unified
          ENV=$APP/.local-ai.env
          test -f "$ENV"
          tmp=$(mktemp)
          grep -vE '^(GROQ_MODEL|GROQ_VISION_MODEL)=' "$ENV" > "$tmp" || true
          printf '%s\n' 'GROQ_MODEL=openai/gpt-oss-120b' 'GROQ_VISION_MODEL=qwen/qwen3.8-27b' >> "$tmp"
          mv "$tmp" "$ENV"
          python3 - <<'PY'
          p='/root/my-ai-unified/local-gateway.js'
          s=open(p,encoding='utf-8').read()
          import re
          s=re.sub(r"const GROQ_VISION_MODEL=[^;]+;", "const GROQ_VISION_MODEL=process.env.GROQ_VISION_MODEL||'qwen/qwen3.8-27b';", s, count=1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          systemctl restart my-ai-unified
          sleep 5
          systemctl is-active --quiet my-ai-unified
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:3020/health
          echo
          REMOTE
