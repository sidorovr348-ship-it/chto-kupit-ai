name: My AI Unified — fix Alice proxy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken Alice adapter with central dispatcher proxy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          mkdir -p /root/alice-ai
          if [ -f /root/alice-ai/server.js ] && ! grep -q 'MY_AI_UNIFIED_ALICE_PROXY_V1' /root/alice-ai/server.js; then
            cp -a /root/alice-ai/server.js "/root/alice-ai/server.js.backup.$(date +%Y%m%d-%H%M%S)"
          fi
          cat > /root/alice-ai/server.js <<'NODE'
          // MY_AI_UNIFIED_ALICE_PROXY_V1
          const express = require('express');
          const app = express();
          const PORT = Number(process.env.PORT || 3011);
          app.use(express.json({limit:'10mb'}));
          app.get('/health', (_req,res)=>res.json({ok:true,service:'alice-ai',unified:true,dispatcher:'127.0.0.1:3020'}));
          app.post('/alice', async (req,res)=>{
            try{
              const r = await fetch('http://127.0.0.1:3020/alice', {
                method:'POST',
                headers:{'content-type':'application/json','accept':'application/json'},
                body:JSON.stringify(req.body)
              });
              const text = await r.text();
              res.status(r.status).type('application/json').send(text);
            }catch(e){
              res.status(502).json({ok:false,error:'Alice dispatcher unavailable',detail:String(e?.message||e)});
            }
          });
          app.listen(PORT,'127.0.0.1',()=>console.log(`Alice unified proxy listening on 127.0.0.1:${PORT}`));
          NODE
          systemctl restart alice-ai
          sleep 2
          systemctl is-active --quiet alice-ai
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 -X POST http://127.0.0.1:3011/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: АЛИСА_PROXY_OK"},"session":{"session_id":"alice-proxy"}}' >/tmp/alice-proxy.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/alice-proxy.json')); text=str(j.get('response',{}).get('text',''))
          assert text,j
          print('LOCAL_ALICE_PROXY_OK',text)
          PY
          REMOTE
      - name: Verify public Alice
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 90 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: ПУБЛИЧНАЯ_АЛИСА_PROXY_OK"},"session":{"session_id":"alice-public-proxy"}}' >/tmp/public.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public.json')); text=str(j.get('response',{}).get('text',''))
          assert text,j
          print('PUBLIC_ALICE_PROXY_OK',text)
          PY
