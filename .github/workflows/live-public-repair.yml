name: My AI Unified — live public repair
on:
  push:
    branches: [main]
concurrency:
  group: my-ai-unified-live-repair
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and diagnose named Cloudflare tunnel
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== SERVICE ==='
          systemctl status cloudflared --no-pager -l
          echo '=== EXECSTART ==='
          systemctl show cloudflared -p ExecStart -p FragmentPath -p DropInPaths --no-pager
          echo '=== PROCESS ==='
          ps aux | grep '[c]loudflared'
          echo '=== CONFIG FILES ==='
          find /etc/cloudflared /root/.cloudflared -maxdepth 2 -type f -printf '%p\n' 2>/dev/null
          echo '=== LOCAL API ==='
          curl -i --max-time 10 http://127.0.0.1:3020/health
          echo '=== DNS FROM VPS ==='
          getent ahosts ai.aliceq.ru
          getent ahosts aliceq.ru
          echo '=== PUBLIC API FROM VPS ==='
          curl -vk --max-time 20 https://ai.aliceq.ru/health
          echo '=== PUBLIC ALICE FROM VPS ==='
          curl -vk --max-time 20 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: АЛИСА_OK"},"session":{"session_id":"live-repair"}}'
          echo '=== TUNNEL LOG ==='
          journalctl -u cloudflared -n 100 --no-pager -o cat
          REMOTE
      - name: Verify public API from GitHub runner
        run: |
          set -euo pipefail
          curl -vk --retry 5 --retry-all-errors --max-time 60 https://ai.aliceq.ru/health
          curl -vk --retry 5 --retry-all-errors --max-time 90 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}'
          curl -vk --retry 5 --retry-all-errors --max-time 60 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: АЛИСА_OK"},"session":{"session_id":"runner-live"}}'
