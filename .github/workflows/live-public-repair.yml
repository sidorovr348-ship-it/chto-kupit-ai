name: My AI Unified — verified deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: my-ai-unified-safe-canonical-deploy
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  live_repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          set -euo pipefail
          node --version
          node --check local-gateway.js
          node --test test-local-gateway.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('app-version') || !html.includes('https://ai.aliceq.ru')) throw new Error('frontend markers missing');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if(!scripts.length) throw new Error('frontend script missing');
          for(const s of scripts) new Function(s[1]);
          if(html.includes('finally{clearTimeout(tm)}},body:JSON.stringify')) throw new Error('known corrupted post() tail still present');
          if(html.includes('const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.error||\'Ошибка сервера HTTP \' +r.status);return j}catch')) throw new Error('duplicate broken fetch block still present');
          for(const id of ['send','voice','photo','camera','video','file','imagegen','sound','stop','clear','camAnalyze','camShot','camOff']) if(!html.includes('id="'+id+'"')) throw new Error('missing UI control '+id);
          console.log('FRONTEND_JS_OK');
          NODE
      - name: Deploy and verify My AI Unified
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=5 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          workdir=$(ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          test -n "$workdir"
          scp "${O[@]}" -q local-gateway.js "$VPS_USER@$VPS_HOST:$workdir/local-gateway.js"
          scp "${O[@]}" -q package.json "$VPS_USER@$VPS_HOST:$workdir/package.json"
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "WORKDIR='$workdir' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$WORKDIR"
          npm install --omit=dev --no-audit --no-fund
          node --check local-gateway.js
          systemctl restart my-ai-unified
          rm -f /tmp/h.json /tmp/c.json /tmp/tts.mp3
          for i in $(seq 1 30); do
            if systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/h.json; then break; fi
            sleep 1
          done
          test -s /tmp/h.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json'))
          assert j.get('ok') and j.get('dispatcher'), j
          a=j.get('adapters',{})
          assert a.get('groq'), j
          assert a.get('groqVision'), j
          assert a.get('tts'), j
          assert a.get('stt'), j
          assert a.get('search'), j
          assert a.get('documents'), j
          assert a.get('video'), j
          print('LOCAL_HEALTH_OK')
          PY
          curl -fsS --max-time 60 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/c.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json')); assert j.get('ok') and j.get('result'),j
          print('LOCAL_CHAT_OK')
          PY
          curl -fsS --max-time 40 -X POST http://127.0.0.1:3020/tts -H 'Content-Type: application/json' --data '{"text":"Привет. Это проверка голоса."}' -o /tmp/tts.mp3
          test -s /tmp/tts.mp3
          echo 'LOCAL_TTS_OK'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3020/transcribe -H 'Content-Type: application/json' --data '{}')" != "404"
          echo 'LOCAL_STT_ROUTE_OK'
          systemctl is-active --quiet cloudflared
          REMOTE
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 90 https://ai.aliceq.ru/health >/tmp/public-health.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-health.json')); assert j.get('ok') and j.get('dispatcher'),j
          a=j.get('adapters',{})
          assert a.get('groq') and a.get('groqVision') and a.get('stt') and a.get('search'),j
          print('PUBLIC_HEALTH_OK')
          PY
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --max-time 90 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/public-chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-chat.json')); assert j.get('ok') and j.get('result'),j
          print('PUBLIC_CHAT_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 -X POST https://ai.aliceq.ru/tts -H 'Content-Type: application/json' --data '{"text":"Привет. Это проверка голоса."}' -o /tmp/public-tts.mp3
          test -s /tmp/public-tts.mp3
          echo 'PUBLIC_TTS_OK'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST https://ai.aliceq.ru/transcribe -H 'Content-Type: application/json' --data '{}')" != "404"
          echo 'PUBLIC_STT_ROUTE_OK'
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: АЛИСА_OK"},"session":{"session_id":"production"}}' >/tmp/alice.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/alice.json')); assert j.get('response',{}).get('text'),j
          print('ALICE_PUBLIC_OK')
          PY
          echo 'CORE_CHAIN_OK'
      - name: Publish verified Pages
        run: |
          set -euo pipefail
          rm -rf pages && mkdir pages
          cp index.html pages/index.html
          printf '%s\n' '{"ok":true,"api":"https://ai.aliceq.ru","verified":"core-chain+frontend-syntax"}' > pages/api.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - uses: actions/deploy-pages@v4
