name: My AI Unified — backend intelligence hardening

on:
  push:
    branches: [main]
    paths:
      - 'local-gateway.js'
      - '.github/workflows/backend-intelligence-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch intelligence safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('local-gateway.js')
          s=p.read_text()

          old="const wantsSearch=q=>/(найди|найти|кто сейчас|что сейчас|сегодня|сейчас|последн|новост|источник|ссылк|актуальн|сколько стоит|какая цена|время в|курс|погода)/iu.test(q);"
          new="const wantsSearch=q=>/(найди|найти|кто сейчас|что сейчас|сегодня|сейчас|последн|новост|источник|ссылк|актуальн|обновл|на данный момент|прямо сейчас|сколько стоит|какая цена|время в|курс|погода|температур|прогноз|расписани|результат|событи|выпуск|версия)/iu.test(q);"
          if old not in s: raise SystemExit('wantsSearch target not found')
          s=s.replace(old,new,1)

          old="const wantsShopping=q=>/(где купить|купить|заказать|закажи|цена на|стоимость|в наличии|дешевле|самая низкая цена|магазин|продаж[ае]|сравни цены|подбери.*магазин|найди.*магазин|найди.*товар)/iu.test(q);"
          new="const wantsShopping=q=>/(где купить|купить|заказать|закажи|цена на|стоимость|в наличии|дешевле|самая низкая цена|самый дешёвый|самый дешевый|магазин|продаж[ае]|сравни цены|сравни.*вариант|подбери.*магазин|подбери.*товар|найди.*магазин|найди.*товар|есть ли в продаже|можно заказать)/iu.test(q);"
          if old not in s: raise SystemExit('wantsShopping target not found')
          s=s.replace(old,new,1)

          old="let price=x.price==null?priceFrom(`${src?.title||''} ${src?.snippet||''}`):Number(String(x.price).replace(/\\s/g,'').replace(',','.'));if(!Number.isFinite(price)||price<=0)price=null;return{title,store:String(x.store||''),price,currency:'RUB',availability:['in_stock','out_of_stock','unknown'].includes(x.availability)?x.availability:'unknown',url:allowed.has(x.url)?x.url:(src?.link||''),evidence:String(x.evidence||src?.snippet||'')}}"
          new="const sourceText=`${src?.title||''} ${src?.snippet||''}`;const evidence=String(x.evidence||src?.snippet||'');const sourcePrice=priceFrom(sourceText);const evidencePrice=priceFrom(evidence);const llmPrice=x.price==null?null:Number(String(x.price).replace(/\\s/g,'').replace(',','.'));let price=sourcePrice??evidencePrice; if(price==null&&Number.isFinite(llmPrice)&&llmPrice>0&&llmPrice<100000000) price=llmPrice; return{title,store:String(x.store||''),price,currency:'RUB',availability:['in_stock','out_of_stock','unknown'].includes(x.availability)?x.availability:'unknown',url:allowed.has(x.url)?x.url:(src?.link||''),evidence} }"
          if old not in s: raise SystemExit('price trust target not found')
          s=s.replace(old,new,1)

          old=".filter(x=>x.url&&x.title&&exactness(query,x.title)>=.25).map(x=>({...x,_score:exactness(query,x.title)-(likelyAccessory(x.title)?.5:0)})).filter(x=>x._score>0).sort((a,b)=>(b.price==null?-1:b.price)-(a.price==null?-1:a.price)||b._score-a._score).slice(0,12).map(({_score,...x})=>x);return{query,city,results:out.length?out:raw.map(x=>({title:x.title,store:'',price:priceFrom(`${x.title} ${x.snippet}`),currency:'RUB',availability:'unknown',url:x.link,evidence:x.snippet})),sources:raw}}"
          new=".filter(x=>x.url&&x.title&&exactness(query,x.title)>=.25).map(x=>({...x,_score:exactness(query,x.title)-(likelyAccessory(x.title)?.7:0)})).filter(x=>x._score>0).sort((a,b)=>{const av=x=>x.availability==='in_stock'?0:x.availability==='unknown'?1:2;const ai=av(a),bi=av(b);if(ai!==bi)return ai-bi;if(a.price==null&&b.price!=null)return 1;if(a.price!=null&&b.price==null)return -1;if(a.price!=null&&b.price!=null&&a.price!==b.price)return a.price-b.price;return b._score-a._score}).slice(0,12).map(({_score,...x})=>x);const fallback=raw.map(x=>({title:x.title,store:'',price:priceFrom(`${x.title} ${x.snippet}`),currency:'RUB',availability:'unknown',url:x.link,evidence:x.snippet,_score:exactness(query,x.title)-(likelyAccessory(x.title)?.7:0)})).filter(x=>x._score>.25&&!likelyAccessory(x.title)).sort((a,b)=>(a.price==null)-(b.price==null)||(a.price??1e15)-(b.price??1e15)||b._score-a._score).slice(0,12).map(({_score,...x})=>x);return{query,city,results:out.length?out:fallback,sources:raw}}"
          if old not in s: raise SystemExit('shopping ranking target not found')
          s=s.replace(old,new,1)

          old="const sys=`Ты — «Эй», My AI Unified: умный русскоязычный помощник. Твоя задача — реально решать задачу пользователя, а не отписываться шаблонами. Отвечай естественно, как живой компетентный собеседник. Учитывай предыдущие сообщения. Если нужна свежая информация, используй поиск. Если речь о покупке, сравнивай реальные найденные предложения. Если данных недостаточно — прямо скажи, чего не хватает. Никогда не выдумывай цены, наличие, ссылки, характеристики или результаты действий. Не упоминай внутренние модели, ключи, серверы и служебные детали.`;"
          new="const sys=`Ты — «Эй», My AI Unified: умный русскоязычный помощник, который должен не просто разговаривать, а доводить задачи до результата. Сначала пойми намерение пользователя и используй доступные результаты поиска, покупки, памяти, изображений, документов и других инструментов, если они нужны. Не заставляй пользователя повторять уже известные данные и не задавай лишних уточнений, если задачу можно выполнить сразу. Для актуальных фактов опирайся на свежие результаты поиска, а не на догадку. Для покупок сравнивай реальные предложения и отделяй товар от аксессуаров. Для сложной задачи разбивай работу на понятные шаги, выполняй их и сообщай результат. Если действие действительно невозможно, честно объясни конкретную причину и предложи ближайший рабочий вариант. Не выдумывай цены, наличие, ссылки, характеристики, местоположение, результаты действий или источники. Отвечай естественно, кратко и по делу, но достаточно подробно для решения задачи. Не упоминай внутренние модели, ключи, серверы и служебные детали.`;"
          if old not in s: raise SystemExit('system prompt target not found')
          s=s.replace(old,new,1)

          marker='// INTELLIGENCE_HARDENING_V1'
          if marker not in s: s+='\n'+marker+'\n'
          p.write_text(s)
          PY

      - name: Validate backend
        run: |
          node --check local-gateway.js
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('local-gateway.js','utf8');
          for(const x of ['INTELLIGENCE_HARDENING_V1','sourcePrice','likelyAccessory','самый дешёвый','актуальн']) if(!s.includes(x)) throw new Error('missing hardening marker: '+x);
          console.log('BACKEND_HARDENING_OK');
          NODE

      - name: Commit backend hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-gateway.js
          git diff --cached --quiet || git commit -m 'Harden smart routing and shopping results'
          git push
