name: My AI Unified — smart live smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployment and verify smart Pages
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 'https://sidorovr348-ship-it.github.io/chto-kupit-ai/?smoke='"$i" -o /tmp/live.html 2>/dev/null && grep -q 'My AI Unified' /tmp/live.html; then echo SMART_PAGES_OK; break; fi
            sleep 5
          done
          test -s /tmp/live.html
          grep -q 'MediaRecorder' /tmp/live.html
          grep -q '.zip' /tmp/live.html
          grep -q 'memoryId' /tmp/live.html
      - name: Verify public API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --max-time 90 https://ai.aliceq.ru/health >/tmp/h.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          assert all(j.get('adapters',{}).get(k) for k in ['groq','groqVision','search','tts','stt','documents','video','zip']),j
          print('HEALTH_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/chat.json')); assert j.get('ok') and j.get('result'),j; print('CHAT_OK')
          PY
      - name: Verify smart routing
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 120 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Кто ты?"}' >/tmp/who.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/who.json')); assert j.get('ok') and j.get('route')=='chat' and j.get('result'),j; print('CHAT_ROUTE_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 120 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Найди iPhone 18 Pro в Москве где купить дешевле"}' >/tmp/buy.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/buy.json')); assert j.get('ok') and j.get('route')=='shopping' and j.get('results'),j; print('SHOPPING_ROUTE_OK',len(j['results']))
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 120 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Найди свежую информацию о погоде в Москве сегодня"}' >/tmp/search.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/search.json')); assert j.get('ok') and j.get('route')=='search' and j.get('sources'),j; print('SEARCH_ROUTE_OK',len(j['sources']))
          PY
      - name: Verify ZIP archive reading
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/zip.json
          import io,zipfile,json,base64
          b=io.BytesIO()
          with zipfile.ZipFile(b,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('hello.txt','Это тест ZIP. Скажи, что файл найден.')
              z.writestr('data.json','{"ok":true,"source":"zip-smoke"}')
          print(json.dumps({'name':'smoke.zip','mime':'application/zip','file':'data:application/zip;base64,'+base64.b64encode(b.getvalue()).decode()}))
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 120 -X POST https://ai.aliceq.ru/document -H 'Content-Type: application/json' --data-binary @/tmp/zip.json >/tmp/zip-result.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/zip-result.json')); assert j.get('ok') and 'hello.txt' in j.get('result','') and 'data.json' in j.get('result',''),j
          print('ZIP_OK')
          PY
