name: Diagnose VPS now
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect My AI Unified
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== STATUS ==='
          systemctl status my-ai-unified --no-pager -l
          echo '=== PORT 3020 ==='
          ss -lntp | grep ':3020' || true
          echo '=== RESOURCES ==='
          df -h / || true
          free -h || true
          echo '=== OLLAMA MODELS ==='
          ollama list || true
          echo '=== ENV PRESENCE ==='
          awk -F= '/^[A-Z][A-Z0-9_]*=/{print $1}' /root/chto-kupit-ai.env 2>/dev/null | sort -u | grep -E '^(OPENROUTER|PARALON|OLLAMA|TTS|APP_)' || true
          echo '=== HEALTH ==='
          curl -i --max-time 8 http://127.0.0.1:3020/health || true
          echo '=== CHAT ==='
          curl -sS --max-time 70 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' || true
          echo
          echo '=== JOURNAL ==='
          journalctl -u my-ai-unified -n 80 --no-pager -o cat
          echo '=== FILE ==='
          wd=$(systemctl show -p WorkingDirectory --value my-ai-unified)
          echo "$wd"
          sed -n '1,260p' "$wd/local-gateway.js"
          REMOTE
