name: Diagnose VPS now
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repair and verify My AI Unified
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== BEFORE ==='
          systemctl status my-ai-unified --no-pager -l
          ss -lntp | grep ':3020' || true
          echo '=== RESTART ==='
          systemctl restart my-ai-unified
          sleep 4
          echo '=== AFTER ==='
          systemctl status my-ai-unified --no-pager -l
          ss -lntp | grep ':3020' || true
          echo '=== HEALTH ==='
          curl -sS -i --max-time 10 http://127.0.0.1:3020/health || true
          echo
          echo '=== CHAT ==='
          curl -sS -i --max-time 90 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' || true
          echo
          echo '=== TTS ==='
          curl -sS -i --max-time 60 -X POST http://127.0.0.1:3020/tts -H 'Content-Type: application/json' --data '{"text":"Привет. Это проверка голоса."}' -o /tmp/tts.headers -D - || true
          ls -lh /tmp/tts.headers 2>/dev/null || true
          echo '=== JOURNAL ==='
          journalctl -u my-ai-unified -n 160 --no-pager -o cat
          REMOTE
