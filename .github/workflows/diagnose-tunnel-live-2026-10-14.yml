name: Temporary live tunnel diagnosis
on:
  push:
    branches: [diagnose-tunnel-live-2026-10-14]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Inspect live backend and tunnel
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh -i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'set +e
            echo "=== UTC TIME ==="; date -u
            echo "=== LOCAL HEALTH ==="; curl -sS -m 8 -i http://127.0.0.1:3020/health | head -c 1800; echo
            echo "=== LISTENING PORTS ==="; ss -ltnp | grep -E ":(3020|3000|8080|11434|443)\\b" || true
            echo "=== SERVICE MAIN PIDS ==="; for u in my-ai-unified my-ai-unified-legacy alice-ai my-ai-unified-quick-tunnel cloudflared my-ai-unified-supervisor; do echo "--- $u ---"; systemctl show "$u.service" -p ActiveState -p MainPID -p ExecStart -p WorkingDirectory --no-pager 2>/dev/null; done
            echo "=== NODE PROCESSES ==="; ps -eo pid,ppid,%cpu,%mem,rss,etime,args --sort=-%cpu | grep -E "[n]ode|[o]llama|[c]loudflared" | head -n 20
            echo "=== SERVICE UNITS ==="; systemctl list-units --type=service --all --no-pager | grep -Ei "cloudflared|tunnel|alice|my-ai-unified" || true
            echo "=== UNIT FILES ==="; systemctl list-unit-files --type=service --no-pager | grep -Ei "cloudflared|tunnel|alice|my-ai-unified" || true
            echo "=== CLOUDFLARED PROCESSES ==="; pgrep -af cloudflared || true
            echo "=== CLOUD TUNNEL JOURNAL ==="; journalctl --since "30 minutes ago" --no-pager -n 100 -u cloudflared -u cloudflared-alice-ai -u alice-ai -u my-ai-unified-quick-tunnel.service 2>&1 | tail -n 100
            echo "=== BACKEND JOURNAL ==="; journalctl -u my-ai-unified --since "15 minutes ago" --no-pager -n 80
            echo "=== SUPERVISOR JOURNAL ==="; journalctl -u my-ai-unified-supervisor --since "15 minutes ago" --no-pager -n 80
            echo "=== LOCAL PETER I PROBE ==="; /usr/bin/time -f "local_peter_seconds=%e" curl -sS -m 22 -X POST http://127.0.0.1:3020/chat -H "Content-Type: application/json" --data "{\"prompt\":\"Кто такой Пётр Первый?\"}" | head -c 1100; echo
            echo "=== LOCAL GENERAL CHAT PROBE ==="; /usr/bin/time -f "local_general_seconds=%e" curl -sS -m 22 -X POST http://127.0.0.1:3020/chat -H "Content-Type: application/json" --data "{\"prompt\":\"Почему небо голубое? Ответь кратко.\"}" | head -c 1100; echo
            echo "=== LOCAL CHAT PROBE ==="; /usr/bin/time -f "local_chat_seconds=%e" curl -sS -m 24 -X POST http://127.0.0.1:3020/chat -H "Content-Type: application/json" --data "{\"prompt\":\"Эй что ты умеешь?\"}" | head -c 1000; echo
            echo "=== PUBLIC PETER I PROBE ==="; /usr/bin/time -f "public_peter_seconds=%e" curl -sS -m 22 -X POST https://ai.aliceq.ru/chat -H "Content-Type: application/json" --data "{\"prompt\":\"Кто такой Пётр Первый?\"}" | head -c 1100; echo
            echo "=== PUBLIC GENERAL CHAT PROBE ==="; /usr/bin/time -f "public_general_seconds=%e" curl -sS -m 22 -X POST https://ai.aliceq.ru/chat -H "Content-Type: application/json" --data "{\"prompt\":\"Почему небо голубое? Ответь кратко.\"}" | head -c 1100; echo
            echo "=== PUBLIC CHAT PROBE ==="; /usr/bin/time -f "public_chat_seconds=%e" curl -sS -m 24 -X POST https://ai.aliceq.ru/chat -H "Content-Type: application/json" --data "{\"prompt\":\"Эй что ты умеешь?\"}" | head -c 1000; echo
            echo "=== REPEATED PUBLIC CHAT PROBES ==="
            for n in 1 2 3 4; do echo "--- public_chat_probe_$n ---"; /usr/bin/time -f "public_chat_seconds=%e" curl -sS -m 22 -X POST https://ai.aliceq.ru/chat -H "Content-Type: application/json" --data "{\"prompt\":\"Эй что ты умеешь?\"}" | head -c 650; echo; sleep 2; done
            echo "=== PROVIDER SMOKE ==="
            node <<EOF
            const fs=require("fs");
            for(const file of ["/root/my-ai-unified/.local-ai.env","/root/chto-kupit-ai.env","/root/my-ai-unified/.env"]) if(fs.existsSync(file)){for(const line of fs.readFileSync(file,"utf8").split(/\r?\n/)){const m=line.match(/^([A-Z0-9_]+)=(.*)$/);if(m&&!process.env[m[1]]){let v=m[2].trim();if(v.startsWith("\"")&&v.endsWith("\""))v=v.slice(1,-1);process.env[m[1]]=v}}}
            async function probe(name,url,key,model){if(!key){console.log(JSON.stringify({name,skipped:"missing key"}));return}const t=Date.now();try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model,messages:[{role:"user",content:"Reply with OK"}],max_tokens:32}),signal:AbortSignal.timeout(8000)});const raw=await r.text();let j={};try{j=JSON.parse(raw)}catch{}console.log(JSON.stringify({name,status:r.status,ms:Date.now()-t,body:r.ok?String(j.choices?.[0]?.message?.content||"").slice(0,80):raw.slice(0,220)}))}catch(e){console.log(JSON.stringify({name,error:e.message,ms:Date.now()-t}))}}
            Promise.all([probe("deepseek","https://api.deepseek.com/chat/completions",process.env.DEEPSEEK_API_KEY,"deepseek-flash"),probe("paralon","https://paraloncloud.com/v1/chat/completions",process.env.PARALON_API_KEY||process.env.PARALON_KEY||process.env.PARALON_TOKEN,"qwen3.8-27b"),probe("mistral","https://api.mistral.ai/v1/chat/completions",process.env.MISTRAL_API_KEY||process.env.MISTRAL_KEY,"mistral-small-latest"),probe("groq","https://api.groq.com/openai/v1/chat/completions",process.env.GROQ_API_KEY,process.env.GROQ_MODEL||"llama-3.3-70b-versatile")]).then(()=>{});
          EOF
            echo "=== LOCAL OLLAMA ==="; curl -sS -m 3 http://127.0.0.1:11434/api/tags | head -c 1200; echo
            echo "=== MEMORY ==="; free -h; df -h /; '
          rm -f /tmp/vps_key

      - name: Install Playwright for live repeated-wake test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test three consecutive wake queries against live production UI
        shell: bash
        run: |
          set -euo pipefail
          node wake-buffer-e2e.mjs
