name: My AI Unified — connect Alice
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Alice is connected to the central Dispatcher
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"; test -n "$VPS_USER"; test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== CENTRAL ALICE ENDPOINT ==='
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 -X POST http://127.0.0.1:3020/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: ЦЕНТР_OK"},"session":{"session_id":"unify-central"}}' >/tmp/central-alice.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/central-alice.json')); text=str(j.get('response',{}).get('text',''))
          print('CENTRAL_ALICE_OK',text); assert text,j
          PY
          echo '=== ALICE SERVICE 3011 ==='
          systemctl is-active --quiet alice-ai
          curl --fail --silent --show-error --max-time 30 -X POST http://127.0.0.1:3011/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: АЛИСА_OK"},"session":{"session_id":"alice-local"}}' >/tmp/alice-local.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/alice-local.json')); text=str(j.get('response',{}).get('text',''))
          print('LOCAL_ALICE_OK',text); assert text,j
          PY
          echo '=== PUBLIC ALICE ==='
          curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 90 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: ПУБЛИЧНАЯ_АЛИСА_OK"},"session":{"session_id":"unify-public"}}' >/tmp/public-alice.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-alice.json')); text=str(j.get('response',{}).get('text',''))
          print('PUBLIC_ALICE_OK',text); assert text,j
          PY
          REMOTE
