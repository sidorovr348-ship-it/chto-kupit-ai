name: My AI Unified — final production verification v2
on:
  workflow_run:
    workflows: ["My AI Unified — production deploy v2"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Verify real production API
        run: |
          set -euo pipefail
          API='https://ai.aliceq.ru'
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 "$API/health" >/tmp/h.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          a=j.get('adapters',{}); assert all(a.get(k) for k in ['groq','groqVision','search','tts','stt','documents','video']),j
          print('HEALTH_OK',a)
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 -X POST "$API/search" -H 'Content-Type: application/json' --data '{"query":"iPhone 18 Pro Москва цена"}' >/tmp/s.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/s.json')); assert j.get('ok') and j.get('results'),j; print('SEARCH_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 120 -X POST "$API/shopping" -H 'Content-Type: application/json' --data '{"query":"Найди iPhone 18 Pro в Москве"}' >/tmp/shop.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/shop.json')); assert j.get('ok') and j.get('results'),j; print('SHOPPING_OK',len(j['results']))
          PY
          IMG='iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYElEQVR4nO3PQQ0AIBDAMMC/50MEj4ZkVbDtmVk/OzrgVQNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgPaBXKqA31N0fbGAAAAAElFTkSuQmCC'
          python3 - <<PY >/tmp/photo.json
          import json
          print(json.dumps({'images':['data:image/png;base64,'+'$IMG'],'prompt':'Опиши изображение одним коротким предложением.'},ensure_ascii=False))
          PY
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 180 -X POST "$API/photo" -H 'Content-Type: application/json' --data @/tmp/photo.json >/tmp/p.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/p.json')); assert j.get('ok') and j.get('result'),j; print('PHOTO_OK',j['result'][:120])
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$API/document" -H 'Content-Type: application/json' --data '{"name":"smoke.txt","mime":"text/plain","text":"Это тестовый документ. Ответь одним словом: ДОК_OK"}' >/tmp/d.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/d.json')); assert j.get('ok') and j.get('result'),j; print('DOCUMENT_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$API/tts" -H 'Content-Type: application/json' --data '{"text":"Проверка голоса."}' -o /tmp/t.mp3
          test -s /tmp/t.mp3 && echo TTS_OK
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 -X POST "$API/chat" -H 'Content-Type: application/json' --data '{"prompt":"Сколько времени в Москве сейчас? Ответь кратко и используй свежий поиск."}' >/tmp/time.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/time.json')); assert j.get('ok') and j.get('result'),j; print('LIVE_CHAT_OK')
          PY
      - name: Verify real browser UI, camera and photo
        env:
          APP_URL: https://sidorovr348-ship-it.github.io/chto-kupit-ai/
          API_URL: https://ai.aliceq.ru
        run: node browser-smoke.mjs
      - name: Verify Pages is current
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 "https://sidorovr348-ship-it.github.io/chto-kupit-ai/?verify=$(date +%s)" -o /tmp/live.html
          grep -q 'app-version' /tmp/live.html
          grep -q 'https://ai.aliceq.ru' /tmp/live.html
          echo PAGES_OK
