name: My AI Unified — photo production smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose live vision provider and photo endpoint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ENV=/root/my-ai-unified/.local-ai.env
          set -a
          . "$ENV"
          set +a
          python3 - <<'PY'
          import base64,json
          png=''
          body={'messages':[{'role':'user','content':[{'type':'text','text':'Что изображено? Ответь кратко.'},{'type':'image_url','image_url':{'url':'data:image/png;base64,'+png}}]}],'model':'qwen/qwen3.8-27b','temperature':0.7,'max_completion_tokens':512,'reasoning_effort':'none','reasoning_format':'hidden'}
          open('/tmp/v.json','w').write(json.dumps(body,ensure_ascii=False))
          open('/tmp/photo.json','w').write(json.dumps({'images':['data:image/png;base64,'+png],'prompt':'Что на изображении? Ответь кратко.'},ensure_ascii=False))
          PY
          echo '=== DIRECT GROQ VISION ==='
          curl -sS --max-time 90 -X POST https://api.groq.com/openai/v1/chat/completions -H "Authorization: Bearer $GROQ_API_KEY" -H 'Content-Type: application/json' --data-binary @/tmp/v.json -o /tmp/groq.out -w 'HTTP:%{http_code}\n'
          cat /tmp/groq.out | head -c 3000
          echo
          echo '=== LOCAL PHOTO ==='
          curl -sS --max-time 120 -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data-binary @/tmp/photo.json -o /tmp/photo.out -w 'HTTP:%{http_code}\n'
          cat /tmp/photo.out | head -c 3000
          echo
          REMOTE
