name: My AI Unified — photo production smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test live photo endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 https://ai.aliceq.ru/health >/tmp/h.json; then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json'))
          assert j.get('ok') and j.get('dispatcher'),j
          assert j.get('adapters',{}).get('groqVision'),j
          print('PHOTO_PUBLIC_HEALTH_OK')
          PY
          python3 - <<'PY'
          import base64,json
          png=base64.b64encode(bytes.fromhex('89504e470d0a1a0a0000000d4948445200000001000000010802000000907753de0000000c49444154789c6360606000000004000105f7f7d80000000049454e44ae426082')).decode()
          open('/tmp/photo.json','w').write(json.dumps({'images':['data:image/png;base64,'+png],'prompt':'Что на изображении? Ответь кратко.'},ensure_ascii=False))
          PY
          for i in $(seq 1 3); do
            if curl --fail --silent --show-error --max-time 120 -X POST https://ai.aliceq.ru/photo -H 'Content-Type: application/json' --data-binary @/tmp/photo.json >/tmp/photo.out; then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo.out'))
          assert j.get('ok') and str(j.get('result','')).strip(),j
          print('PHOTO_PUBLIC_OK')
          print('PHOTO_RESULT:',str(j['result'])[:500])
          PY
