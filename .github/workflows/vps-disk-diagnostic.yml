name: VPS read-only disk diagnostic

on:
  push:
    branches:
      - vps-disk-diagnostic-2026-11-08

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read-only VPS disk inventory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-vps-key.py
          chmod 600 /tmp/vps_key
          trap 'rm -f /tmp/vps_key /tmp/vps_key.pub' EXIT
          ssh-keygen -y -P "" -f /tmp/vps_key > /tmp/vps_key.pub
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "root@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== FILESYSTEM SPACE ==='
          df -hT /
          echo '=== FILESYSTEM INODES ==='
          df -i /
          echo '=== ALL ROOT DIRECTORY SIZES ==='
          timeout 90 du -xhd1 / 2>/dev/null | sort -h
          echo '=== HOME/USR/OPT SUBDIRECTORY SIZES ==='
          for p in /home/ghrunner /home/ghrunner/_work /home/ghrunner/_tool /home/ghrunner/.cache /usr/local /usr/local/lib /usr/share /usr/lib /opt /snap /boot /mnt; do
            if [ -d "$p" ]; then
              echo "--- $p ---"
              timeout 45 du -xhd1 "$p" 2>/dev/null | sort -h | tail -n 35
            fi
          done
          echo '=== APP AND DATA DIRECTORY SIZES ==='
          for p in /root/my-ai-unified /root/my-ai-unified-data /root/my-ai-unified/data /var/log /var/log/journal /var/cache/apt /var/lib; do
            if [ -d "$p" ]; then
              echo "--- $p ---"
              timeout 45 du -xhd1 "$p" 2>/dev/null | sort -h | tail -n 25
            fi
          done
          echo '=== LARGE FILES IN RUNNER AND USRLOCAL ==='
          timeout 60 find /home/ghrunner /usr/local /opt -xdev -type f -size +50M -printf '%s\t%p\n' 2>/dev/null | sort -n | tail -n 60
          echo '=== RUNNER SERVICES ==='
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'runner|actions|ghrunner|vpsbridge' | head -n 80 || true
          echo '=== PROCESS MEMORY SUMMARY ==='
          ps -eo pid,user,comm,%mem,%cpu --sort=-%mem | head -n 30
          echo '=== FILES LARGER THAN 50 MB ==='
          timeout 60 find /root /var /tmp -xdev -type f -size +50M -printf '%s\t%p\n' 2>/dev/null | sort -n | tail -n 50
          echo '=== OPEN DELETED FILES ==='
          if command -v lsof >/dev/null 2>&1; then
            timeout 20 lsof +L1 2>/dev/null | head -n 80
          else
            echo 'lsof not installed'
          fi
          echo '=== JOURNAL SIZE ==='
          journalctl --disk-usage 2>&1
          echo '=== DOCKER DISK USAGE ==='
          if command -v docker >/dev/null 2>&1; then docker system df 2>&1; else echo 'docker not installed'; fi
          echo '=== SERVICE STATUS (READ ONLY) ==='
          systemctl --no-pager --full status my-ai-unified 2>&1 | head -n 35
          echo '=== SELF-HOSTED RUNNER DIRECTORY ==='
          if [ -d /home/ghrunner/actions-runner ]; then
            timeout 60 du -xhd1 /home/ghrunner/actions-runner 2>/dev/null | sort -h
            for p in /home/ghrunner/actions-runner/_work /home/ghrunner/actions-runner/_work/_update /home/ghrunner/actions-runner/externals /home/ghrunner/actions-runner/externals.2.338.2 /home/ghrunner/actions-runner/_diag; do
              if [ -d "$p" ]; then
                echo "--- $p ---"
                timeout 45 du -xhd1 "$p" 2>/dev/null | sort -h | tail -n 35
              fi
            done
            echo '--- runner large files ---'
            timeout 45 find /home/ghrunner/actions-runner -maxdepth 4 -type f -size +100M -printf '%s\t%p\n' 2>/dev/null | sort -n | tail -n 40
            echo '--- runner directory entries ---'
            ls -lah /home/ghrunner/actions-runner | head -n 80
          fi
          echo '=== RUNNER SERVICE DETAILS ==='
          systemctl show actions.runner.sidorovr348-ship-it-chto-kupit-ai.vps-6810.service -p ActiveState -p SubState -p MainPID -p ExecStart -p WorkingDirectory 2>&1
          echo '=== RUNNER PROCESS DETAILS ==='
          ps -p 2233286 -o pid,user,etime,comm 2>&1
          readlink -f /proc/2233286/cwd 2>&1
          echo '=== RUNNER UPDATE METADATA ==='
          for p in /home/ghrunner/actions-runner/actions-runner-linux-x64-2.338.0.tar.gz /home/ghrunner/actions-runner/bin /home/ghrunner/actions-runner/bin.2.338.2 /home/ghrunner/actions-runner/externals /home/ghrunner/actions-runner/externals.2.338.2 /home/ghrunner/actions-runner/_work/_update; do
            if [ -e "$p" ]; then stat -c '%y %s %n' "$p"; fi
          done
          echo '--- update directory contents ---'
          ls -lah /home/ghrunner/actions-runner/_work/_update 2>&1 | head -n 60
          echo '--- runner listener/worker processes ---'
          ps -eo pid,ppid,user,etime,comm | grep -E 'Runner.Listener|Runner.Worker|MainThread' | grep -v grep || true
          echo '--- runner update log excerpts ---'
          if compgen -G '/home/ghrunner/actions-runner/_diag/Runner_*.log' >/dev/null; then
            grep -iE 'update|version|2\.338' /home/ghrunner/actions-runner/_diag/Runner_*.log 2>/dev/null | tail -n 80
          fi
          echo '=== DIAGNOSTIC COMPLETE; NO FILES WERE MODIFIED ==='
          REMOTE
