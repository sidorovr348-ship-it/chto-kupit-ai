name: My AI Unified — DeepSeek diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose provider without exposing key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== ENV FLAGS ==='
          for f in /root/my-ai-unified/.local-ai.env /root/chto-kupit-ai.env; do
            if [ -f "$f" ]; then
              if grep -q '^DEEPSEEK_API_KEY=' "$f"; then echo "$f: KEY_PRESENT"; else echo "$f: KEY_ABSENT"; fi
            else echo "$f: FILE_ABSENT"; fi
          done
          echo '=== DIRECT DEEPSEEK ==='
          node <<'NODE'
          const fs=require('fs'); const dotenv=require('dotenv');
          for(const f of ['/root/my-ai-unified/.local-ai.env','/root/chto-kupit-ai.env']) if(fs.existsSync(f)) dotenv.config({path:f,override:false});
          const map={'с':'c','С':'C','а':'a','А':'A','е':'e','Е':'E','о':'o','О':'O','р':'p','Р':'P','х':'x','Х':'X','у':'y','У':'Y','к':'k','К':'K','м':'m','М':'M','т':'t','Т':'T','в':'b','В':'B','н':'h','Н':'H'};
          const raw=String(process.env.DEEPSEEK_API_KEY||'').trim(); const key=[...raw].map(c=>map[c]||c).join('');
          console.log('KEY_LENGTH',key.length,'ASCII',/^[\\x21-\\x7E]+$/.test(key));
          if(!key) process.exit(3);
          const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify({model:'deepseek-v4-flash',messages:[{role:'user',content:'Ответь одним словом: ГОТОВО'}],max_tokens:16,temperature:0})});
          const t=await r.text(); console.log('HTTP',r.status); try{const d=JSON.parse(t); console.log('MESSAGE',String(d?.error?.message||d?.choices?.[0]?.message?.content||'NO_MESSAGE').slice(0,500));}catch{console.log('BODY',t.slice(0,500));}
          NODE
          echo '=== LOCAL CHAT ==='
          curl -sS --max-time 35 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ГОТОВО"}' || true
          echo
          echo '=== JOURNAL ==='
          journalctl -u my-ai-unified -n 50 --no-pager -o cat
          REMOTE
