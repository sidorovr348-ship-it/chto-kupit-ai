name: My AI Unified — current DeepSeek

on:
  push:
    branches: [main]
    paths:
      - 'local-gateway.js'
      - '.github/workflows/deepseek-current.yml'
      - '.deploy-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update DeepSeek model chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('local-gateway.js'); s=p.read_text()
          old="const TEXT_MODEL=process.env.DEEPSEEK_TEXT_MODEL||'deepseek-v4-flash'"
          new="const TEXT_MODEL=process.env.DEEPSEEK_TEXT_MODEL||'deepseek-flash'"
          if old not in s: raise SystemExit('DeepSeek default target not found')
          s=s.replace(old,new,1)
          old="for(const model of[TEXT_MODEL,'deepseek-chat'])"
          new="for(const model of[TEXT_MODEL,'deepseek-v4-flash','deepseek-v4-pro'])"
          if old not in s: raise SystemExit('DeepSeek fallback target not found')
          s=s.replace(old,new,1)
          marker='// DEEPSEEK_CURRENT_V1'
          if marker not in s: s+='\n'+marker+'\n'
          p.write_text(s)
          PY
          node --check local-gateway.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-gateway.js
          git diff --cached --quiet || git commit -m 'Use current DeepSeek model IDs'
          git push
