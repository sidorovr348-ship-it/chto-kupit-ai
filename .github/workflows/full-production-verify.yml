name: My AI Unified — full production verification
on:
  workflow_run:
    workflows: ["My AI Unified — verified deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Verify public API
        run: |
          set -euo pipefail
          API='https://ai.aliceq.ru'
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 "$API/health" >/tmp/health.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/health.json')); assert j.get('ok') and j.get('dispatcher'),j
          a=j.get('adapters',{}); required=['groq','groqVision','search','documents','video','tts','stt']; missing=[x for x in required if not a.get(x)]
          assert not missing, f'missing adapters: {missing}; health={j}'
          print('ADAPTERS_OK',a)
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 -X POST "$API/search" -H 'Content-Type: application/json' --data '{"query":"iPhone 18 Pro Москва цена"}' >/tmp/search.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/search.json')); assert j.get('ok') and j.get('results'),j; print('SEARCH_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 150 -X POST "$API/shopping" -H 'Content-Type: application/json' --data '{"query":"Найди iPhone 18 Pro в Москве"}' >/tmp/shopping.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/shopping.json')); assert j.get('ok') and j.get('results'),j; print('SHOPPING_OK',len(j['results']))
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 150 -X POST "$API/photo" -H 'Content-Type: application/json' --data '{"images":["data:image/jpeg;base64,"],"prompt":"Опиши изображение одним коротким предложением."}' >/tmp/photo.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo.json')); assert j.get('ok') and j.get('result'),j; print('PHOTO_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 150 -X POST "$API/document" -H 'Content-Type: application/json' --data '{"name":"smoke.txt","mime":"text/plain","text":"Это тестовый документ. Ответь одним словом: ДОК_OK"}' >/tmp/document.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/document.json')); assert j.get('ok') and j.get('result'),j; print('DOCUMENT_OK')
          PY
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 -X POST "$API/tts" -H 'Content-Type: application/json' --data '{"text":"Проверка голоса."}' -o /tmp/tts.mp3
          test -s /tmp/tts.mp3 && echo TTS_OK
      - name: Verify real browser
        env:
          APP_URL: https://sidorovr348-ship-it.github.io/chto-kupit-ai/
          API_URL: https://ai.aliceq.ru
        run: node browser-smoke.mjs
      - name: Verify deployed Pages version
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 "https://sidorovr348-ship-it.github.io/chto-kupit-ai/?verify=$(date +%s)" -o /tmp/live.html
          grep -q 'app-version' /tmp/live.html
          grep -q '2026-09-14-stable-2' /tmp/live.html
          grep -q 'https://ai.aliceq.ru' /tmp/live.html
          echo PAGES_VERSION_OK
