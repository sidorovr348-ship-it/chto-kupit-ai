name: Photo public smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["My AI Unified — production deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  photo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build valid JPEG payload
        run: |
          python3 - <<'PY' >/tmp/photo.json
          import base64,json
          b=base64.b64decode('')
          print(json.dumps({'images':['data:image/jpeg;base64,'+base64.b64encode(b).decode()],'prompt':'Кратко опиши изображение по-русски. Ответь одним предложением.'}))
          PY
      - name: Verify public photo
        run: |
          set -euo pipefail
          photo_ok=0
          for attempt in $(seq 1 32); do
            echo "PHOTO_ATTEMPT=$attempt"
            rm -f /tmp/photo.out
            curl --silent --show-error --max-time 120 -X POST 'https://ai.aliceq.ru/photo' -H 'Content-Type: application/json' --data-binary @/tmp/photo.json >/tmp/photo.out || true
            cat /tmp/photo.out || true
            if grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/photo.out; then photo_ok=1; break; fi
            if grep -qi '502\|rate limit\|try again in\|429\|temporarily' /tmp/photo.out; then sleep 30; continue; fi
            break
          done
          test "$photo_ok" = 1
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo.out'))
          assert j.get('ok') and j.get('result'), j
          print('PHOTO_OK',j.get('provider'),j.get('model'))
          PY
