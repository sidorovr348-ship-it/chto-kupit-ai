name: My AI Unified — real photo smoke test
on:
  workflow_run:
    workflows: ["My AI Unified — production deploy v3 smart"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify real photo endpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, struct, zlib
          w=h=160
          raw=b''.join(b'\x00'+bytes([240,80,80])*w for _ in range(h))
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          open('/tmp/smoke.png','wb').write(png)
          print(base64.b64encode(png).decode())
          PY
          IMG=$(base64 -w0 /tmp/smoke.png)
          printf '%s' "$IMG" | wc -c
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 180 \
            -X POST https://ai.aliceq.ru/photo \
            -H 'Content-Type: application/json' \
            --data "{\"images\":[\"data:image/png;base64,$IMG\"],\"prompt\":\"Проверка зрения. Опиши цвет и что находится на изображении. Ответь по-русски.\"}" >/tmp/photo.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo.json'))
          assert j.get('ok') and isinstance(j.get('result'),str) and j['result'].strip(), j
          print('PUBLIC_PHOTO_OK')
          print(j['result'][:1000])
          PY