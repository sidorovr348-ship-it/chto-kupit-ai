name: My AI Unified — publish current iPhone frontend
on:
  workflow_run:
    workflows: ["My AI Unified — production deploy v3 smart"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate current frontend
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const x=h.match(/<script>([\s\S]*?)<\/script>/i);
          if(!x) throw Error('script missing');
          new Function(x[1]);
          for(const s of ['MediaRecorder','/transcribe','getUserMedia','Слушаю…']) if(!h.includes(s)) throw Error('missing '+s);
          console.log('CURRENT_FRONTEND_OK');
          NODE
      - name: Publish current frontend
        run: |
          set -euo pipefail
          rm -rf pages && mkdir pages
          cp index.html pages/index.html
          printf '%s\n' '{"ok":true,"api":"https://ai.aliceq.ru","version":"ey-2026-09-15"}' > pages/api.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
