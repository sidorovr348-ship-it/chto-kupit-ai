name: memory-and-map
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[memory-map-bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend and frontend
        shell: python
        run: |
          from pathlib import Path
          p=Path('local-gateway.js'); s=p.read_text()
          if "require('./memory-map')" not in s:
              s=s.replace("const path=require('path');", "const path=require('path');\nconst {memoryMiddleware,memoryRoutes}=require('./memory-map');", 1)
              marker="app.get('/health'"
              if marker not in s: raise SystemExit('health route not found')
              s=s.replace(marker, "app.use(memoryMiddleware);\nmemoryRoutes(app);\n"+marker, 1)
              p.write_text(s)
          for fn in ['smart-index.html','index.html']:
            q=Path(fn)
            if not q.exists(): continue
            x=q.read_text()
            if 'my-ai-memory-id-v1' not in x:
              x=x.replace("const API='https://ai.aliceq.ru'", "const API='https://ai.aliceq.ru',MEMORY_KEY='my-ai-memory-id-v1',MEMORY_ID=localStorage.getItem(MEMORY_KEY)||(crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2)));localStorage.setItem(MEMORY_KEY,MEMORY_ID)", 1)
            if 'let loc={}' not in x:
              x=x.replace("let shop=/(найди|найти|где купить", "let loc={};if(/запомни.*местоположени|построй.*маршрут/iu.test(t)&&navigator.geolocation){loc=await new Promise(r=>navigator.geolocation.getCurrentPosition(p=>r({location:{lat:p.coords.latitude,lon:p.coords.longitude}}),()=>r({}),{enableHighAccuracy:true,timeout:5000,maximumAge:60000}))}let shop=/(найди|найти|где купить", 1)
            x=x.replace("api('/chat',{prompt:t,messages}", "api('/chat',{prompt:t,messages,memoryId:MEMORY_ID,...loc}", 1)
            if 'j.routeUrl' not in x:
              x=x.replace("if(j.results){", "if(j.routeUrl){let d=add(j.result||'Маршрут построен.');let a=document.createElement('a');a.href=j.routeUrl;a.target='_blank';a.rel='noopener';a.textContent='🗺️ Открыть маршрут на карте';d.append(a);say(j.result||'Маршрут построен.')}else if(j.results){", 1)
            q.write_text(x)
      - name: Validate
        run: |
          node --check local-gateway.js
          node --check memory-map.js
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['smart-index.html','index.html']){
            if(!fs.existsSync(f)) continue;
            const h=fs.readFileSync(f,'utf8'),x=h.match(/<script>([\s\S]*?)<\/script>/i);
            if(!x) throw Error('script missing in '+f);
            new Function(x[1]);
            if(!h.includes('MEMORY_ID')) throw Error('memory id missing in '+f);
          }
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-gateway.js smart-index.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add persistent AI memory and map routes [memory-map-bot]"
          git push
