name: My AI Unified — intelligence upgrade

on:
  push:
    branches: [main]
    paths:
      - 'smart-index.html'
      - '.github/workflows/intelligence-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove dumb client intent routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('smart-index.html')
          s=p.read_text()
          old="let shop=/(найди|найти|где купить|купить|цена|стоимость|в наличии|магазин|закаж|дешевле|сравни|товар|телефон|телевизор|стиральн|карниз|iphone|айфон)/iu.test(t);let j=shop?await api('/shopping',{query:t},150000):await api('/chat',{prompt:t,messages,memoryId:MEMORY_ID,...loc},150000);"
          new="let j=await api('/chat',{prompt:t,messages,memoryId:MEMORY_ID,...loc},180000);"
          if old not in s:
              raise SystemExit('Expected client dispatcher was not found; refusing unsafe rewrite')
          s=s.replace(old,new,1)
          marker='<!-- INTELLIGENCE_ROUTING_V2 -->'
          if marker not in s:
              s += '<script>'+marker+'\n// All user requests now enter the AI dispatcher. The server decides when to search, shop, use memory or answer directly.\n</script>'
          p.write_text(s)
          PY

      - name: Validate frontend
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('smart-index.html','utf8');
          if(!s.includes("api('/chat'")) throw new Error('chat route missing');
          if(s.includes("let shop=/(найди|найти")) throw new Error('dumb shopping dispatcher still present');
          if(!s.includes('MEMORY_ID')) throw new Error('memory id missing');
          if(!s.includes('EY_WAKE_WORD_V1')) throw new Error('wake word missing');
          console.log('frontend intelligence checks: OK');
          NODE

      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-index.html
          git diff --cached --quiet || git commit -m 'Route all requests through smart AI dispatcher'
          git push
