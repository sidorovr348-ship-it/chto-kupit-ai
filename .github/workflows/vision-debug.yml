name: My AI Unified — vision diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose public vision endpoint
        run: |
          set -euo pipefail
          IMG=''
          python3 - <<PY
          import json,subprocess
          body=json.dumps({'images':['data:image/jpeg;base64,'+'$IMG'],'prompt':'Опиши изображение одним коротким предложением.'},ensure_ascii=False)
          p=subprocess.run(['curl','-sS','--max-time','120','-X','POST','https://ai.aliceq.ru/photo','-H','Content-Type: application/json','--data',body],capture_output=True,text=True)
          print('HTTP_EXIT',p.returncode)
          print('RESPONSE',p.stdout[:5000])
          if p.stderr: print('STDERR',p.stderr[:2000])
          PY
