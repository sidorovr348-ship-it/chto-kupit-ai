name: My AI Unified — vision diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose public and VPS vision endpoint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=5 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          workdir=$(ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "WORKDIR='$workdir' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$WORKDIR"
          echo '--- HEALTH ---'
          curl -sS http://127.0.0.1:3020/health; echo
          echo '--- PHOTO TEST ---'
          python3 - <<'PY' >/tmp/photo-body.json
          import json
          img='data:image/jpeg;base64,'
          print(json.dumps({'images':[img],'prompt':'Опиши изображение одним коротким предложением.'},ensure_ascii=False))
          PY
          echo 'LOCAL_RESPONSE:'
          curl -sS --max-time 120 -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data @/tmp/photo-body.json; echo
          echo '--- JOURNAL ---'
          journalctl -u my-ai-unified -n 100 --no-pager || true
          REMOTE
          echo '--- PUBLIC_RESPONSE ---'
          curl -sS --max-time 120 -X POST https://ai.aliceq.ru/photo -H 'Content-Type: application/json' --data @<(printf '%s' '{"images":["data:image/jpeg;base64,"],"prompt":"Опиши изображение одним коротким предложением."}' ) || true
          echo
