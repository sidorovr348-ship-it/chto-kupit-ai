name: My AI Unified — current time routing hotfix
on:
  workflow_run:
    workflows: ["My AI Unified — authoritative production verification"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: my-ai-unified-time-hotfix
  cancel-in-progress: true
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend time handling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='CURRENT_TIME_UI_V1'
          if marker not in s:
              needle="async function send(){const text=input.value.trim();if(!text||busy)return;add(text,'user');"
              replacement="""async function send(){const text=input.value.trim();if(!text||busy)return;
          if(/\\b(сколько\\s+времени|который\\s+час|текущее\\s+время|сейчас\\s+время|время\\s+в|времени\\s+в)\\b/iu.test(text)){
          add(text,'user');input.value='';const now=new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());const result=`Сейчас в Москве ${now}.`;messages.push({role:'user',content:text},{role:'assistant',content:result});rich(result);speak(result);return;
          }
          add(text,'user');"""
              if needle not in s: raise SystemExit('SEND_TARGET_NOT_FOUND')
              s=s.replace(needle,replacement,1)
              s=s.replace("<meta name=\"app-version\" content=\"2026-09-15-voice-fix\">","<meta name=\"app-version\" content=\"2026-09-15-voice-fix-time\">",1)
              s=s.replace('</script></body>','const CURRENT_TIME_UI_V1=true;</script></body>',1)
              p.write_text(s)
              print('CURRENT_TIME_UI_PATCH_OK')
          else:
              print('CURRENT_TIME_UI_ALREADY_PRESENT')
          PY
          grep -q 'CURRENT_TIME_UI_V1' index.html
          grep -q 'timeZone:\x27Europe/Moscow\x27' index.html
      - name: Publish patched Pages
        run: |
          set -euo pipefail
          rm -rf pages
          mkdir pages
          cp index.html pages/index.html
          printf '%s\n' '{"ok":true,"api":"https://ai.aliceq.ru","verified":"production-v2-time-ui"}' > pages/api.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
      - name: Verify published page
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --max-time 60 https://sidorovr348-ship-it.github.io/chto-kupit-ai/ -o /tmp/index.html
          grep -q 'CURRENT_TIME_UI_V1' /tmp/index.html
          grep -q 'Europe/Moscow' /tmp/index.html
          echo 'PUBLIC_TIME_UI_OK'