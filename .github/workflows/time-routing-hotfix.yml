name: My AI Unified — current time routing hotfix
on:
  workflow_run:
    workflows: ["My AI Unified — authoritative production verification"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: my-ai-unified-time-hotfix
  cancel-in-progress: true
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend answer display
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='CURRENT_TIME_LOCATION_UI_V3'
          if marker not in s:
              s=s.replace("const API='https://ai.aliceq.ru';", "const API='https://ai.aliceq.ru';let userLocation=null,locationState='unknown';async function requestUserLocation(){if(!navigator.geolocation){locationState='unsupported';return null}return await new Promise(resolve=>navigator.geolocation.getCurrentPosition(pos=>{userLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};locationState='granted';resolve(userLocation)},()=>{locationState='denied';resolve(null)},{enableHighAccuracy:true,maximumAge:60000,timeout:10000}))}")
              s=s.replace("for(const s of sources||[]){if(/^https?:\\/\\//i.test(String(s?.link||''))){const a=document.createElement('a');a.href=s.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Источник: '+(s.title||s.link);d.appendChild(a)}}", "")
              s=s.replace("if(x.evidence){const ev=document.createElement('div');ev.className='muted';ev.textContent='Источник: '+x.evidence;d.appendChild(ev)}", "")
              s=s.replace("async function send(){const text=input.value.trim();if(!text||busy)return;add(text,'user');input.value='';messages.push({role:'user',content:text});const w=add('⏳ Выполняю…');busy=true;try{const j=purchase(text)?await post('/shopping',{query:text},120000):await post('/chat',{prompt:text,messages},120000);", "async function send(){const text=input.value.trim();if(!text||busy)return;add(text,'user');input.value='';messages.push({role:'user',content:text});const w=add('⏳ Выполняю…');busy=true;try{if(locationState==='unknown')await requestUserLocation();const locationContext=userLocation?`\\n\\nТочное местоположение пользователя: широта ${userLocation.latitude}, долгота ${userLocation.longitude}, точность около ${Math.round(userLocation.accuracy)} м. Используй его для локальных рекомендаций, погоды, ближайших мест и других задач, где местоположение важно.`:'';const j=purchase(text)?await post('/shopping',{query:text,location:userLocation},120000):await post('/chat',{prompt:text+locationContext,messages},120000);")
              needle="if(/\\b(сколько\\s+времени|который\\s+час|текущее\\s+время|сейчас\\s+время|время\\s+в|времени\\s+в)\\b/iu.test(text))"
              if needle not in s:
                  needle2="async function send(){const text=input.value.trim();if(!text||busy)return;"
                  replacement2="""async function send(){const text=input.value.trim();if(!text||busy)return;
          if(/\\b(сколько\\s+времени|который\\s+час|текущее\\s+время|сейчас\\s+время|время\\s+в|времени\\s+в)\\b/iu.test(text)){
          add(text,'user');input.value='';const now=new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());const result=`Сейчас в Москве ${now}.`;messages.push({role:'user',content:text},{role:'assistant',content:result});rich(result);speak(result);return;
          }
          add(text,'user');"""
                  if needle2 not in s: raise SystemExit('SEND_TARGET_NOT_FOUND')
                  s=s.replace(needle2,replacement2,1)
              s=s.replace("<div class=\"status\" id=\"status\">🟡 Проверяю сервер…</div>","<div class=\"status\" id=\"status\">🟡 Проверяю сервер…</div><div class=\"diag\" id=\"locationStatus\">📍 Местоположение: запрашивается…</div>",1)
              s=s.replace("check();</script></body></html>","requestUserLocation().then(()=>{const el=document.querySelector('#locationStatus');if(el)el.textContent=locationState==='granted'?'🟢 Местоположение доступно ассистенту':'🟡 Местоположение не разрешено — разреши его в Safari для локальных запросов'});check();const CURRENT_TIME_LOCATION_UI_V3=true;</script></body></html>",1)
              p.write_text(s)
              print('CURRENT_TIME_LOCATION_UI_V3_OK')
          else:
              print('CURRENT_TIME_LOCATION_UI_V3_ALREADY_PRESENT')
          PY
          grep -q 'CURRENT_TIME_LOCATION_UI_V3' index.html
          grep -q 'navigator.geolocation' index.html
          grep -q 'Europe/Moscow' index.html
          if grep -q "Источник:" index.html; then echo 'SOURCE_TEXT_PRESENT_IN_SOURCE'; else echo 'SOURCE_TEXT_NOT_PRESENT_IN_SOURCE'; fi
      - name: Publish patched Pages
        run: |
          set -euo pipefail
          rm -rf pages
          mkdir pages
          cp index.html pages/index.html
          printf '%s\n' '{"ok":true,"api":"https://ai.aliceq.ru","verified":"production-v2-clean-answer-ui"}' > pages/api.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
      - name: Verify published page
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --max-time 60 https://sidorovr348-ship-it.github.io/chto-kupit-ai/ -o /tmp/index.html
          grep -q 'CURRENT_TIME_LOCATION_UI_V3' /tmp/index.html
          grep -q 'navigator.geolocation' /tmp/index.html
          grep -q 'Europe/Moscow' /tmp/index.html
          if grep -q "Источник: '" /tmp/index.html; then echo 'PUBLIC_SOURCE_LINK_PRESENT'; exit 1; fi
          echo 'PUBLIC_CLEAN_ANSWER_UI_OK'