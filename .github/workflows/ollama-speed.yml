name: Ollama speed check
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure Ollama response
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -e
          /usr/bin/time -f 'OLLAMA_SECONDS=%e' curl --fail --silent --show-error --max-time 25 -X POST http://127.0.0.1:11434/api/chat -H 'Content-Type: application/json' --data '{"model":"qwen3:0.6b","messages":[{"role":"user","content":"Ответь одним словом: ОК"}],"stream":false,"think":false,"options":{"temperature":0.2,"num_predict":16}}'
          echo
          REMOTE