name: My AI Unified — vision verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["My AI Unified — production deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  vision:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public photo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/photo.json
          import json
          print(json.dumps({
              'images': ['https://docs.mistral.ai/img/eiffel-tower-paris.jpg'],
              'prompt': 'Кратко опиши это изображение. Ответь по-русски.'
          }))
          PY
          curl --fail --silent --show-error --max-time 120 -X POST 'https://ai.aliceq.ru/photo' -H 'Content-Type: application/json' --data-binary @/tmp/photo.json >/tmp/photo.out
          cat /tmp/photo.out
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo.out'))
          assert j.get('ok') and j.get('result'), j
          print('VISION_PUBLIC_OK', j.get('provider'), j.get('model'))
          PY
          rm -f /tmp/photo.json /tmp/photo.out
