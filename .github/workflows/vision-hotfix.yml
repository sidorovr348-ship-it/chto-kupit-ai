name: My AI Unified — vision hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Switch vision model and verify
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh_opts=(-i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15)
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "systemctl set-environment GROQ_VISION_MODEL=qwen/qwen3.6-27b && systemctl restart my-ai-unified"
          for i in $(seq 1 30); do
            if ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "curl -fsS http://127.0.0.1:3020/health >/tmp/vision-health.json"; then break; fi
            sleep 1
          done
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "cat /tmp/vision-health.json"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "python3 - <<'PY'\nimport json,base64\nb=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFklEQVR4nGP8z8DAwMDAxMDAwMDAAAANHQEDasKb6QAAAABJRU5ErkJggg==')\nopen('/tmp/photo.json','w').write(json.dumps({'images':['data:image/png;base64,'+base64.b64encode(b).decode()],'prompt':'Кратко опиши это изображение. Ответь по-русски.'}))\nPY\ncurl -sS -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data-binary @/tmp/photo.json; echo; journalctl -u my-ai-unified -n 20 --no-pager | tail -20"
          rm -f /tmp/vps_key
