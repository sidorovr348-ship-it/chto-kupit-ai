name: My AI Unified — vision hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  hotfix:
    if: contains(github.event.head_commit.message, '[vision-hotfix]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Wait for normal production deploy
        run: sleep 60
      - name: Patch VPS vision provider and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=5 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          workdir=$(ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          test -n "$workdir"
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "WORKDIR='$workdir' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$WORKDIR"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('local-gateway.js')
          s=p.read_text()
          s=s.replace('qwen/qwen3.8-27b','qwen/qwen3.6-27b')
          p.write_text(s)
          env=Path('/root/my-ai-unified/.local-ai.env')
          if env.exists():
              e=env.read_text()
              e=re.sub(r'^GROQ_VISION_MODEL=.*$', 'GROQ_VISION_MODEL=qwen/qwen3.6-27b', e, flags=re.M)
              if 'GROQ_VISION_MODEL=' not in e: e+='\nGROQ_VISION_MODEL=qwen/qwen3.6-27b\n'
              env.write_text(e)
          PY
          node --check local-gateway.js
          systemctl restart my-ai-unified
          for i in $(seq 1 30); do systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/h.json && break; sleep 1; done
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/h.json')); assert j.get('ok') and j.get('dispatcher'),j
          print('LOCAL_HEALTH_OK')
          PY
          python3 - <<'PY'
          import base64,json
          png=''
          open('/tmp/photo.json','w').write(json.dumps({'images':['data:image/png;base64,'+png],'prompt':'Что изображено на фотографии? Ответь кратко по-русски.'},ensure_ascii=False))
          PY
          PHOTO_CODE=$(curl -sS --max-time 120 -o /tmp/photo.out -w '%{http_code}' -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data-binary @/tmp/photo.json)
          cat /tmp/photo.out
          test "$PHOTO_CODE" = 200
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo.out')); assert j.get('ok') and str(j.get('result','')).strip(),j
          print('LOCAL_PHOTO_OK',j.get('provider'),j.get('model'))
          PY
          curl -fsS --max-time 90 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ОК"}' >/tmp/c.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/c.json')); assert j.get('ok') and j.get('result'),j; print('LOCAL_CHAT_OK')
          PY
          curl -fsS --max-time 30 -X POST http://127.0.0.1:3020/search -H 'Content-Type: application/json' --data '{"query":"iPhone 18 Pro Москва цена"}' >/tmp/s.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/s.json')); assert j.get('ok') and j.get('results'),j; print('LOCAL_SEARCH_OK')
          PY
          curl -fsS --max-time 120 -X POST http://127.0.0.1:3020/shopping -H 'Content-Type: application/json' --data '{"query":"Найди iPhone 18 Pro в Москве"}' >/tmp/sh.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/sh.json')); assert j.get('ok') and j.get('results'),j; print('LOCAL_SHOPPING_OK')
          PY
          curl -fsS --max-time 90 -X POST http://127.0.0.1:3020/document -H 'Content-Type: application/json' --data '{"name":"smoke.txt","mime":"text/plain","text":"Это тестовый документ. Ответь одним словом: ДОК_OK"}' >/tmp/d.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/d.json')); assert j.get('ok') and j.get('result'),j; print('LOCAL_DOCUMENT_OK')
          PY
          REMOTE
      - name: Commit verified vision model back to source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sed -i 's/qwen\/qwen3\.8-27b/qwen\/qwen3.6-27b/g' local-gateway.js
          git add local-gateway.js
          git diff --cached --quiet && echo 'SOURCE_ALREADY_FIXED' || git commit -m 'fix: use qwen3.6 vision model for stable photo analysis'
          git push
