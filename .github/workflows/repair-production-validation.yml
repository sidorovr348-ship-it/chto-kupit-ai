name: Repair production validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-production-validation.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make frontend validation robust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/production-deploy-v2.yml')
          s=p.read_text(encoding='utf-8')
          old="""          const x=h.match(/<script>([\s\S]*?)<\/script>/i); if(!x) throw Error('smart frontend script missing');
          new Function(x[1]);
"""
          new="""          const scripts=[...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]); if(!scripts.length) throw Error('smart frontend script missing');
          require('fs').writeFileSync('/tmp/frontend-scripts.js',scripts.join('\n;\n'));
"""
          if old not in s: raise SystemExit('validation block not found')
          s=s.replace(old,new,1)
          old2="          console.log('SOURCE_OK');"
          new2="          console.log('SOURCE_HTML_OK');"
          if old2 in s: s=s.replace(old2,new2,1)
          # Triggered deliberately after the workflow file existed.
          needle="          NODE\n          node --test test-local-gateway.js"
          repl="          NODE\n          node --check /tmp/frontend-scripts.js\n          node --test test-local-gateway.js"
          if needle not in s: raise SystemExit('NODE validation anchor not found')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/production-deploy-v2.yml
          git commit -m 'Repair production frontend validation'
          git push
