name: My AI Unified — authoritative production verification
on:
  workflow_run:
    workflows: ["My AI Unified — production deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          set -euo pipefail
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify complete production stack
        run: |
          set -euo pipefail
          sleep 10
          node production-acceptance.mjs
      - name: Verify mobile frontend source
        env:
          APP_URL: https://sidorovr348-ship-it.github.io/chto-kupit-ai/
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 60 "$APP_URL?verify=$(date +%s)" -o /tmp/live.html
          grep -q 'MediaRecorder' /tmp/live.html
          grep -q 'getUserMedia' /tmp/live.html
          grep -q '.zip' /tmp/live.html
          grep -q 'https://ai.aliceq.ru' /tmp/live.html
          grep -q 'generate-image' /tmp/live.html
          grep -q '/chat' /tmp/live.html
          echo SMART_PAGES_OK
      - name: Verify source syntax
        run: |
          node --check local-gateway.js
          node --check memory-map.js
          node --check production-acceptance.mjs
          node - <<'NODE'
          const fs=require('fs'); const h=fs.readFileSync('smart-index.html','utf8'); const x=h.match(/<script>([\s\S]*?)<\/script>/i); if(!x) throw Error('script missing'); new Function(x[1]); console.log('SMART_SOURCE_JS_OK');
          NODE
