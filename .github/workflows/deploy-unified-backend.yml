name: Deploy My AI Unified backend

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'src/**'
      - 'supervisor.js'
      - 'supervisor-daemon.js'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/deploy-unified-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy changed backend files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.VPS_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/my-ai-unified
          stamp=$(date +%Y%m%d-%H%M%S)
          cp -f server.js "server.js.backup-autonomous-$stamp" || true
          git fetch origin main
          git checkout origin/main -- server.js src/dispatcher.js
          mkdir -p scripts
          git show origin/main:server.js > server.js
          git show origin/main:src/dispatcher.js > src/dispatcher.js
          git show origin/main:src/capabilities.json > src/capabilities.json
          git show origin/main:src/document-tools.js > src/document-tools.js
          git show origin/main:supervisor.js > supervisor.js
          git show origin/main:scripts/bootstrap-free-openrouter.js > scripts/bootstrap-free-openrouter.js
          node --check server.js
          node --check src/dispatcher.js
          node --check src/document-tools.js
          node --check supervisor.js
          node scripts/bootstrap-free-openrouter.js
          node --check server.js
          npm test
          systemctl restart my-ai-unified.service
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/my-ai-health.json 2>/dev/null; then break; fi
            [ "$i" = 45 ] && { systemctl status my-ai-unified.service --no-pager || true; journalctl -u my-ai-unified.service -n 80 --no-pager || true; exit 1; }
            sleep 2
          done
          cat /tmp/my-ai-health.json
          echo
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3020/openrouter/health
          echo
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/my-ai-health.json'))
          assert j.get('ok') is True, j
          assert j.get('dispatcher') is True, j
          for x in ['chat','vision','image_generation','video','web_search','documents','tables','shopping','voice','code','verification']:
              assert x in j.get('capabilities',[]), x
          PY
          REMOTE
