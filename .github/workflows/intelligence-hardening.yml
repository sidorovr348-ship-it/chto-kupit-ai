name: My AI Unified — intelligence hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/intelligence-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden AI routing and frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Backend: make the AI itself the dispatcher; do not let the UI decide whether
          # a normal question is shopping/search. Keep explicit tools, but centralize routing.
          p=Path('local-gateway.js')
          s=p.read_text(encoding='utf-8')
          old="const wantsSearch=q=>/(найди|найти|кто сейчас|что сейчас|сегодня|сейчас|последн|новост|источник|ссылк|актуальн|обновл|на данный момент|прямо сейчас|сколько стоит|какая цена|время в|курс|погода|температур|прогноз|расписани|результат|событи|выпуск|версия)/iu.test(q);"
          new="const wantsSearch=q=>/(найди|найти|поищи|поиск|кто сейчас|что сейчас|сегодня|сейчас|последн|новост|источник|ссылк|актуальн|обновл|на данный момент|прямо сейчас|сколько стоит|какая цена|время в|курс|погода|температур|прогноз|расписани|результат|событи|выпуск|версия|проверь|узнай|сравни|исследуй)/iu.test(q);"
          if old in s: s=s.replace(old,new,1)
          # Never classify a generic mention of a product/brand as a purchase request.
          old2="const wantsShopping=q=>/(где купить|купить|заказать|закажи|цена на|стоимость|в наличии|дешевле|самая низкая цена|самый дешёвый|самый дешевый|магазин|продаж[ае]|сравни цены|сравни.*вариант|подбери.*магазин|подбери.*товар|найди.*магазин|найди.*товар|есть ли в продаже|можно заказать)/iu.test(q);"
          new2="const wantsShopping=q=>/(где купить|купить|заказать|закажи|цена на|стоимость|в наличии|дешевле|самая низкая цена|самый дешёвый|самый дешевый|магазин|продаж[ае]|сравни цены|сравни.*вариант|подбери.*магазин|подбери.*товар|найди.*магазин|найди.*товар|есть ли в продаже|можно заказать)/iu.test(q);"
          if old2 in s: s=s.replace(old2,new2,1)
          marker="async function smartDispatch(m){"
          if marker not in s:
              anchor="app.post('/chat',async(req,res)=>{"
              dispatcher="""async function smartDispatch(m){
            const q=textOf(m);
            // Explicit action words win. A plain question stays a conversation and is never
            // accidentally sent to shopping just because it contains a product name.
            if(wantsShopping(q)&&keyOf('SERPER_API_KEY','SERPER_KEY')) return shoppingAnswer(m);
            if(wantsSearch(q)&&keyOf('SERPER_API_KEY','SERPER_KEY')) return answerWithSearch(m);
            return ask(m);
          }
          """
              if anchor not in s: raise SystemExit('chat anchor not found')
              s=s.replace(anchor,dispatcher+anchor,1)
          s=s.replace("const q=textOf(m),z=wantsShopping(q)&&keyOf('SERPER_API_KEY','SERPER_KEY')?await shoppingAnswer(m):wantsSearch(q)&&keyOf('SERPER_API_KEY','SERPER_KEY')?await answerWithSearch(m):await ask(m);", "const z=await smartDispatch(m);",1)
          # Strengthen the assistant identity/instructions without exposing internals.
          s=s.replace("Ты — «Эй», My AI Unified: умный русскоязычный помощник, который должен не просто разговаривать, а доводить задачи до результата.", "Ты — «Эй», My AI Unified. Ты должен быть заметно полезнее обычного голосового помощника: понимать естественную речь, контекст диалога, скрытое намерение и цель пользователя, а не реагировать на отдельные ключевые слова. Не ограничивайся коротким шаблонным ответом, если задача требует действия или проверки.",1)
          p.write_text(s,encoding='utf-8')

          # 2) Frontend: one universal command path. The browser must not decide that an
          # ordinary message is shopping. The server is the single dispatcher.
          p=Path('smart-index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function send(){')
          end=s.find('async function data(f){',start)
          if start<0 or end<0: raise SystemExit('frontend send function not found')
          fn="""async function send(){let t=input.value.trim();if(!t||busy)return;add(t,'user');input.value='';messages.push({role:'user',content:t});let w=add('⏳');busy=true;try{let loc={};if(/запомни.*местоположени|построй.*маршрут/iu.test(t)&&navigator.geolocation){loc=await new Promise(r=>navigator.geolocation.getCurrentPosition(p=>r({location:{lat:p.coords.latitude,lon:p.coords.longitude}}),()=>r({}),{enableHighAccuracy:true,timeout:5000,maximumAge:60000}))}let j=await api('/chat',{prompt:t,messages,memoryId:MEMORY_ID,...loc},180000);w.remove();if(j.routeUrl){let d=add(j.result||'Маршрут построен.');let a=document.createElement('a');a.href=j.routeUrl;a.target='_blank';a.rel='noopener';a.textContent='🗺️ Открыть маршрут на карте';d.append(a);say(j.result||'Маршрут построен.')}else if(j.results&&j.results.length){for(let x of j.results.slice(0,12)){let d=add(`${x.store||x.merchant||'Магазин'}\\n${x.title||'Товар'}\\n${x.price!=null?x.price+' '+(x.currency||'RUB'):'Цена не указана'}\\n${x.availability==='in_stock'?'🟢 В наличии':x.availability==='out_of_stock'?'🔴 Нет в наличии':'🟡 Наличие не подтверждено'}`);if(x.url){let a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent='Открыть';d.append(a)}}}else{let r=String(j.result||'');messages.push({role:'assistant',content:r});links(r);say(r)}}catch(e){w.remove();add('🔴 '+e.message)}finally{busy=false}}"""
          s=s[:start]+fn+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          node --check local-gateway.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('smart-index.html').read_text(encoding='utf-8')
          assert 'async function send()' in s
          assert "api('/chat'" in s
          assert "api('/shopping'" not in s[s.find('async function send()'):s.find('async function data(f){')]
          assert 'EY_WAKE_WORD_V1' in s
          print('INTELLIGENCE_FRONTEND_OK')
          PY
      - name: Commit hardened version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-gateway.js smart-index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
          else
            git commit -m 'Harden intelligent routing and assistant behavior'
            git push
          fi
