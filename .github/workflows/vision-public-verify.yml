name: My AI Unified — vision public verify

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public vision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/photo.json
          import base64,json
          b=base64.b64decode('')
          print(json.dumps({'images':['data:image/png;base64,'+base64.b64encode(b).decode()],'prompt':'Кратко опиши это изображение. Ответь по-русски.'}))
          PY
          set +e
          curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 --max-time 120 -X POST 'https://ai.aliceq.ru/photo' -H 'Content-Type: application/json' --data-binary @/tmp/photo.json >/tmp/photo.out 2>/tmp/photo.err
          rc=$?
          set -e
          echo "CURL_RC=$rc"
          echo 'PUBLIC_PHOTO_BODY'; cat /tmp/photo.out || true
          echo 'PUBLIC_PHOTO_ERR'; cat /tmp/photo.err || true
          test "$rc" = 0
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo.out'))
          assert j.get('ok') and j.get('result'),j
          print('PUBLIC_PHOTO_OK',j.get('provider'),j.get('model'))
          PY
