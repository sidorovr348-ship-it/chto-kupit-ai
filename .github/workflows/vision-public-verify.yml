name: My AI Unified — vision public verify

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["My AI Unified — production deploy"]
    types: [completed]

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public vision after deploy
        shell: bash
        run: |
          set -euo pipefail
          sleep 25
          printf '%s\n' '{"images":["https://docs.mistral.ai/img/eiffel-tower-paris.jpg"],"prompt":"Кратко опиши это изображение. Ответь по-русски."}' >/tmp/photo.json
          set +e
          curl --silent --show-error --max-time 120 -X POST 'https://ai.aliceq.ru/photo' -H 'Content-Type: application/json' --data-binary @/tmp/photo.json >/tmp/photo.out 2>/tmp/photo.err
          rc=$?
          set -e
          echo "CURL_RC=$rc"
          echo 'PUBLIC_PHOTO_BODY'; cat /tmp/photo.out || true
          echo 'PUBLIC_PHOTO_ERR'; cat /tmp/photo.err || true
          if [ "$rc" != 0 ] || ! grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/photo.out; then
            printf '%s\n' "$VPS_SSH_KEY" >/tmp/vps_key; chmod 600 /tmp/vps_key
            ssh_opts=(-i /tmp/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15)
            scp "${ssh_opts[@]}" /tmp/photo.json "$VPS_USER@$VPS_HOST:/tmp/photo.json"
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "curl -sS -D /tmp/photo.headers -o /tmp/photo.local.out -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data-binary @/tmp/photo.json; echo LOCAL_HEADERS; cat /tmp/photo.headers; echo LOCAL_BODY; cat /tmp/photo.local.out; echo SERVICE_STATUS; systemctl --no-pager --full status my-ai-unified || true; echo SERVICE_LOG; journalctl -u my-ai-unified -n 80 --no-pager || true"
            rm -f /tmp/vps_key
            exit 1
          fi
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/photo.out'))
          assert j.get('ok') and j.get('result'),j
          print('PUBLIC_PHOTO_OK',j.get('provider'),j.get('model'))
          PY