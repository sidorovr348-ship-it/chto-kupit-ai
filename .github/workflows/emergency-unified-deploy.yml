name: My AI Unified — deterministic deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: my-ai-unified-deterministic-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Deploy exact gateway and verify full chain
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=5 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          for attempt in 1 2 3 4 5; do
            if ssh "${O[@]}" "$VPS_USER@$VPS_HOST" 'echo SSH_OK' >/tmp/ssh-ok.txt 2>/tmp/ssh-err.txt; then
              cat /tmp/ssh-ok.txt
              break
            fi
            cat /tmp/ssh-err.txt || true
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done

          WORKDIR=$(ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "systemctl show -p WorkingDirectory --value my-ai-unified")
          test -n "$WORKDIR"

          scp "${O[@]}" -q local-gateway.js "$VPS_USER@$VPS_HOST:$WORKDIR/local-gateway.js"
          scp "${O[@]}" -q package.json "$VPS_USER@$VPS_HOST:$WORKDIR/package.json"

          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" "WORKDIR='$WORKDIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$WORKDIR"
          cp -f local-gateway.js "local-gateway.js.backup-production-$(date +%Y%m%d-%H%M%S)" || true
          npm install --omit=dev --no-audit --no-fund
          node --check local-gateway.js
          NODEBIN=$(command -v node)
          install -d /etc/systemd/system/my-ai-unified.service.d
          cat >/etc/systemd/system/my-ai-unified.service.d/override.conf <<EOF
[Service]
WorkingDirectory=$WORKDIR
ExecStart=
ExecStart=$NODEBIN $WORKDIR/local-gateway.js
EnvironmentFile=/root/chto-kupit-ai.env
EnvironmentFile=-/root/my-ai-unified/.local-ai.env
Environment=PORT=3020
Restart=always
RestartSec=2
EOF
          systemctl daemon-reload
          systemctl reset-failed my-ai-unified || true
          systemctl restart my-ai-unified

          ready=0
          for i in $(seq 1 30); do
            if systemctl is-active --quiet my-ai-unified && curl -fsS --max-time 3 http://127.0.0.1:3020/health >/tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

          echo '=== LOCAL HEALTH ==='
          cat /tmp/health.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/health.json'))
          assert j.get('ok') and j.get('dispatcher'), j
          assert j.get('adapters',{}).get('groq'), j
          assert j.get('adapters',{}).get('groqVision'), j
          assert j.get('adapters',{}).get('tts'), j
          print('LOCAL_HEALTH_ASSERTIONS_OK')
          PY
          echo
          echo '=== LOCAL CHAT ==='
          curl -fsS --max-time 60 -X POST http://127.0.0.1:3020/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ГОТОВО"}' >/tmp/local-chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/local-chat.json')); assert j.get('ok') and j.get('result'), j
          print('LOCAL_CHAT_OK',j.get('result'))
          PY
          echo '=== LOCAL PHOTO ==='
          PHOTO_DATA='iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFklEQVR4nGP8z8DAwMDAwMDAwMDAAAANHQEDasKb6QAAAABJRU5ErkJggg=='
          curl -fsS --max-time 90 -X POST http://127.0.0.1:3020/photo -H 'Content-Type: application/json' --data "{\"image\":\"$PHOTO_DATA\",\"prompt\":\"Коротко скажи, что ты видишь на изображении.\"}" >/tmp/local-photo.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/local-photo.json')); assert j.get('ok') and j.get('result'), j
          print('LOCAL_PHOTO_OK',j.get('provider'),j.get('model'))
          PY
          echo '=== LOCAL TTS ==='
          curl -fsS --max-time 40 -X POST http://127.0.0.1:3020/tts -H 'Content-Type: application/json' --data '{"text":"Привет. Я My AI Unified."}' -o /tmp/tts.mp3
          test -s /tmp/tts.mp3
          file /tmp/tts.mp3
          ls -lh /tmp/tts.mp3
          echo '=== JOURNAL ==='
          journalctl -u my-ai-unified -n 60 --no-pager -o cat
          REMOTE

      - name: Verify public API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 --max-time 90 https://ai.aliceq.ru/health >/tmp/public-health.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-health.json')); assert j.get('ok') and j.get('dispatcher'), j
          assert j.get('adapters',{}).get('groq'), j
          assert j.get('adapters',{}).get('groqVision'), j
          print('PUBLIC_HEALTH_ASSERTIONS_OK')
          PY
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 --max-time 90 -X POST https://ai.aliceq.ru/chat -H 'Content-Type: application/json' --data '{"prompt":"Ответь одним словом: ГОТОВО"}' >/tmp/public-chat.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-chat.json')); assert j.get('ok') and j.get('result'), j
          print('PUBLIC_CHAT_OK')
          PY
          PHOTO_DATA='iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFklEQVR4nGP8z8DAwMDAwMDAwMDAAAANHQEDasKb6QAAAABJRU5ErkJggg=='
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 --max-time 120 -X POST https://ai.aliceq.ru/photo -H 'Content-Type: application/json' --data "{\"image\":\"$PHOTO_DATA\",\"prompt\":\"Коротко скажи, что ты видишь на изображении.\"}" >/tmp/public-photo.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-photo.json')); assert j.get('ok') and j.get('result'), j
          print('PUBLIC_PHOTO_OK',j.get('provider'),j.get('model'))
          PY
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 --max-time 60 -X POST https://ai.aliceq.ru/tts -H 'Content-Type: application/json' --data '{"text":"Привет. Это проверка голоса."}' -o /tmp/public-tts.mp3
          test -s /tmp/public-tts.mp3
          echo 'PUBLIC_TTS_OK'
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 90 -X POST https://aliceq.ru/alice -H 'Content-Type: application/json' --data '{"version":"1.0","request":{"command":"Ответь одним словом: АЛИСА_OK"},"session":{"session_id":"production"}}' >/tmp/public-alice.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/public-alice.json')); text=str(j.get('response',{}).get('text',''))
          assert text, j
          print('PUBLIC_ALICE_OK',text)
          PY
          echo 'FULL_CHAIN_OK'
