name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check server.js
      - run: node validate-inline-scripts.cjs
      - run: node --test
      - run: bash -n scripts/deploy-vps.sh scripts/rollback-vps.sh
      - run: python3 -m py_compile scripts/prepare-vps-key.py
