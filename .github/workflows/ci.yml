name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server.js
      - run: node --test
      - name: Verify public AI photo and TTS
        env:
          PHOTO_DATA: 
        run: |
          set -euo pipefail
          echo '=== PHOTO ==='
          sleep 8
          PHOTO_OUT=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 3 --max-time 180 -X POST https://ai.aliceq.ru/photo -H 'Content-Type: application/json' --data "{\"image\":\"$PHOTO_DATA\",\"prompt\":\"Коротко скажи, что ты видишь.\"}")
          echo "$PHOTO_OUT"
          echo '=== TTS ==='
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -X POST https://ai.aliceq.ru/tts -H 'Content-Type: application/json' --data '{"text":"Привет. Это проверка голоса."}' -o /tmp/tts.mp3
          test -s /tmp/tts.mp3
          file /tmp/tts.mp3
          ls -lh /tmp/tts.mp3
