name: My AI Unified — mobile end-to-end

on:
  workflow_run:
    workflows: ["My AI Unified — production deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run mobile production test
        run: node mobile-e2e.mjs
      - name: Run hands-free wake buffering test
        if: ${{ always() }}
        run: node wake-buffer-e2e.mjs
