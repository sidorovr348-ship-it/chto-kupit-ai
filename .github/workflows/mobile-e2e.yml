name: My AI Unified — mobile end-to-end

on:
  workflow_run:
    workflows: ["My AI Unified — production deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create a minimal real DOCX fixture
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path
          root = Path('/tmp/docx-fixture')
          (root/'word').mkdir(parents=True, exist_ok=True)
          (root/'[Content_Types].xml').write_text('''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>''')
          (root/'_rels').mkdir(exist_ok=True)
          (root/'_rels/.rels').write_text('''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>''')
          (root/'word/document.xml').write_text('''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>Проверка загрузки документа через мобильный интерфейс My AI Unified.</w:t></w:r></w:p></w:body></w:document>''')
          with ZipFile('/tmp/mobile-e2e.docx','w',ZIP_DEFLATED) as z:
              for p in [root/'[Content_Types].xml',root/'_rels/.rels',root/'word/document.xml']:
                  z.write(p,p.relative_to(root).as_posix())
          PY
      - name: Create deterministic fake camera stream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w,h=320,240
          y=bytes([128])*(w*h); u=bytes([128])*((w//2)*(h//2)); v=bytes([128])*((w//2)*(h//2))
          frame=y+u+v
          with open('/tmp/fake-camera.y4m','wb') as f:
            f.write(f'YUV4MPEG2 W{w} H{h} F30:1 Ip A1:1 C420jpeg\\n'.encode())
            for _ in range(90):
              f.write(b'FRAME\\n'); f.write(frame)
          PY
      - name: Run iPhone-sized production end-to-end test
        env:
          APP_URL: https://sidorovr348-ship-it.github.io/chto-kupit-ai/
          API_URL: https://ai.aliceq.ru
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const { chromium } = require('playwright');
            const fs = require('fs');
            const APP = process.env.APP_URL;
            const API = process.env.API_URL;
            const browser = await chromium.launch({ headless: true, args: ['--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream','--use-file-for-fake-video-capture=/tmp/fake-camera.y4m','--autoplay-policy=no-user-gesture-required'] });
            const context = await browser.newContext({
              permissions: ['camera', 'microphone'], viewport: { width: 393, height: 852 }, deviceScaleFactor: 3,
              isMobile: true, hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.7 Mobile/15E148 Safari/604.1'
            });
            const page = await context.newPage();
            const errors = [];
            let liveReady = false;
            for (let i=0;i<30;i++) {
              try {
                const r = await fetch(APP + '?livecheck=' + Date.now(), {cache:'no-store'});
                const t = await r.text();
                if (t.includes("API+'/voice'") && t.includes('MediaRecorder') && t.includes('EY_WAKE_WORD_V1')) { liveReady=true; break; }
              } catch {}
              await new Promise(r=>setTimeout(r,3000));
            }
            if (!liveReady) throw new Error('Pages did not expose the current voice-enabled build within 90s');
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
            page.on('requestfailed', r => errors.push(`requestfailed: ${r.method()} ${r.url()} ${r.failure()?.errorText||'unknown'}`));
            const pick = async (...ids) => {
              for (const id of ids) if (await page.locator(`#${id}`).count()) return page.locator(`#${id}`).first();
              throw new Error(`none of selectors exists: ${ids.join(', ')}`);
            };
            const countAny = async (...ids) => { let n=0; for (const id of ids) n += await page.locator(`#${id}`).count(); return n; };
            const fail = msg => { throw new Error(msg); };
            const waitAI = async (before, timeout = 30000) => {
              try { await page.waitForFunction(n => {
                const nodes = [...document.querySelectorAll('#chat .msg.ai, #chat .m.a')];
                const fresh = nodes.slice(n);
                return fresh.some(x => { const t=(x.textContent||'').trim(); return x.dataset?.e2eResponse==='1' || (t.length>0 && !t.includes('⏳')); });
              }, before, { timeout }); } catch (e) { const texts=await page.locator('#chat .msg.ai, #chat .m.a').allTextContents(); throw new Error(`AI wait timeout after ${timeout}ms; chat=${JSON.stringify(texts)}; html=${(await page.locator('#chat').innerHTML()).slice(0,5000)}; errors=${JSON.stringify(errors)}; sendOnClick=${await page.locator('#send').evaluate(el=>!!el.onclick)}`); }
              const texts = await page.locator('#chat .msg.ai, #chat .m.a').allTextContents();
              const fresh = texts.slice(before).map(x=>x.trim()).filter(Boolean);
              const latest = fresh[fresh.length-1] || '';
              if (latest.startsWith('🔴')) throw new Error('AI UI error: '+latest);
              if (latest.length < 3 || latest.includes('⏳')) throw new Error('AI UI returned empty response: '+JSON.stringify(fresh));
            };
            try {
              await page.goto(`${APP}?e2e=${Date.now()}`, { waitUntil: 'networkidle', timeout: 90000 });
              if ((await page.title()) !== 'Эй') fail(`wrong title: ${await page.title()}`);
              const send = await pick('send');
              const input = await pick('in','input');
              const voice = await pick('voice');
              const cameraButton = await pick('camBtn','camera');
              const imageButton = await pick('img','imagegen');
              const photoButton = await pick('photo');
              const fileButton = await pick('file');
              for (const id of ['video','sound','stop','clear']) if (await countAny(id) !== 1) fail(`control missing: ${id}`);

              const health = await page.evaluate(async api => { const r=await fetch(`${api}/health?mobile_e2e=${Date.now()}`); return {status:r.status,body:await r.json()}; }, API);
              if (health.status !== 200 || !health.body.ok) fail(`health failed: ${JSON.stringify(health)}`);

              // Browser-origin API probe: verify the exact cross-origin response used by the UI.
              const probe = await page.evaluate(async api => {
                try {
                  const r = await fetch(api + '/autonomy/status', {method:'GET', cache:'no-store'});
                  const text = await r.text();
                  return {status:r.status, text:text.slice(0,1000)};
                } catch (e) { return {error:String(e)}; }
              }, API);
              console.log('BROWSER_API_PROBE', JSON.stringify(probe));
              if (probe.error) fail('browser API probe failed: '+probe.error);
              let probeJson; try { probeJson=JSON.parse(probe.text); } catch {}
              if (probe.status!==200 || !probeJson?.ok || !probeJson?.autonomy) fail('browser API probe bad response: '+JSON.stringify(probe));
              // Browser-origin vision probe: isolate the photo backend from file-input/UI handling.
              const photoProbe = await page.evaluate(async api => {
                const png='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYElEQVR4nO3PQQ0AIBDAMMC/50MEj4ZkVbDtmVk/OzrgVQNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgPaBXKqA31N0fbGAAAAAElFTkSuQmCC';
                const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),90000);
                try {
                  const r=await fetch(api+'/photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images:[png],prompt:'Ответь одним словом: ОК'}),signal:ctl.signal});
                  return {status:r.status,text:(await r.text()).slice(0,1200)};
                } catch(e) { return {error:String(e)}; } finally { clearTimeout(tm); }
              }, API);
              console.log('BROWSER_PHOTO_PROBE', JSON.stringify(photoProbe));
              if (photoProbe.error) fail('browser photo probe failed: '+photoProbe.error);
              let photoProbeJson; try { photoProbeJson=JSON.parse(photoProbe.text); } catch {}
              if (photoProbe.status!==200 || !photoProbeJson?.ok || !photoProbeJson?.result) fail('browser photo probe bad response: '+JSON.stringify(photoProbe));
              
              page.on('response', async response => {
                if ((response.url().endsWith('/chat') || response.url().endsWith('/photo') || response.url().endsWith('/document')) && response.request().method()==='POST') {
                  try { console.log('UI_API_RESPONSE', response.url(), response.status(), (await response.text()).slice(0,1200)); } catch {}
                }
              });
              // 1. Chat through the real mobile UI.
              let before = await page.locator('#chat .m.a, #chat .msg.ai').count();
              await input.fill('Кто ты? Ответь одним коротким предложением.'); await send.click(); await waitAI(before,30000);

              // 2. Live camera path: permission, stream, mobile UI state, shutdown.
              await cameraButton.tap();
              await pick('camBox','cameraBox');
              await page.waitForFunction(() => { const b=document.querySelector('#camBox')||document.querySelector('#cameraBox'); const v=document.querySelector('#cam'); return b?.style.display==='block' && !!v?.srcObject?.getVideoTracks?.()[0]; }, null, {timeout:15000});
              await page.waitForFunction(() => document.querySelector('#cam')?.srcObject?.getVideoTracks?.()[0]?.readyState==='live', null, {timeout:15000});
              await (await pick('camOff')).tap();
              await page.waitForFunction(() => { const b=document.querySelector('#camBox')||document.querySelector('#cameraBox'); return b?.style.display==='none'; });

              // 3. Photo path through the real file input and public /photo backend.
              const photoInput = await pick('pi','photoInput');
              const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYElEQVR4nO3PQQ0AIBDAMMC/50MEj4ZkVbDtmVk/OzrgVQNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgPaBXKqA31N0fbGAAAAAElFTkSuQmCC','base64');
              before=await page.locator('#chat .m.a, #chat .msg.ai').count(); const photoChooserPromise=page.waitForEvent('filechooser'); await photoButton.tap(); const photoChooser=await photoChooserPromise; await photoChooser.setFiles({name:'mobile-e2e.png',mimeType:'image/png',buffer:png}); await waitAI(before,120000);

              // 4. Binary document path through the real mobile file input and /document backend.
              const fileInput = await pick('fi','fileInput');
              const docx = fs.readFileSync('/tmp/mobile-e2e.docx');
              before=await page.locator('#chat .m.a, #chat .msg.ai').count();
              const fileChooserPromise=page.waitForEvent('filechooser'); await fileButton.tap(); const fileChooser=await fileChooserPromise; await fileChooser.setFiles({name:'mobile-e2e.docx',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',buffer:docx});
              await waitAI(before,120000);

              // 5. Voice UI: permission, MediaRecorder start/stop and cleanup.
              const hasSpeechRecognition = await page.evaluate(() => !!(window.SpeechRecognition||window.webkitSpeechRecognition));
    await voice.tap();
    await page.waitForFunction(()=>document.querySelector('#voice')?.classList.contains('recording'),null,{timeout:15000});
    await voice.tap();
    await page.waitForFunction(()=>!document.querySelector('#voice')?.classList.contains('recording'),null,{timeout:15000});
    if (hasSpeechRecognition) await page.waitForTimeout(1000);

              // 6. Image-generation UI: real prompt dialog opens and can be safely cancelled.
              let dialogSeen=false; page.once('dialog',async d=>{dialogSeen=true;await d.dismiss();}); await imageButton.tap(); await page.waitForTimeout(200); if(!dialogSeen) fail('image generation prompt did not open');

              // 7. Controls remain present after the complete interaction chain.
              for (const id of ['send','voice','photo','file','sound','stop','clear']) if (await countAny(id)!==1) fail(`core control missing after interactions: ${id}`);
              if(errors.length) fail(errors.join('\n'));
              await page.screenshot({path:'mobile-e2e.png',fullPage:true});
              console.log('MOBILE_E2E_OK');
            } finally { await browser.close(); }
          })().catch(err=>{console.error(err);process.exitCode=1;});
          NODE
      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-evidence
          path: mobile-e2e.png
          if-no-files-found: ignore
