<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>My AI Unified</title><style>:root{--r:999px}*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 30px}h1{font-size:29px;margin:4px 0}.sub,.hint,.status{color:#999}.chat{min-height:58vh;background:#151518;border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto}.msg{padding:12px 14px;border-radius:20px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere}.ai{background:#222226;align-self:flex-start;max-width:96%}.user{background:#fff;color:#111;align-self:flex-end;max-width:94%}.bar{display:flex;gap:8px;margin-top:10px}.bar textarea{flex:1;border:0;border-radius:var(--r);padding:14px;background:#202024;color:#fff;font:inherit;min-height:52px}.bar button,.actions button{border:0;border-radius:var(--r);font-weight:700}.bar button{width:58px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.actions button{padding:13px 8px;background:#202024;color:#fff}.actions button.active{background:#fff;color:#111}.source{display:block;color:#9cc7ff;margin-top:6px;word-break:break-all}.result-image{max-width:100%;border-radius:18px;margin-top:8px}</style></head><body><main><h1>🧠 My AI Unified</h1><div class="sub">Один помощник. Ты говоришь, что нужно сделать.</div><div class="status" id="status">🟡 Проверяю сервер…</div><section class="chat" id="chat"><div class="msg ai">Готов. Поговори со мной, пришли фото, видео или файл.</div></section><div class="bar"><textarea id="input" placeholder="Напиши или продиктуй задачу…"></textarea><button id="send">➤</button></div><div class="actions"><button id="voice">🎙️ Голос</button><button id="photo">📷 Фото</button><button id="video">🎬 Видео</button><button id="file">📎 Файл</button><button id="sound">🔊 Звук</button><button id="reset">↻ Сначала</button></div><div class="hint">My AI Unified · ai.aliceq.ru</div><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><input id="videoInput" type="file" accept="video/*" capture="environment" hidden><input id="fileInput" type="file" accept=".txt,.md,.csv,.tsv,.json,.xml,.html,.pdf,.docx,.xlsx" hidden><script>
const API='https://ai.aliceq.ru',q=s=>document.querySelector(s),chat=q('#chat'),input=q('#input'),status=q('#status');let sound=true;function add(t,w='ai'){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}function speak(t){if(!sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).slice(0,3500));u.lang='ru-RU';u.rate=.94;speechSynthesis.speak(u)}async function api(p,b,timeout=90000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal:c.signal});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}finally{clearTimeout(tm)}}async function check(){try{const r=await fetch(API+'/health',{cache:'no-store'});if(!r.ok)throw Error();status.textContent='🟢 My AI Unified подключён'}catch{status.textContent='🔴 Сервер недоступен'}}function local(t){if(/^привет[!,. ]*$/iu.test(t))return'Привет! Я My AI Unified. Готов работать.';if(/кто ты|что ты за/u.test(t))return'Я My AI Unified — единый русскоязычный помощник.';return null}async function send(){const t=input.value.trim();if(!t)return;add(t,'user');input.value='';const l=local(t);if(l){add(l);speak(l);return}const w=add('⏳ Выполняю…');try{const j=await api('/chat',{prompt:t,location:'Россия'});w.remove();const r=j.result||j.message||'Задача выполнена.';add(r);speak(r)}catch(e){w.remove();add('🔴 '+e.message);check()}}q('#send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};q('#voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('🎙️ Используй микрофон клавиатуры iPhone.');return}const r=new R();r.lang='ru-RU';r.onresult=e=>{input.value=e.results[0][0].transcript;send()};r.start()};function data(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}q('#photo').onclick=()=>q('#photoInput').click();q('#photoInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;add('📷 '+f.name,'user');const w=add('⏳ Анализирую фото…');try{const j=await api('/photo',{image:await data(f),prompt:'Проанализируй фото подробно по-русски. Если это товар, назови модель и важные характеристики.'});w.remove();add(j.result||'Фото обработано.');speak(j.result||'Фото обработано.')}catch(x){w.remove();add('🔴 '+x.message)}e.target.value=''};q('#video').onclick=()=>q('#videoInput').click();q('#videoInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;add('🎬 '+f.name,'user');const w=add('⏳ Анализирую кадр видео…');try{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(f);await new Promise((ok,no)=>{v.onloadeddata=()=>{v.currentTime=Math.min(4,v.duration||0);v.onseeked=ok};v.onerror=no});const c=document.createElement('canvas');c.width=Math.min(1280,v.videoWidth);c.height=Math.round(c.width*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);const j=await api('/photo',{image:c.toDataURL('image/jpeg',.82),prompt:'Это кадр из видео. Проанализируй происходящее и видимые товары.'});w.remove();add(j.result||'Видео обработано.')}catch(x){w.remove();add('🔴 '+x.message)}e.target.value=''};q('#file').onclick=()=>q('#fileInput').click();q('#fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;add('📎 '+f.name,'user');const w=add('⏳ Читаю файл…');try{const text=await f.text();const j=await api('/chat',{prompt:`Проанализируй файл «${f.name}» по-русски:\n\n${text.slice(0,120000)}`});w.remove();add(j.result||'Файл обработан.')}catch(x){w.remove();add('🔴 '+x.message)}e.target.value=''};q('#sound').onclick=()=>{sound=!sound;q('#sound').textContent=sound?'🔊 Звук':'🔇 Звук выкл';if(!sound)speechSynthesis?.cancel()};q('#reset').onclick=()=>{speechSynthesis?.cancel();chat.innerHTML='<div class="msg ai">Готов. Скажи, что нужно сделать.</div>';input.value=''};check();</script></main></body></html>
