<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Эй — подключение GitHub</title>
  <style>
    body{font:16px system-ui,-apple-system,sans-serif;max-width:520px;margin:8vh auto;padding:24px;line-height:1.5;background:#111827;color:#f9fafb}
    input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font:inherit;margin-top:12px}
    input{background:#1f2937;color:#fff;border:1px solid #4b5563}
    button{background:#2563eb;color:white;border:0;font-weight:600}
    button.secondary{background:#374151}
    button:disabled{opacity:.6}
    #status{min-height:3em;color:#d1d5db;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <h1>Подключение GitHub</h1>
  <p>Введите секрет владельца из настроек Vercel Preview. Он не сохраняется в браузере и используется только для защищённых маршрутов этого Preview.</p>
  <label for="token">Секрет владельца</label>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="connect" type="button">Подключить GitHub</button>
  <button id="statusBtn" class="secondary" type="button">Проверить подключение</button>
  <button id="toolsBtn" class="secondary" type="button">Показать безопасные инструменты</button>
  <button id="smokeBtn" class="secondary" type="button">Выполнить безопасную проверку GitHub</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
    const button=document.getElementById('connect');
    const input=document.getElementById('token');
    const status=document.getElementById('status');
    const actions=[button,document.getElementById('statusBtn'),document.getElementById('toolsBtn'),document.getElementById('smokeBtn')];
    async function request(path,method='GET'){
      const token=input.value.trim();
      if(!token)throw Error('Введите секрет владельца.');
      const response=await fetch(path,{method,headers:{Authorization:'Bearer '+token}});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw Error(data.error||('Ошибка '+response.status));
      return data;
    }
    async function run(button,work,message){
      actions.forEach(x=>x.disabled=true);status.textContent=message;
      try{const result=await work();status.textContent=JSON.stringify(result,null,2)}
      catch(error){status.textContent=error.message||'Операция не выполнена.'}
      finally{actions.forEach(x=>x.disabled=false)}
    }
    button.addEventListener('click',()=>run(button,async()=>{
      const data=await request('/api/composio/github/connect','POST');
      if(!data.redirectUrl)throw Error('Composio не вернул ссылку подключения.');
      input.value='';status.textContent='Перехожу к авторизации GitHub…';
      window.location.assign(data.redirectUrl);
      return {ok:true};
    },'Создаю защищённую ссылку GitHub…'));
    document.getElementById('statusBtn').addEventListener('click',()=>run(button,()=>request('/api/composio/github/status'),'Проверяю подключение…'));
    document.getElementById('toolsBtn').addEventListener('click',()=>run(button,()=>request('/api/composio/github/tools'),'Получаю список инструментов…'));
    document.getElementById('smokeBtn').addEventListener('click',()=>run(button,()=>request('/api/composio/github/smoke','POST'),'Выполняю только read-only проверку GitHub…'));
  </script>
</body>
</html>
