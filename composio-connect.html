<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Эй — подключение GitHub</title>
  <style>
    body{font:16px system-ui,-apple-system,sans-serif;max-width:520px;margin:12vh auto;padding:24px;line-height:1.5;background:#111827;color:#f9fafb}
    input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font:inherit;margin-top:12px}
    input{background:#1f2937;color:#fff;border:1px solid #4b5563}
    button{background:#2563eb;color:white;border:0;font-weight:600}
    button:disabled{opacity:.6}
    #status{min-height:3em;color:#d1d5db}
  </style>
</head>
<body>
  <h1>Подключение GitHub</h1>
  <p>Введите секрет владельца, сохранённый в Vercel Preview. Он не сохраняется в браузере и не отправляется никуда, кроме защищённого маршрута приложения.</p>
  <label for="token">Секрет владельца</label>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="connect" type="button">Подключить GitHub</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
    const button=document.getElementById('connect');
    const input=document.getElementById('token');
    const status=document.getElementById('status');
    button.addEventListener('click',async()=>{
      const token=input.value.trim();
      if(!token){status.textContent='Введите секрет владельца.';return;}
      button.disabled=true;status.textContent='Создаю защищённую ссылку GitHub…';
      try{
        const response=await fetch('/api/composio/github/connect',{method:'POST',headers:{Authorization:'Bearer '+token}});
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.error||('Ошибка '+response.status));
        if(!data.redirectUrl)throw new Error('Composio не вернул ссылку подключения.');
        input.value='';status.textContent='Перехожу к авторизации GitHub…';
        window.location.assign(data.redirectUrl);
      }catch(error){status.textContent=error.message||'Не удалось подключить GitHub.';button.disabled=false;}
    });
  </script>
</body>
</html>
